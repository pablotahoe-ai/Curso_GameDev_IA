<!DOCTYPE html>
<html lang="es" data-theme="pixel" data-mode="student">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAME DEV + IA — Curso interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS — dos temas: pixel (default) y minimal
   ========================================================= */
:root{
  --bg:#0b0f1e; --bg2:#121a33; --panel:#161f3d; --panel2:#1d2850;
  --line:#2b3a6b; --text:#e9eefc; --muted:#98a6cf; --dim:#5f6d99;
  --acc:#3ee6ff; --acc2:#ff5fb4; --acc3:#ffd23f; --acc4:#7cff6b; --danger:#ff5a5a;
  --e1:#3ee6ff; --e2:#ff5fb4; --e3:#ffd23f; --e4:#7cff6b;
  --cur:var(--e1);
  --font-ui:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --font-px:'Press Start 2P','Courier New',monospace;
  --font-head:var(--font-px);
  --radius:0px; --bw:3px; --shadow:4px 4px 0 #000;
  --fs:16px;
}
html[data-theme="minimal"]{
  --bg:#0f1117; --bg2:#151821; --panel:#1a1e2a; --panel2:#222736;
  --line:#2c3344; --text:#f1f3f8; --muted:#9aa3b8; --dim:#5d667a;
  --font-head:var(--font-ui);
  --radius:12px; --bw:1px; --shadow:0 6px 24px rgba(0,0,0,.35);
}
html[data-theme="neo"]{
  --bg:#1b2130; --bg2:#1b2130; --panel:#1b2130; --panel2:#222a3b;
  --line:#1b2130; --text:#eef2fb; --muted:#9aa6c4; --dim:#5f6b88;
  --font-head:var(--font-ui);
  --radius:18px; --bw:0px; --shadow:8px 8px 16px rgba(0,0,0,.55),-6px -6px 14px rgba(255,255,255,.05);
  --soft:6px 6px 12px rgba(0,0,0,.5),-5px -5px 10px rgba(255,255,255,.05);
  --inset:inset 4px 4px 8px rgba(0,0,0,.5),inset -4px -4px 8px rgba(255,255,255,.05);
}
html[data-theme="glass"]{
  --gb:14px; --ga:.09;
  --bg:#0b1230; --bg2:rgba(255,255,255,calc(var(--ga) * .6)); --panel:rgba(255,255,255,var(--ga)); --panel2:rgba(255,255,255,calc(var(--ga) * 1.4));
  --line:rgba(255,255,255,.22); --text:#f4f6ff; --muted:#b8c2e6; --dim:#7d88b3;
  --font-head:var(--font-ui);
  --radius:16px; --bw:1px; --shadow:0 10px 40px rgba(0,0,0,.35);
}
/* día */
html[data-light="1"]{ --bg:#eef1f8; --bg2:#e3e8f3; --panel:#ffffff; --panel2:#e9edf7; --line:#c7d0e4; --text:#141a2e; --muted:#4a5775; --dim:#8a94b0;
  --acc:#0894b3; --acc2:#d5368b; --acc3:#c99400; --acc4:#2f9e44; --danger:#d93838; --e1:#0894b3; --e2:#d5368b; --e3:#c99400; --e4:#2f9e44; }
html[data-light="1"][data-theme="pixel"]{ --shadow:4px 4px 0 #9aa3b8; }
html[data-light="1"][data-theme="neo"]{ --bg:#e3e8f0; --bg2:#e3e8f0; --panel:#e3e8f0; --panel2:#eaeef5; --line:#e3e8f0;
  --shadow:8px 8px 16px rgba(163,177,198,.7),-8px -8px 16px rgba(255,255,255,.9); --soft:5px 5px 10px rgba(163,177,198,.6),-5px -5px 10px rgba(255,255,255,.9); --inset:inset 4px 4px 8px rgba(163,177,198,.6),inset -4px -4px 8px rgba(255,255,255,.9); }
html[data-light="1"][data-theme="glass"]{ --bg:#dfe6ff; --bg2:rgba(255,255,255,calc(var(--ga) * 3)); --panel:rgba(255,255,255,calc(var(--ga) * 4)); --panel2:rgba(255,255,255,calc(var(--ga) * 5)); --line:rgba(20,30,80,.15); --text:#141a2e; --muted:#45506f; --dim:#8a94b0; --shadow:0 10px 40px rgba(40,60,120,.18); }
html[data-mode="present"]{ --fs:19px; }
#index,.ocem{display:none!important}
#body{grid-template-columns:1fr}
html{scroll-snap-type:y proximity;scroll-padding-top:var(--chrome-top,120px)}
:root{--chrome-top:120px;--chrome-bottom:64px;--headh:90px}
main#view{padding:16px clamp(16px,3vw,48px) 0;max-width:1700px}
.block-head{margin-bottom:12px;padding-bottom:10px}
.section{min-height:calc(100vh - var(--chrome-top) - var(--chrome-bottom) - 16px);scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;padding:0 0 16px;box-sizing:border-box}
.section.first{justify-content:flex-start}
.section.single{justify-content:flex-start;scroll-snap-align:start;scroll-snap-stop:normal}
.home-s{min-height:calc(100vh - var(--chrome-top) - var(--chrome-bottom) - 16px);scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding-bottom:16px}
.home-s .sec-body{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vh,18px);width:100%}
.sec-body{width:100%}
.home-s .hero-game{width:min(100%,calc(var(--hero-h,420px) * 16 / 9),1280px)}
.home-s h1{max-width:34ch;margin:0 auto;font-size:clamp(1.3em,2.6vw,2.4em);line-height:1.15;text-wrap:balance}
html[data-theme="pixel"] .home-s h1{font-size:clamp(1em,1.9vw,1.7em);line-height:1.35}
.home-s .lead{max-width:62ch;margin:0 auto;font-size:clamp(1em,1.35vw,1.35em);color:var(--muted);text-wrap:balance}
.home-s .stat-row{margin:0}
.home-s .grid.home4{width:100%;gap:clamp(10px,1.2vw,18px);text-align:left}
.home-s .enc-card{padding:clamp(12px,1.2vw,18px)}
.home-s .enc-card h3{font-size:clamp(.9em,1.15vw,1.15em)}
html[data-theme="pixel"] .home-s .enc-card h3{font-size:clamp(.6em,.78vw,.78em);line-height:1.5}
.home-s .scroll-hint{font-size:.8em;color:var(--dim);animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.sec-tag{scroll-margin-top:var(--chrome-top)}
.cover{justify-content:center;text-align:left}
.cover .block-head{border:0;margin:0 0 18px;padding:0;display:block}
.cover h1{font-size:clamp(1.8em,3.4vw,3.2em);margin:8px 0 14px;max-width:24ch;text-wrap:balance}
html[data-theme="pixel"] .cover h1{font-size:clamp(1.2em,2.2vw,2.1em);line-height:1.3}
.cover .intro{font-size:clamp(1em,1.4vw,1.3em);color:var(--muted);max-width:60ch;margin:0 0 18px}
.agenda{display:grid;gap:8px;max-width:760px}
.agenda.two{grid-template-columns:1fr 1fr;max-width:1100px}
.agenda .ag{padding:7px 12px}
.agenda .ag{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:10px 14px;background:var(--bg2);border:var(--bw) solid var(--line);border-radius:var(--radius);cursor:pointer}
.agenda .ag:hover{border-color:var(--cur)}
.agenda .ag .n{font-family:var(--font-px);color:var(--cur);font-size:.75em}
html[data-theme="minimal"] .agenda .ag .n,html[data-theme="neo"] .agenda .ag .n,html[data-theme="glass"] .agenda .ag .n{font-family:var(--font-ui);font-weight:800}
.cover .chips{margin-top:4px}
.home .grid.home4{gap:12px}
.home .enc-card{padding:14px}
.hero-game{position:relative;display:block;margin:0 auto}
.hero-game canvas{width:100%;max-width:none;display:block}
.hero-ctl-row{display:flex;gap:8px;justify-content:center;margin-top:-4px}
.hero-game:fullscreen{display:flex;align-items:center;justify-content:center;background:#000;width:100vw}
.hero-game:fullscreen .gm-shell{width:min(100vw,calc(100vh * 16 / 9));border:0}
.enc-card.soon-card{opacity:.55;filter:saturate(.4)}
.enc-card.soon-card:hover{opacity:.85}
/* secciones */
.section{position:relative;margin:0;border-bottom:1px dashed var(--line)}
.section:last-child{border-bottom:0}
.sec-tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-ui);font-weight:700;letter-spacing:.12em;font-size:.72em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.sec-tag b{color:var(--cur)}
.sec-title{margin-bottom:12px}
html[data-mode="present"] .section{border:0}
.dyn{border:var(--bw) solid var(--line);border-top:8px solid var(--cur);background:var(--panel);padding:18px;border-radius:var(--radius);box-shadow:var(--shadow)}
.dyn .ocem{margin:6px 0 12px}
.dyn .activity{margin:0}
/* tarjetas con videíto */
.idea{cursor:pointer;transition:transform .08s;display:flex;flex-direction:column;gap:8px}
.idea:hover{border-color:var(--cur);transform:translateY(-3px)}
.idea canvas{height:clamp(60px,var(--vis-h,150px),150px);width:auto;max-width:100%;margin:0 auto;image-rendering:pixelated;background:#000;border:1px solid var(--line);border-radius:var(--radius)}
.idea h3{font-size:clamp(.8em,1.1vw,1.05em)}
html[data-theme="pixel"] .idea h3{font-size:clamp(.6em,.8vw,.78em)}
.idea{padding:clamp(10px,1.2vw,16px);gap:6px}
.grid.c3.fixed{gap:clamp(10px,1.2vw,16px)}
.idea p{margin:0;font-size:.9em;color:var(--muted)}
.idea .go{font-size:.75em;color:var(--cur);margin-top:auto}
.grid.c3.fixed{grid-template-columns:repeat(3,1fr)}
.grid.c2.fixed{grid-template-columns:repeat(2,1fr)}
.grid.c5.fixed{grid-template-columns:repeat(5,1fr)}
.grid.c5.fixed .card{padding:18px 18px 20px}.grid.c5.fixed .card p{font-size:1.12em;line-height:1.5}.grid.c5.fixed .card .cn{font-size:.95em}
@media (max-width:1100px){.grid.c5.fixed{grid-template-columns:repeat(3,1fr)}}
.card .cn{font-family:var(--font-px);font-size:.6em;color:var(--cur);display:block;margin-bottom:6px}
html[data-theme="minimal"] .card .cn,html[data-theme="neo"] .card .cn,html[data-theme="glass"] .card .cn{font-family:var(--font-ui);font-weight:800;font-size:.75em;letter-spacing:.1em}
.card p{margin:0;font-size:clamp(.82em,.95vw,.95em);line-height:1.45}
.card h3{font-size:clamp(.85em,1.05vw,1.05em)}
html[data-theme="pixel"] .card h3{font-size:clamp(.6em,.75vw,.78em);line-height:1.5}
.concept{display:flex;gap:12px;align-items:flex-start;padding:10px 14px}
.concept .cn{margin:2px 0 0;min-width:28px}
.concept h3{margin-bottom:2px}
.concepts{gap:8px}
.checklist-2{column-count:2;column-gap:14px}
/* árbol de proyecto */
.tree-g{font-family:var(--font-ui)}
.tg{display:grid;grid-template-columns:28px auto 1fr;gap:8px;align-items:center;padding:7px 10px;background:var(--bg2);border:var(--bw) solid var(--line);border-radius:var(--radius);margin:5px 0}
.tg .ic{font-size:1.1em;text-align:center}
.tg b{font-family:'Courier New',ui-monospace,monospace;color:var(--acc3);font-size:.95em}
.tg span:last-child{color:var(--muted);font-size:.8em}
.tg.root b{color:var(--cur);font-size:1.05em}
.tg.dim{opacity:.7}
.tg-kids{margin-left:22px;padding-left:12px;border-left:2px dashed var(--line)}
.step-c .cn{font-size:.75em}
html[data-mode="present"] .prompt-box pre{max-height:52vh;font-size:clamp(.8em,1vw,1em)}
@media (max-width:900px){.grid.c3.fixed{grid-template-columns:1fr}}
/* anatomía con iconos */
.anat{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:clamp(8px,1vw,14px)}
.anat canvas{width:clamp(36px,3vw,52px);height:clamp(36px,3vw,52px);image-rendering:pixelated;background:#000;border:1px solid var(--line);flex:none;border-radius:var(--radius)}
.anat h4{margin:0 0 2px;font-size:.7em}
.anat h3{margin:0 0 4px;font-size:clamp(.85em,1.05vw,1.05em)}
html[data-theme="pixel"] .anat h3{font-size:clamp(.6em,.75vw,.75em)}
.anat p{font-size:clamp(.78em,.9vw,.9em);line-height:1.4}
.anat .ex{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.anat .ex span{font-size:.68em;border:1px solid var(--line);padding:1px 6px;color:var(--muted);border-radius:var(--radius)}
.grid.c3.fixed{gap:clamp(8px,1vw,14px)}
/* core loop con animación */
.loop-detail{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center}
.loop-detail canvas{width:min(200px,calc(var(--vis-h,150px) * 16 / 9));height:auto;image-rendering:pixelated;background:#000;border:1px solid var(--line);border-radius:var(--radius)}
@media (max-width:700px){.loop-detail{grid-template-columns:1fr}}
.loop .node canvas{display:block;margin:0 auto 6px;width:32px;height:32px;image-rendering:pixelated}
/* sección de juego */
.gsec{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:22px;align-items:start}
.gsec .game-wrap{margin:0}
.gsec .info h2{font-size:clamp(1.1em,1.8vw,1.7em)}
.gsec .info p{font-size:clamp(.95em,1.15vw,1.15em);line-height:1.55}
@media (max-width:900px){.gsec{grid-template-columns:1fr}}
.gsec .info .ex{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.gsec .info .ex span{font-size:.78em;border:1px solid var(--line);padding:3px 8px;color:var(--muted);border-radius:var(--radius)}
.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:900px){.dims{grid-template-columns:1fr}}
.dims .card canvas{width:100%;height:auto;image-rendering:pixelated;background:#000;border:1px solid var(--line);margin-bottom:8px}
.persp{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.persp{grid-template-columns:1fr}}
/* inicio compacto */
.hero{padding:0}
.hero canvas{width:min(100%,560px)}
.hero h1{margin:10px 0 6px}
.hero p.lead{margin-bottom:12px}
.stat-row{margin:10px 0}
.grid.home4{grid-template-columns:repeat(4,1fr)}
@media (max-width:1100px){.grid.home4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.grid.home4{grid-template-columns:1fr}}
@media (min-width:1600px){ html[data-mode="present"]{ --fs:24px; } }

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-ui); font-size:var(--fs); line-height:1.55;
  background:var(--bg); color:var(--text);
  background-image:
    linear-gradient(var(--bg2) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg2) 1px, transparent 1px);
  background-size:32px 32px;
}
html[data-theme="minimal"] body,html[data-theme="neo"] body{background-image:none}
html[data-theme="glass"] body{background-image:radial-gradient(1200px 600px at 10% 0%,rgba(62,230,255,.25),transparent 60%),radial-gradient(900px 600px at 90% 20%,rgba(255,95,180,.25),transparent 60%),radial-gradient(900px 700px at 50% 100%,rgba(124,255,107,.18),transparent 60%);background-attachment:fixed;background-size:auto}
html[data-light="1"][data-theme="glass"] body{background-image:radial-gradient(1200px 600px at 10% 0%,rgba(62,230,255,.45),transparent 60%),radial-gradient(900px 600px at 90% 20%,rgba(255,95,180,.35),transparent 60%),radial-gradient(900px 700px at 50% 100%,rgba(124,255,107,.3),transparent 60%)}
html[data-theme="glass"] header#top,html[data-theme="glass"] footer#navbar,html[data-theme="glass"] #progress{background:rgba(10,16,48,.72)}
html[data-light="1"][data-theme="glass"] header#top,html[data-light="1"][data-theme="glass"] footer#navbar,html[data-light="1"][data-theme="glass"] #progress{background:rgba(255,255,255,.72)}
html[data-theme="glass"] header#top,html[data-theme="glass"] footer#navbar,html[data-theme="glass"] aside#index,html[data-theme="glass"] #progress,html[data-theme="glass"] .panel,html[data-theme="glass"] .card,html[data-theme="glass"] .enc-card,html[data-theme="glass"] .modal,html[data-theme="glass"] .dyn,html[data-theme="glass"] .prompt-box,html[data-theme="glass"] .def,html[data-theme="glass"] .check,html[data-theme="glass"] .activity{backdrop-filter:blur(var(--gb));-webkit-backdrop-filter:blur(var(--gb))}
html[data-theme="neo"] .card,html[data-theme="neo"] .enc-card,html[data-theme="neo"] .btn,html[data-theme="neo"] .tab,html[data-theme="neo"] .seg,html[data-theme="neo"] .chip,html[data-theme="neo"] .def,html[data-theme="neo"] .check,html[data-theme="neo"] .prompt-box,html[data-theme="neo"] .dyn,html[data-theme="neo"] .node,html[data-theme="neo"] .pill,html[data-theme="neo"] .idx-item.on{box-shadow:var(--soft)}
html[data-theme="neo"] .field input,html[data-theme="neo"] .field textarea,html[data-theme="neo"] .bar,html[data-theme="neo"] .glo-tools input,html[data-theme="neo"] .code,html[data-theme="neo"] .prompt-box pre,html[data-theme="neo"] .game-stage{box-shadow:var(--inset)}
html[data-theme="neo"] .btn:active,html[data-theme="neo"] .seg button.on,html[data-theme="neo"] .pill.on{box-shadow:var(--inset)}
html[data-theme="neo"] .btn.primary,html[data-theme="neo"] .seg button.on,html[data-theme="neo"] .pill.on,html[data-theme="neo"] .tab.on{background:var(--panel2);color:var(--cur);border:0}
html[data-theme="neo"] h1,html[data-theme="neo"] h2,html[data-theme="neo"] h3{font-weight:700}
html[data-theme="neo"] .prompt-box pre,html[data-theme="neo"] .code{background:var(--bg)}
html[data-theme="glass"] .btn.primary{background:var(--cur);color:#000}
html[data-light="1"] .prompt-box{background:var(--panel)} html[data-light="1"] .prompt-box pre{color:var(--text);background:#f6f8fc} html[data-light="1"] .code{background:#f6f8fc;color:var(--text)}
html[data-light="1"] .btn.primary,html[data-light="1"] .seg button.on,html[data-light="1"] .pill.on,html[data-light="1"] .loop .node.on,html[data-light="1"] .check.done .box,html[data-light="1"] .glo-cat button.on,html[data-light="1"] #toast{color:#fff}
html[data-light="1"] #toast{border-color:var(--line)}
html[data-light="1"][data-theme="neo"] .btn.primary,html[data-light="1"][data-theme="neo"] .seg button.on,html[data-light="1"][data-theme="neo"] .pill.on,html[data-light="1"][data-theme="neo"] .tab.on{color:var(--cur);background:var(--panel2);font-weight:800}
html[data-theme="neo"] .loop .node.on,html[data-theme="neo"] .check.done .box,html[data-theme="neo"] .glo-cat button.on{background:var(--cur);color:#000}
/* scanlines sutiles sólo en pixel */
html[data-theme="pixel"]:not([data-light="1"]) body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:9000;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.09) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply;
}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea{font-family:inherit;font-size:1em;color:var(--text)}
a{color:var(--acc)}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.3}
html[data-theme="pixel"] h1{font-size:clamp(1em,1.6vw,1.5em);letter-spacing:0}
html[data-theme="pixel"] h2{font-size:1.1em}
html[data-theme="pixel"] h3{font-size:.8em}
html[data-theme="pixel"] h4{font-size:.65em;color:var(--muted)}
html[data-theme="minimal"] h1{font-size:clamp(1.5em,2.2vw,2.2em);font-weight:700;letter-spacing:-.02em}
html[data-theme="minimal"] h2{font-size:1.5em;font-weight:700}
html[data-theme="minimal"] h3{font-size:1.1em;font-weight:600}
html[data-theme="minimal"] h4{font-size:.85em;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
p{margin:.4em 0 .9em}
ul.clean{list-style:none}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:.85em}
.px{font-family:var(--font-px);font-size:.7em;letter-spacing:0}
html[data-theme="minimal"] .px{font-family:var(--font-ui);font-weight:700;font-size:.8em;text-transform:uppercase;letter-spacing:.1em}
.acc{color:var(--cur)}

/* =========================================================
   LAYOUT
   ========================================================= */
#app{display:grid;grid-template-rows:auto auto 1fr auto;min-height:100vh}
header#top{
  display:flex;align-items:center;gap:12px;flex-wrap:nowrap;
  padding:6px 14px;background:var(--panel);border-bottom:var(--bw) solid var(--line);
  position:sticky;top:0;z-index:50;min-height:52px;
}
#encnav{margin-left:auto;margin-right:auto}
.ic{width:36px;height:36px;border:var(--bw) solid var(--line);background:var(--panel2);border-radius:var(--radius);font-size:1em;display:grid;place-items:center;flex:none}
.ic:hover{border-color:var(--cur)}
html[data-theme="pixel"] .ic{box-shadow:3px 3px 0 #000}
.pop{position:fixed;top:60px;right:14px;z-index:60;background:var(--panel);border:var(--bw) solid var(--cur);border-radius:var(--radius);padding:12px;display:grid;gap:10px;min-width:300px;box-shadow:var(--shadow)}
.pop-row{display:flex;align-items:center;gap:10px}
.pop-lab{font-size:.75em;color:var(--muted);min-width:46px;font-weight:600}
@media (max-width:900px){#logo .t{display:none} .tab{padding:6px 8px}}
#logo{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
#logo canvas{image-rendering:pixelated;width:40px;height:40px}
#logo .t{font-family:var(--font-px);font-size:.62em;line-height:1.4;white-space:nowrap}
html[data-theme="minimal"] #logo .t{font-family:var(--font-ui);font-weight:800;font-size:1em}
#logo .t small{display:block;color:var(--muted);font-size:.7em}
#logo .ver{font-family:var(--font-ui);font-size:.7em;color:var(--cur);border:1px solid var(--cur);padding:0 5px;border-radius:999px;margin-left:6px;vertical-align:middle;font-weight:700}
nav#encnav{display:flex;gap:6px;flex-wrap:nowrap}
.tab{
  border:var(--bw) solid var(--line);background:var(--bg2);padding:7px 10px;
  font-family:var(--font-px);font-size:.55em;border-radius:var(--radius);
  display:flex;align-items:center;gap:8px;color:var(--muted);
}
html[data-theme="minimal"] .tab{font-family:var(--font-ui);font-weight:600;font-size:.85em}
.tab .dot{width:10px;height:10px;background:var(--c);display:inline-block;border-radius:var(--radius)}
.tab.on{color:var(--text);border-color:var(--c);box-shadow:inset 0 -4px 0 var(--c)}
.tab.locked{opacity:.75}
.tab:hover{color:var(--text)}
#tools{display:flex;gap:6px;flex-wrap:nowrap}
.btn{
  border:var(--bw) solid var(--line);background:var(--panel2);padding:8px 12px;
  border-radius:var(--radius);font-weight:600;font-size:.85em;
  display:inline-flex;align-items:center;gap:8px;transition:transform .05s;
}
.btn:hover{border-color:var(--cur)}
.btn:active{transform:translate(2px,2px)}
.btn.primary{background:var(--cur);color:#000;border-color:var(--cur)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:.78em}
.btn.px{font-family:var(--font-px);font-size:.6em}
html[data-theme="pixel"] .btn{box-shadow:3px 3px 0 #000}
html[data-theme="pixel"] .btn:active{box-shadow:1px 1px 0 #000}
.btn[disabled]{opacity:.4;pointer-events:none}
.seg{display:inline-flex;border:var(--bw) solid var(--line);border-radius:var(--radius);overflow:hidden}
.seg button{border:0;background:var(--bg2);padding:7px 11px;font-size:.78em;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--cur);color:#000}

/* barra de progreso del encuentro */
#progress{background:var(--bg2);border-bottom:var(--bw) solid var(--line);padding:4px 14px 5px;display:none;position:sticky;top:var(--toph,52px);z-index:45}
#progress.show{display:block}
.timeline{display:flex;gap:2px;height:6px;margin-top:4px}
.timeline .seg-b{background:var(--panel2);border:1px solid var(--line);flex:var(--w);cursor:pointer;position:relative}
.timeline .seg-b.done{background:var(--line)}
.timeline .seg-b.cur{background:var(--cur);border-color:var(--cur)}
.timeline .seg-b:hover::after{
  content:attr(data-tip);position:absolute;top:18px;left:0;background:#000;color:#fff;
  padding:4px 8px;font-size:.75em;white-space:nowrap;z-index:5;border:1px solid var(--line)
}
.progress-meta{display:flex;gap:8px;font-size:.78em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.progress-meta span{overflow:hidden;text-overflow:ellipsis}
html[data-mode="present"] .progress-meta .sub{display:none}

#body{display:grid;grid-template-columns:280px 1fr;min-height:0}
html[data-mode="present"] #body,#body.home{grid-template-columns:1fr}
#body.home aside#index{display:none}
html[data-mode="present"] aside#index{display:none}
@media (max-width:900px){#body{grid-template-columns:1fr} aside#index{display:none}}
aside#index{
  border-right:var(--bw) solid var(--line);background:var(--panel);padding:16px;
  position:sticky;top:var(--chrome-top,64px);align-self:start;max-height:calc(100vh - var(--chrome-top,64px));overflow:auto
}
aside#index h4{margin-bottom:10px}
.idx-item{
  display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:var(--radius);cursor:pointer;
  border-left:4px solid transparent;font-size:.85em;color:var(--muted)
}
.idx-item:hover{background:var(--panel2);color:var(--text)}
.idx-item.on{border-left-color:var(--cur);color:var(--text);background:var(--panel2)}
.idx-item .n{font-family:var(--font-px);font-size:.7em;min-width:28px;padding-top:3px;color:var(--cur)}
html[data-theme="minimal"] .idx-item .n{font-family:var(--font-ui);font-weight:700;font-size:.8em}
.idx-item .time{display:block;font-size:.8em;color:var(--dim)}
.idx-group{font-family:var(--font-px);font-size:.6em;color:var(--cur);margin:14px 0 6px;padding-top:10px;border-top:1px dashed var(--line);display:flex;justify-content:space-between}
html[data-theme="minimal"] .idx-group{font-family:var(--font-ui);font-weight:800;letter-spacing:.1em;font-size:.75em}
.idx-group:first-of-type{border-top:0;padding-top:0}
/* cronómetro de sección */
.secTimer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.secTimer{gap:6px}
.secTimer .dg{font-family:var(--font-px);font-size:1em;color:var(--cur);letter-spacing:1px;min-width:5em;text-align:center;background:#000;border:var(--bw) solid var(--line);padding:4px 8px;border-radius:var(--radius)}
html[data-theme="minimal"] .secTimer .dg{font-family:var(--font-ui);font-weight:800;font-variant-numeric:tabular-nums}
.secTimer .dg.alarm{color:var(--danger);animation:blink .6s steps(2) infinite}
.secTimer .dg.paused{color:var(--muted)}
.secTimer .tb{border:var(--bw) solid var(--line);background:var(--panel2);width:28px;height:28px;border-radius:var(--radius);font-size:.8em}
.secTimer .tb:hover{border-color:var(--cur)}
.secTimer .tlab{font-size:.68em;color:var(--muted);line-height:1.2}
#progress .ptop{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:nowrap}
/* modal de encuentro */
.enc-modal .blk{border:var(--bw) solid var(--line);border-left:6px solid var(--cur);padding:10px 12px;margin:8px 0;border-radius:var(--radius);background:var(--bg2)}
.enc-modal .blk h4{margin-bottom:6px;color:var(--cur)}
.enc-modal .row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:.9em;border-bottom:1px dotted var(--line)}
.enc-modal .row:last-child{border-bottom:0}
.enc-modal .row .t{color:var(--muted);white-space:nowrap}
.enc-card .sub{font-size:.85em;color:var(--muted);margin-top:6px}

main#view{padding:24px clamp(16px,4vw,56px) 48px;max-width:1280px;width:100%;margin:0 auto}
html[data-mode="present"] main#view{max-width:1500px}

footer#navbar{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 16px;background:var(--panel);border-top:var(--bw) solid var(--line);
  position:sticky;bottom:0;z-index:40
}
footer#navbar .mid{font-size:.8em;color:var(--muted);text-align:center;flex:1}

/* =========================================================
   COMPONENTES DE CONTENIDO
   ========================================================= */
.block-head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:22px;padding-bottom:16px;border-bottom:var(--bw) solid var(--line)}
.block-head .kicker{font-family:var(--font-px);font-size:.65em;color:var(--cur);margin-bottom:10px}
html[data-theme="minimal"] .block-head .kicker{font-family:var(--font-ui);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.8em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:var(--bw) solid var(--line);padding:4px 10px;font-size:.78em;border-radius:var(--radius);background:var(--bg2);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip b{color:var(--text)}
.chip.acc{border-color:var(--cur);color:var(--cur)}

.panel{background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--radius);padding:20px;margin:16px 0;box-shadow:var(--shadow)}
.panel.tight{padding:14px}
.panel h3{margin-bottom:10px}
.panel-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}

.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid.c4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{background:var(--bg2);border:var(--bw) solid var(--line);border-radius:var(--radius);padding:16px}
.card h3{margin-bottom:6px}
.card .ico{font-size:1.6em;margin-bottom:6px;display:block;font-family:var(--font-px)}
.card.clickable{cursor:pointer;transition:transform .08s}
.card.clickable:hover{border-color:var(--cur);transform:translateY(-2px)}
.card.open{border-color:var(--cur)}
.card .more{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.92em}
.card.open .more{display:block}

/* OBSERVAMOS / CONSTRUIMOS / EXPERIMENTAMOS */
.ocem{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:16px 0}
.ocem .step{border:var(--bw) solid var(--line);background:var(--bg2);padding:14px;border-radius:var(--radius);border-top:6px solid var(--c)}
.ocem .step .lab{font-family:var(--font-px);font-size:.62em;color:var(--c);margin-bottom:8px;display:flex;align-items:center;gap:8px}
html[data-theme="minimal"] .ocem .step .lab{font-family:var(--font-ui);font-weight:800;letter-spacing:.1em;font-size:.75em}
.ocem .step p{font-size:.92em;margin:0}
.ocem .step .who{font-size:.75em;color:var(--dim);margin-top:8px}

.activity{border:var(--bw) dashed var(--cur);padding:16px 18px;border-radius:var(--radius);margin:18px 0;background:rgba(255,255,255,.02)}
.activity .lab{font-family:var(--font-px);font-size:.62em;color:var(--cur);margin-bottom:8px}
html[data-theme="minimal"] .activity .lab{font-family:var(--font-ui);font-weight:800;letter-spacing:.1em;font-size:.75em}
.activity ul{margin:6px 0 0 18px}
.activity li{margin:3px 0}

.deflist{display:grid;gap:10px}
.def{display:grid;grid-template-columns:minmax(120px,180px) 1fr;gap:12px;padding:10px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius)}
.def b{color:var(--cur)}
@media (max-width:600px){.def{grid-template-columns:1fr}}

dfn{font-style:normal;border-bottom:2px dotted var(--cur);cursor:help;color:var(--text)}
dfn:hover{color:var(--cur)}

/* code / prompt */
.prompt-box{background:#070a14;border:var(--bw) solid var(--line);border-radius:var(--radius);margin:12px 0;overflow:hidden}
.prompt-box .ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.prompt-box .ph .t{font-family:var(--font-px);font-size:.62em;color:var(--cur)}
html[data-theme="minimal"] .prompt-box .ph .t{font-family:var(--font-ui);font-weight:700;letter-spacing:.08em;font-size:.78em}
.prompt-box pre{padding:14px 16px;white-space:pre-wrap;font-family:'Courier New',ui-monospace,monospace;font-size:.9em;line-height:1.5;color:#dfe6ff;max-height:420px;overflow:auto}
.prompt-box pre .ph-var{background:rgba(255,210,63,.15);color:var(--acc3);padding:0 4px;border:1px dashed var(--acc3)}
.prompt-box pre .filled{color:var(--acc4)}
.code{font-family:'Courier New',ui-monospace,monospace;background:#070a14;border:1px solid var(--line);padding:12px;font-size:.88em;white-space:pre;overflow:auto;border-radius:var(--radius);line-height:1.5}
.code .bad{background:rgba(255,90,90,.18);color:#ffb3b3}
.code .good{background:rgba(124,255,107,.15);color:#c6ffbf}
.code .cm{color:var(--dim)}
.tree{font-family:'Courier New',ui-monospace,monospace;font-size:.95em;line-height:1.7}
.tree .f{color:var(--acc3)} .tree .d{color:var(--acc)}
.tree span[data-tip]{cursor:help;border-bottom:1px dotted var(--dim)}

/* juegos */
.game-wrap{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.game-stage{position:relative;background:#000;border:var(--bw) solid var(--line);border-radius:var(--radius);overflow:hidden;width:min(100%,calc(var(--game-h,520px) * 16 / 9));margin:0 auto}
.game-side{width:min(100%,calc(var(--game-h,520px) * 16 / 9));margin:0 auto}
.game-stage canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;outline:none;margin:0 auto}
.game-stage canvas:focus{box-shadow:inset 0 0 0 3px var(--cur)}
.game-stage .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(5,8,20,.72);text-align:center;padding:20px;cursor:pointer}
.game-stage .overlay .px{font-size:.9em}
.game-stage .overlay.hidden{display:none}
.game-side{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 12px;background:var(--bg2);border:var(--bw) solid var(--line);border-radius:var(--radius)}
.game-side .hud{display:flex;gap:6px 16px;flex-wrap:wrap;font-family:var(--font-ui);font-size:.8em;font-weight:600;color:var(--muted);letter-spacing:.02em}
.game-side .hud .h{white-space:nowrap}
.game-side .hud b{color:var(--cur)}
.game-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dpad{display:flex;gap:4px;user-select:none;touch-action:none}
.dpad button{width:32px;height:32px;border:var(--bw) solid var(--line);background:var(--panel2);font-size:.85em;border-radius:var(--radius)}
.dpad button:active,.dpad button.down{background:var(--cur);color:#000}
.dpad .act{width:44px}
.dpad.hide-act .act{display:none}
.keys{font-size:.75em;color:var(--muted);display:flex;gap:2px;align-items:center;flex-wrap:wrap}
kbd{font-family:'Courier New',monospace;background:var(--panel2);border:1px solid var(--line);border-bottom-width:3px;padding:1px 6px;border-radius:4px;font-size:.9em}
html[data-mode="present"] .dpad{display:none}

/* core loop */
.loop{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:16px 0}
.loop .node{border:var(--bw) solid var(--line);background:var(--bg2);padding:14px 16px;border-radius:var(--radius);cursor:pointer;font-family:var(--font-px);font-size:.62em;text-align:center;min-width:120px;transition:transform .08s}
html[data-theme="minimal"] .loop .node{font-family:var(--font-ui);font-weight:700;font-size:.9em}
.loop .node:hover{transform:translateY(-3px);border-color:var(--cur)}
.loop .node.on{background:var(--cur);color:#000;border-color:var(--cur)}
.loop .arrow{color:var(--dim);font-size:1.4em}
.loop .back{width:100%;text-align:center;color:var(--dim);font-size:.8em}
.loop-detail{min-height:90px}

/* GDD */
.gdd-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.field label{display:block;font-size:.8em;color:var(--muted);margin-bottom:4px;font-weight:600}
.field label span{color:var(--cur);font-family:var(--font-px);font-size:.75em;margin-right:6px}
html[data-theme="minimal"] .field label span{font-family:var(--font-ui);font-weight:800}
.field input,.field textarea{width:100%;background:var(--bg2);border:var(--bw) solid var(--line);padding:10px 12px;border-radius:var(--radius);resize:vertical;min-height:44px}
.field textarea{min-height:72px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--cur)}
.field .hint{font-size:.75em;color:var(--dim);margin-top:3px}

/* checklist */
.check{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--bg2);border:var(--bw) solid var(--line);border-radius:var(--radius);cursor:pointer;margin:8px 0;user-select:none}
.check:hover{border-color:var(--cur)}
.check .box{width:26px;height:26px;border:var(--bw) solid var(--line);background:var(--panel);display:grid;place-items:center;font-weight:900;flex:none;border-radius:var(--radius)}
.check.done .box{background:var(--cur);color:#000;border-color:var(--cur)}
.check.done span.t{color:var(--muted);text-decoration:line-through}
.bar{height:18px;background:var(--bg2);border:var(--bw) solid var(--line);border-radius:var(--radius);overflow:hidden;position:relative}
.bar > i{display:block;height:100%;background:var(--cur);transition:width .3s}
.bar.striped > i{background-image:repeating-linear-gradient(90deg,transparent 0 8px,rgba(0,0,0,.18) 8px 12px)}

/* timer */
.timer{text-align:center;padding:28px 10px}
.timer .digits{font-family:var(--font-px);font-size:clamp(2.2em,8vw,5em);color:var(--cur);letter-spacing:2px;margin:10px 0 18px}
html[data-theme="minimal"] .timer .digits{font-family:var(--font-ui);font-weight:800;font-variant-numeric:tabular-nums}
.timer .digits.alarm{color:var(--danger);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}

/* home */
.hero{padding:40px 0 20px;text-align:center}
.hero h1{margin:14px 0 10px}
.hero p.lead{max-width:760px;margin:0 auto 20px;color:var(--muted);font-size:1.05em}
.hero canvas{image-rendering:pixelated;width:100%;height:auto;border:var(--bw) solid var(--line);border-radius:var(--radius);display:block;margin:0 auto;background:#000}
.enc-card{border:var(--bw) solid var(--line);border-top:8px solid var(--c);background:var(--panel);padding:18px;border-radius:var(--radius);cursor:pointer;transition:transform .08s;position:relative;box-shadow:var(--shadow)}
.enc-card:hover{transform:translateY(-3px);border-color:var(--c)}
.enc-card .ec-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.enc-card .num{font-family:var(--font-px);color:var(--c);font-size:.5em;letter-spacing:0;white-space:nowrap;margin:0}
html[data-theme="minimal"] .enc-card .num,html[data-theme="neo"] .enc-card .num,html[data-theme="glass"] .enc-card .num{font-family:var(--font-ui);font-weight:800;letter-spacing:.12em;font-size:.68em}
.enc-card h3{margin:0 0 10px;line-height:1.3}
.enc-card .status{font-size:.66em;padding:2px 8px;border:1px solid var(--line);color:var(--muted);border-radius:999px;white-space:nowrap}
.enc-card .status.ok{border-color:var(--c);color:var(--c)}
.enc-card .ec-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.76em;color:var(--muted);padding-top:8px;border-top:1px solid var(--line)}
.enc-card .ec-meta b{color:var(--text)}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0}

/* programa (encuentros futuros) */
.program{counter-reset:p}
.program .row{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.program .row:last-child{border-bottom:0}
.program .row .n{font-family:var(--font-px);color:var(--cur);font-size:.8em}
html[data-theme="minimal"] .program .row .n{font-family:var(--font-ui);font-weight:800}
.program .row .t{font-size:.8em;color:var(--muted);white-space:nowrap}
.soon{border:var(--bw) dashed var(--line);padding:14px 16px;color:var(--muted);font-size:.9em;border-radius:var(--radius);display:flex;gap:10px;align-items:center}

/* overlays */
.ovl{position:fixed;inset:0;background:rgba(3,5,14,.82);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.ovl.show{display:flex}
.modal{background:var(--panel);border:var(--bw) solid var(--cur);border-radius:var(--radius);width:min(960px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal.sm{width:min(520px,100%)}
.modal.sm.wide{width:min(1180px,100%)}
/* pop-up horizontal (formato base) */
.idea-pop2{display:grid;gap:14px}
.idea-pop2 .ip-intro{font-size:clamp(.95em,1.2vw,1.15em);line-height:1.5;margin:0;max-width:95ch;text-wrap:pretty}
.ip-stage{position:relative}
.ip-stage canvas{width:100%;height:auto;max-height:44vh;object-fit:contain;image-rendering:pixelated;background:#000;border:var(--bw) solid var(--line);border-radius:var(--radius);display:block}
.ip-stage .ip-cap{position:absolute;left:12px;bottom:10px;margin:0;background:rgba(5,8,20,.72);color:#fff;padding:4px 10px;border-radius:var(--radius);font-size:.72em}
.ip-row{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:8px}
@media (max-width:900px){.ip-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ip-row .ip-pt{border-left:var(--bw) solid var(--line);border-top:5px solid var(--line);padding:8px 10px;transform:none}
.ip-row .ip-pt:hover,.ip-row .ip-pt.on{border-top-color:var(--cur);border-color:var(--cur);transform:translateY(-2px)}
.ip-row .ip-pt b{font-size:.84em;line-height:1.25}
.ip-row .ip-pt span{font-size:.74em;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.idea-pop2 .ip-nav{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin:0;padding-top:10px;border-top:1px solid var(--line)}

/* pop-up de ideas */
.idea-pop{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(280px,.9fr);gap:22px;align-items:start}
@media (max-width:860px){.idea-pop{grid-template-columns:1fr}.ip-visual{order:-1}}
.ip-intro{font-size:1.02em;line-height:1.55;margin:0 0 12px;color:var(--text)}
.ip-points{display:grid;gap:8px}
.ip-pt{display:grid;gap:3px;padding:10px 12px;border:var(--bw) solid var(--line);border-left:5px solid var(--line);background:var(--bg2);border-radius:var(--radius);cursor:pointer;transition:border-color .12s,transform .08s}
.ip-pt b{color:var(--text);font-size:.95em}
.ip-pt span{color:var(--muted);font-size:.88em;line-height:1.45}
.ip-pt:hover,.ip-pt.on{border-left-color:var(--cur);border-color:var(--cur);transform:translateX(2px)}

.ip-cap{font-family:var(--font-ui);font-weight:700;font-size:.85em;color:var(--cur);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.ip-nav{display:flex;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap}
.ip-nav .btn{max-width:100%;white-space:normal;text-align:left;font-size:.75em}
.modal .mb{padding:18px 20px}
.modal .mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:var(--bw) solid var(--line)}
.modal .mb{padding:18px;overflow:auto}

.x{border:var(--bw) solid var(--line);background:var(--bg2);width:38px;height:38px;font-weight:900;border-radius:var(--radius)}
.x:hover{border-color:var(--danger);color:var(--danger)}

/* glosario */
.glo-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;position:sticky;top:0;background:var(--panel);padding-bottom:8px;z-index:2}
.glo-tools input{flex:1;min-width:200px;background:var(--bg2);border:var(--bw) solid var(--line);padding:10px 12px;border-radius:var(--radius)}

.glo-cat{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.glo-cat button{border:var(--bw) solid var(--line);background:var(--bg2);padding:5px 10px;font-size:.78em;border-radius:var(--radius);color:var(--muted)}
.glo-cat button.on{background:var(--cur);color:#000;border-color:var(--cur)}
.term{background:var(--bg2);border:var(--bw) solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.term.hl{border-color:var(--cur);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.term .en{font-family:var(--font-px);font-size:.75em;color:var(--cur)}
html[data-theme="minimal"] .term .en{font-family:var(--font-ui);font-weight:800;font-size:1em}
.term .cat{font-size:.7em;color:var(--dim);float:right}
.term .es{margin:8px 0 6px}
.term .ej{font-size:.88em;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}

.term .ill{margin-top:10px}
.term .ill canvas{image-rendering:pixelated;width:160px;height:auto;border:1px solid var(--line);background:#000}

/* toast */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--cur);color:#000;padding:10px 18px;font-weight:700;border-radius:var(--radius);opacity:0;pointer-events:none;transition:all .2s;z-index:2000;border:var(--bw) solid #000;font-size:.9em}

/* varios */
.callout{border-left:6px solid var(--cur);background:var(--bg2);padding:12px 16px;margin:14px 0;border-radius:var(--radius)}

.gm-panel p{color:#cad5e8;font-size:clamp(10px,1.5cqw,17px);line-height:1.5;max-width:470px;margin:0 auto 14px;text-wrap:pretty}

.gm-btn:hover{background:#c1fff4}.gm-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2a918c}
.gm-panel small{display:block;font-size:clamp(8px,1cqw,12px);color:#8fa8c0;margin-top:12px}
.gm-mobile{position:absolute;bottom:12%;left:3%;right:3%;display:none;justify-content:space-between;pointer-events:none}

.hero-game{container-type:inline-size}
.hero-game:fullscreen{align-items:center}

<script>
/* =========================================================
   CORE — estado, utilidades, sprites, modales
   ========================================================= */
'use strict';

const APP_VERSION = 'v18';
/* ---- PUBLICACIÓN POR FECHAS ----
   Abierto como archivo local (file://) → todo habilitado siempre (modo docente).
   Publicado en la web (GitHub Pages / Netlify) → cada encuentro se habilita solo
   a partir de su fecha, a las 00:01 hora Argentina (UTC-3). Un solo index.html para ambos. */
const PUBLIC_BUILD = location.protocol !== 'file:' && !/^(localhost|127\.)/.test(location.hostname);
const RELEASE = { 1: '2026-10-20T00:01:00-03:00', 2: '2026-10-27T00:01:00-03:00', 3: '2026-11-03T00:01:00-03:00', 4: '2026-11-10T00:01:00-03:00' };
function isOpen(e) { if (!PUBLIC_BUILD) return true; const d = RELEASE[e.n]; return !d || Date.now() >= new Date(d).getTime(); }
function releaseLabel(n) { const d = RELEASE[n]; if (!d) return ''; const t = new Date(d); const P = {}; new Intl.DateTimeFormat('es-AR', { weekday: 'long', day: 'numeric', month: 'numeric', timeZone: 'America/Argentina/Buenos_Aires' }).formatToParts(t).forEach(x => P[x.type] = x.value); return `${P.weekday} ${P.day}/${P.month}`; }
function openKey() { return COURSE.encuentros.map(e => isOpen(e) ? 1 : 0).join(''); }
const LS_KEY = 'gamedev-ia-curso-v1';
document.addEventListener('DOMContentLoaded', () => { const v = document.getElementById('ver'); if (v) v.textContent = APP_VERSION; });
const STATE = Object.assign({
  theme: 'pixel', mode: 'student',
  route: { view: 'home', e: 1, b: 0 },
  gdd: {}, check: {}, visited: {}, loopSeen: {}, timerMin: 10
}, loadState());

function loadState() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch (e) { return {}; }
}
function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(STATE)); } catch (e) { /* almacenamiento no disponible */ }
}

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function pad(n) { return String(n).padStart(2, '0'); }

/* ---------- toast / modal (sin diálogos nativos) ---------- */
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800);
}
function openOvl(id) { $('#' + id).classList.add('show'); }
function closeOvl(id) { $('#' + id).classList.remove('show'); }
function modal(title, html, buttons, wide) {
  $('#mFoot').style.display = '';
  $('#mTitle').textContent = title; $('#ovlModal .modal').classList.toggle('wide', !!wide);
  $('#mBody').innerHTML = html;
  const f = $('#mFoot'); f.innerHTML = '';
  (buttons || [{ label: 'Cerrar' }]).forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.primary ? ' primary' : '');
    el.textContent = b.label;
    el.onclick = () => { if (b.onClick) b.onClick(); closeOvl('ovlModal'); };
    f.appendChild(el);
  });
  openOvl('ovlModal');
}
document.addEventListener('click', e => {
  const c = e.target.closest('[data-close]');
  if (c) closeOvl(c.dataset.close);
  if (e.target.classList.contains('ovl')) e.target.classList.remove('show');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $$('.ovl.show').forEach(o => o.classList.remove('show'));
});

/* ---------- portapapeles / descarga ---------- */
function copyText(text, msg) {
  const done = () => toast(msg || '¡Copiado al portapapeles!');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('No se pudo copiar'); }
  document.body.removeChild(ta);
}
function downloadText(filename, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('Descargando ' + filename);
}

/* =========================================================
   RESOLUCIÓN: todos los canvas dibujan a 2-3× internamente.
   El código sigue usando coordenadas lógicas; el texto y las
   formas quedan nítidos al proyectar.
   ========================================================= */
const HI = { R: 3 };
(function patchCanvas() {
  const gc = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (type, ...a) {
    if (type === '2d' && !this._hi && !this.hasAttribute('data-native')) {
      const w = this.width, h = this.height; const R = w >= 600 ? 2 : HI.R; this._hi = R; this._lw = w; this._lh = h;
      this.width = w * R; this.height = h * R; const g = gc.call(this, '2d', ...a); g.scale(R, R); g.imageSmoothingEnabled = false; return g;
    }
    return gc.call(this, type, ...a);
  };
  const di = CanvasRenderingContext2D.prototype.drawImage;
  CanvasRenderingContext2D.prototype.drawImage = function (img, ...a) {
    if (img && img._lw) { if (a.length === 2) return di.call(this, img, a[0], a[1], img._lw, img._lh); if (a.length === 8) { const R = img.width / img._lw; return di.call(this, img, a[0] * R, a[1] * R, a[2] * R, a[3] * R, a[4], a[5], a[6], a[7]); } }
    return di.call(this, img, ...a);
  };
})();

/* =========================================================
   KIT DE ARTE "GAME MAKER" — misma estética en todas las demos
   (coordenadas lógicas; s = escala respecto del tamaño nativo)
   ========================================================= */
const GMK = {
  rect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); },
  sky(g, W, H, cam) { cam = cam || 0; const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#112146'); gr.addColorStop(.6, '#304b75'); gr.addColorStop(1, '#6f6494'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    for (let i = 0; i < Math.floor(W * H / 700); i++) { const x = ((i * 97.3 - cam * .1) % W + W) % W, y = (i * 53.7) % (H * .65); g.fillStyle = i % 3 ? 'rgba(200,240,255,.55)' : 'rgba(255,255,255,.9)'; g.fillRect(Math.round(x), Math.round(y), i % 4 === 0 ? 2 : 1, i % 4 === 0 ? 2 : 1); }
    const hills = (color, off, sc, base) => { g.fillStyle = color; g.beginPath(); g.moveTo(0, H); for (let x = -8; x <= W + 8; x += 4) { const wx = (x + cam * sc + off) * .03; g.lineTo(x, base + Math.sin(wx) * H * .05 + Math.sin(wx * 2.1) * H * .025); } g.lineTo(W, H); g.fill(); };
    hills('#1d3a5c', -60, .08, H * .52); hills('#284b68', 0, .12, H * .62); hills('#386c77', 100, .24, H * .74); },
  flat(g, W, H, c1, c2) { const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, c1 || '#13203f'); gr.addColorStop(1, c2 || '#1c2d52'); g.fillStyle = gr; g.fillRect(0, 0, W, H); },
  /* personaje GAME MAKER (nativo 30x36) */
  char(g, x, y, s, o) { o = o || {}; const r = (dx, dy, w, h, c) => g.fillRect(x + dx * s, y + dy * s, w * s, h * s); const f = (c) => g.fillStyle = c; const walk = o.walk || 0, jump = o.jump ? 1 : 0, face = o.face || 1;
    f('#18253b'); r(8 + (walk > 0 ? 3 : 0), 31 - 3 * jump, 8, 8); r(21 - (walk < 0 ? 3 : 0), 31 - 3 * jump, 8, 8);
    f('#53b7c9'); r(5, 13, 29, 23); f('#355a9b'); r(2, 14 - 6 * jump, 6, 16); r(32, 14 - 6 * jump, 6, 16);
    f('#f5d1af'); r(7, -2, 26, 21); f('#25334e'); r(4, -7, 30, 10); f('#263d66'); r(9, -12, 20, 8);
    const ex = face > 0 ? 2 : -2; f('#26304a'); r(10 + ex, 6, 4, 5); r(24 + ex, 6, 4, 5); f('#d78b9e'); r(15, 14, 10, 3); f('#ffcb68'); r(15, 21, 8, 11); f('#f7eec5'); r(18, 23, 3, 5);

/* =========================================================
   MOTOR MINI — base común para los minijuegos (Canvas 2D)
   - teclado sólo cuando el canvas tiene foco (no interfiere con la página)
   - d-pad táctil opcional
   - rAF controlado; destroy() al navegar
   ========================================================= */
const ACTIVE_GAMES = new Set();
function destroyGames() { ACTIVE_GAMES.forEach(g => g.destroy()); ACTIVE_GAMES.clear(); }

class MiniGame {
  constructor(host, opts) {
    this.opts = Object.assign({ w: 320, h: 180, title: 'Jugar', hint: 'Hacé clic en el juego y usá las flechas', dpadAction: true }, opts);
    this.host = host;
    this.keys = {};
    this.running = false; this.focused = false; this.started = false;
    this.build();
    ACTIVE_GAMES.add(this);
  }
  build() {
    const o = this.opts;
    this.host.innerHTML = `
      <div class="game-wrap">
        <div class="game-stage">
          <canvas tabindex="0" width="${o.w}" height="${o.h}" aria-label="${esc(o.title)}"></canvas>
          <div class="overlay"><div class="px">▶ ${esc(o.title)}</div><div class="small muted">${esc(o.hint)}</div></div>
        </div>
        <div class="game-side">
          <div class="hud"></div>
          <div class="game-ctl">
            <div class="keys"><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd>${o.dpadAction ? ' <kbd>Espacio</kbd>' : ''} <span class="muted">· <kbd>R</kbd> reiniciar</span></div>
            <div class="dpad ${o.dpadAction ? '' : 'hide-act'}">
              <button data-k="ArrowLeft">◀</button><button data-k="ArrowUp">▲</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button><button class="act" data-k=" ">●</button>
            </div>
            <button class="btn sm" data-reset>↺ Reiniciar</button>
          </div>
        </div>
      </div>`;
    this.cv = $('canvas', this.host); this.g = this.cv.getContext('2d');
    this.g.imageSmoothingEnabled = false;
    this.hud = $('.hud', this.host);
    this.ovl = $('.overlay', this.host);
    this.ovl.onclick = () => { this.cv.focus(); };
    this.cv.addEventListener('focus', () => { this.focused = true; this.ovl.classList.add('hidden'); this.start(); });
    this.cv.addEventListener('blur', () => { this.focused = false; this.keys = {}; this.ovl.classList.remove('hidden'); this.ovl.innerHTML = `<div class="px">⏸ Pausa</div><div class="small muted">Clic para seguir</div>`; });
    this._kd = e => { if (!this.focused) return; if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault(); this.keys[e.key] = true; if (e.key === 'r' || e.key === 'R') this.reset(); this.onKey && this.onKey(e.key); };
    this._ku = e => { this.keys[e.key] = false; };
    window.addEventListener('keydown', this._kd); window.addEventListener('keyup', this._ku);
    $$('.dpad button', this.host).forEach(b => {
      const k = b.dataset.k;
      const down = ev => { ev.preventDefault(); this.cv.focus(); this.keys[k] = true; b.classList.add('down'); this.onKey && this.onKey(k); };
      const up = ev => { ev.preventDefault(); this.keys[k] = false; b.classList.remove('down'); };
      b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
    });
    $('[data-reset]', this.host).onclick = () => { this.reset(); this.cv.focus(); };
    this.cv.addEventListener('pointerdown', e => { this.cv.focus(); this.onPointer && this.onPointer(e); });
    this.reset();
    this.draw();
  }
  canvasPos(e) {
    const r = this.cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * this.opts.w / r.width, y: (e.clientY - r.top) * this.opts.h / r.height };
  }
  start() { if (this.running) return; this.running = true; this.last = performance.now(); const loop = t => { if (!this.running) return; const dt = Math.min(0.05, (t - this.last) / 1000); this.last = t; if (this.focused) this.update(dt); this.draw(); this._raf = requestAnimationFrame(loop); }; this._raf = requestAnimationFrame(loop); }
  stop() { this.running = false; cancelAnimationFrame(this._raf); }
  destroy() { this.stop(); window.removeEventListener('keydown', this._kd); window.removeEventListener('keyup', this._ku); }
  setHud(html) { this.hud.innerHTML = html.split('<br>').map(x => `<span class="h">${x}</span>`).join(''); }
  win(msg) { this.won = true; this.ovl.classList.remove('hidden'); this.ovl.innerHTML = `<div class="px" style="color:var(--acc4)">★ ${esc(msg || '¡GANASTE!')}</div><div class="small muted">R o clic para jugar de nuevo</div>`; this.ovl.onclick = () => { this.reset(); this.cv.focus(); this.ovl.onclick = () => this.cv.focus(); }; }
  lose(msg) { this.won = true; this.ovl.classList.remove('hidden'); this.ovl.innerHTML = `<div class="px" style="color:var(--danger)">✖ ${esc(msg || 'GAME OVER')}</div><div class="small muted">R o clic para reintentar</div>`; this.ovl.onclick = () => { this.reset(); this.cv.focus(); this.ovl.onclick = () => this.cv.focus(); }; }
  /* a implementar */
  reset() { } update() { } draw() { }
  /* helpers de dibujo */
  bg(color) { const W = this.opts.w, H = this.opts.h; if (['#0e1630', '#0b0f1e', '#15181f'].includes(color)) GMK.sky(this.g, W, H, this.t ? this.t * 20 : 0); else if (color === '#121a33') GMK.flat(this.g, W, H); else { this.g.fillStyle = color; this.g.fillRect(0, 0, W, H); } }
  rect(x, y, w, h, c) { this.g.fillStyle = c; this.g.fillRect(Math.round(x), Math.round(y), w, h); }
  spr(name, x, y, scale) { this.g.drawImage(sprite(name, scale || 1), Math.round(x), Math.round(y)); }
  text(s, x, y, c, size) { this.g.fillStyle = c || '#fff'; this.g.font = '800 ' + (size || 8) * 1.15 + 'px Inter, system-ui, sans-serif'; this.g.fillText(s, x, y); }
  hit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
}

/* ---------- 1. Juego demo (Bloque 01): formas vs sprites ---------- */
class DemoGame extends MiniGame {
  constructor(host, styled) { super(host, { w: 320, h: 180, title: styled ? 'Demo con sprites' : 'Demo con formas', hint: 'Clic en el juego · flechas para moverte · juntá las 5 monedas · evitá al enemigo' , dpadAction: false }); this.styled = styled; }
  reset() {
    this.won = false; this.t = 0;
    this.p = { x: 20, y: 80, w: 12, h: 12, sp: 90 };
    this.coins = [[70, 30], [150, 140], [220, 40], [280, 120], [160, 80]].map(([x, y]) => ({ x, y, w: 8, h: 8, got: false }));
    this.en = [{ x: 100, y: 100, w: 10, h: 8, vx: 60 }, { x: 240, y: 60, w: 10, h: 8, vx: -45 }];
    this.score = 0;
    this.ovl && (this.ovl.innerHTML = `<div class="px">▶ ${esc(this.opts.title)}</div><div class="small muted">${esc(this.opts.hint)}</div>`);
    this.hudUpdate();
  }
  hudUpdate() { this.setHud(`MONEDAS <b>${this.score}/5</b><br>OBJETIVO: juntar todas<br>OBSTÁCULO: enemigos<br>${this.styled ? 'GRÁFICOS: sprites' : 'GRÁFICOS: formas'}`); }
  update(dt) {
    if (this.won) return; this.t += dt;
    const k = this.keys, p = this.p, s = p.sp * dt;
    if (k.ArrowLeft) p.x -= s; if (k.ArrowRight) p.x += s; if (k.ArrowUp) p.y -= s; if (k.ArrowDown) p.y += s;
    p.x = Math.max(0, Math.min(this.opts.w - p.w, p.x)); p.y = Math.max(0, Math.min(this.opts.h - p.h, p.y));
    this.en.forEach(e => { e.x += e.vx * dt; if (e.x < 0 || e.x + e.w > this.opts.w) e.vx *= -1; if (this.hit(p, e)) this.lose('¡Te atrapó el enemigo!'); });
    this.coins.forEach(c => { if (!c.got && this.hit(p, c)) { c.got = true; this.score++; this.hudUpdate(); } });
    if (this.score === 5) this.win('¡Objetivo cumplido!');
  }
  draw() {
    const g = this.g, W = this.opts.w, H = this.opts.h;
    if (this.styled) {
      this.bg('#0b0f1e');
      for (let x = 0; x < W; x += 16) for (let y = 0; y < H; y += 16) this.spr('floor', x, y, 2);
      this.coins.forEach(c => { if (!c.got) this.spr('coin', c.x, c.y + Math.sin(this.t * 4 + c.x) * 1.5, 1); });
      this.en.forEach(e => this.spr('enemy', e.x, e.y, 1));
      this.spr('player', this.p.x, this.p.y, 1);
    } else {
      this.bg('#15181f');
      this.coins.forEach(c => { if (!c.got) this.rect(c.x, c.y, c.w, c.h, '#ffd23f'); });
      this.en.forEach(e => this.rect(e.x, e.y, e.w, e.h, '#ff5a5a'));
      this.rect(this.p.x, this.p.y, this.p.w, this.p.h, '#3ee6ff');
      this.text('JUGADOR=cuadrado', 4, H - 6, '#5f6d99', 6);
    }
    this.text(`x${this.score}`, W - 40, 12, '#ffd23f', 8);
  }
}

/* ---------- 2. Plataformas 2D ---------- */
class PlatformerGame extends MiniGame {
  constructor(host) { super(host, { w: 320, h: 180, title: 'Plataformas 2D', hint: 'Clic · ← → mover · Espacio o ↑ saltar · llegá a la bandera' }); }
  reset() {
    this.won = false;
    this.p = { x: 16, y: 120, w: 10, h: 14, vx: 0, vy: 0, ground: false };
    this.plats = [{ x: 0, y: 164, w: 120, h: 16 }, { x: 150, y: 164, w: 170, h: 16 }, { x: 60, y: 124, w: 48, h: 8 }, { x: 140, y: 100, w: 48, h: 8 }, { x: 220, y: 76, w: 56, h: 8 }, { x: 290, y: 120, w: 30, h: 8 }];
    this.spikes = [{ x: 128, y: 172, w: 16, h: 8 }, { x: 190, y: 156, w: 8, h: 8 }];
    this.coins = [{ x: 78, y: 106 }, { x: 160, y: 84 }, { x: 244, y: 60 }].map(c => Object.assign(c, { w: 8, h: 8, got: false }));
    this.flag = { x: 300, y: 104, w: 8, h: 16 }; this.score = 0; this.deaths = 0; this.t = 0;
    this.P = this.P || { speed: 80, jump: 190, grav: 420 }; this.showHit = this.showHit || false;
    this.hudUpdate();
  }
  hudUpdate() { this.setHud(`MONEDAS <b>${this.score}/3</b><br>CAÍDAS <b>${this.deaths}</b><br>PERSPECTIVA: lateral<br>FÍSICA: gravedad + salto`); }
  update(dt) {
    if (this.won) return; this.t += dt;
    const k = this.keys, p = this.p;
    p.vx = (k.ArrowRight ? 1 : 0) - (k.ArrowLeft ? 1 : 0); p.vx *= this.P.speed;
    if ((k[' '] || k.ArrowUp) && p.ground) { p.vy = -this.P.jump; p.ground = false; }
    p.vy += this.P.grav * dt; if (p.vy > 240) p.vy = 240;
    p.x += p.vx * dt; p.x = Math.max(0, Math.min(this.opts.w - p.w, p.x));
    p.y += p.vy * dt; p.ground = false;
    this.plats.forEach(s => { if (this.hit(p, s)) { if (p.vy > 0 && p.y + p.h - p.vy * dt <= s.y + 1) { p.y = s.y - p.h; p.vy = 0; p.ground = true; } else if (p.vy < 0 && p.y - p.vy * dt >= s.y + s.h - 1) { p.y = s.y + s.h; p.vy = 0; } } });
    if (p.y > this.opts.h || this.spikes.some(s => this.hit(p, s))) { this.deaths++; p.x = 16; p.y = 120; p.vy = 0; this.hudUpdate(); }
    this.coins.forEach(c => { if (!c.got && this.hit(p, c)) { c.got = true; this.score++; this.hudUpdate(); } });
    if (this.hit(p, this.flag)) this.win('¡Nivel completado!');
  }
  draw() {
    const W = this.opts.w, H = this.opts.h; this.bg('#0e1630');

    this.spikes.forEach(s => { for (let x = s.x; x < s.x + s.w; x += 8) this.spr('spike', x, s.y, 1); });
    this.coins.forEach(c => { if (!c.got) this.spr('coin', c.x, c.y + Math.sin(this.t * 4 + c.x) * 1.5, 1); });
    this.spr('flag', this.flag.x, this.flag.y, 1);
    this.g.drawImage(sprite('player', 1), 0, 0, 12, 12, Math.round(this.p.x - 1), Math.round(this.p.y), 12, 14);
    if (this.showHit) { const g = this.g; g.lineWidth = 1; g.strokeStyle = '#7cff6b'; g.strokeRect(this.p.x + .5, this.p.y + .5, this.p.w, this.p.h); g.strokeStyle = '#ff5a5a'; this.spikes.forEach(s => g.strokeRect(s.x + .5, s.y + .5, s.w, s.h)); g.strokeStyle = '#ffd23f'; this.coins.forEach(c => { if (!c.got) g.strokeRect(c.x + .5, c.y + .5, c.w, c.h); }); g.strokeStyle = '#3ee6ff'; this.plats.forEach(s => g.strokeRect(s.x + .5, s.y + .5, s.w, s.h)); g.strokeRect(this.flag.x + .5, this.flag.y + .5, this.flag.w, this.flag.h); }
    this.text(`x${this.score}`, W - 36, 12, '#ffd23f', 8);
  }
}

/* ---------- 3. Top-down 2D ---------- */
class TopDownGame extends MiniGame {
  constructor(host) { super(host, { w: 320, h: 180, title: 'Top-down 2D', hint: 'Clic · flechas en 4 direcciones · buscá la llave y abrí la puerta', dpadAction: false }); }
  reset() {
    this.won = false; this.t = 0;
    this.map = [
      '####################',
      '#..........#.......#',
      '#..##..###.#..###..#',
      '#..#.....#....#....#',
      '#..#.###.#.##.#.##.#',
      '#....#.......#...#.#',
      '####.#.####..#.#.#.#',
      '#......#..#....#...#',
      '#.####.#..######.###',
      '#......#.........D.#',
      '####################'
    ];
    this.T = 16; this.p = { x: 24, y: 24, w: 10, h: 10 };
    this.key = { x: 230, y: 56, w: 8, h: 8, got: false };
    this.door = { x: 17 * 16, y: 9 * 16, w: 16, h: 16 };
    this.coins = [{ x: 40, y: 120 }, { x: 180, y: 40 }, { x: 120, y: 130 }].map(c => Object.assign(c, { w: 8, h: 8, got: false }));
    this.score = 0; this.hudUpdate();
  }
  hudUpdate() { this.setHud(`LLAVE <b>${this.key.got ? 'SÍ' : 'NO'}</b><br>MONEDAS <b>${this.score}/3</b><br>PERSPECTIVA: cenital<br>SIN GRAVEDAD`); }
  solid(x, y) { const c = this.map[Math.floor(y / this.T)]; return !c || c[Math.floor(x / this.T)] === '#'; }
  free(r) { return !(this.solid(r.x, r.y) || this.solid(r.x + r.w - 1, r.y) || this.solid(r.x, r.y + r.h - 1) || this.solid(r.x + r.w - 1, r.y + r.h - 1)); }
  update(dt) {
    if (this.won) return; this.t += dt;
    const k = this.keys, p = this.p, s = 85 * dt;
    const nx = { x: p.x + ((k.ArrowRight ? 1 : 0) - (k.ArrowLeft ? 1 : 0)) * s, y: p.y, w: p.w, h: p.h }; if (this.free(nx)) p.x = nx.x;
    const ny = { x: p.x, y: p.y + ((k.ArrowDown ? 1 : 0) - (k.ArrowUp ? 1 : 0)) * s, w: p.w, h: p.h }; if (this.free(ny)) p.y = ny.y;
    if (!this.key.got && this.hit(p, this.key)) { this.key.got = true; this.hudUpdate(); }
    this.coins.forEach(c => { if (!c.got && this.hit(p, c)) { c.got = true; this.score++; this.hudUpdate(); } });
    if (this.hit(p, this.door)) { if (this.key.got) this.win('¡Puerta abierta!'); else { p.x -= 6; } }
  }
  draw() {
    this.bg('#0b0f1e');
    this.map.forEach((row, j) => { for (let i = 0; i < row.length; i++) { const x = i * this.T, y = j * this.T; if (row[i] === '#') this.spr('brick', x, y, 2); else this.spr('floor', x, y, 2); } });
    this.spr(this.key.got ? 'floor' : 'door', this.door.x, this.door.y, 2);
    if (this.key.got) this.rect(this.door.x + 4, this.door.y, 8, 16, '#7cff6b');
    if (!this.key.got) this.spr('key', this.key.x, this.key.y + Math.sin(this.t * 4) * 1.5, 1);
    this.coins.forEach(c => { if (!c.got) this.spr('coin', c.x, c.y, 1); });
    this.g.drawImage(sprite('player', 1), 0, 0, 12, 12, Math.round(this.p.x - 1), Math.round(this.p.y - 2), 12, 12);
    if (!this.key.got) this.text('necesitás la llave', 160, 176, '#5f6d99', 6);
  }
}

/* ---------- 4. Puzzle: Lights Out 3x3 ---------- */
class PuzzleGame extends MiniGame {
  constructor(host) { super(host, { w: 320, h: 180, title: 'Puzzle 2D', hint: 'Clic en una casilla (o flechas + Espacio). Cada casilla invierte a sus vecinas. Encendé todo.' }); }
  reset() {
    this.won = false; this.moves = 0; this.cur = { x: 1, y: 1 };
    this.grid = [[1, 1, 1], [1, 1, 1], [1, 1, 1]];
    for (let i = 0; i < 7; i++) this.toggle(Math.floor(Math.random() * 3), Math.floor(Math.random() * 3), true);
    if (this.solved()) this.toggle(1, 1, true);
    this.hudUpdate();
  }
  hudUpdate() { this.setHud(`MOVIMIENTOS <b>${this.moves}</b><br>REGLA: una casilla<br>cambia sus vecinas<br>OBJETIVO: todo encendido`); }
  toggle(x, y, silent) { [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => { const i = x + dx, j = y + dy; if (i >= 0 && i < 3 && j >= 0 && j < 3) this.grid[j][i] ^= 1; }); if (!silent) { this.moves++; this.hudUpdate(); if (this.solved()) this.win(`¡Resuelto en ${this.moves} movimientos!`); } }
  solved() { return this.grid.every(r => r.every(v => v === 1)); }
  onKey(k) { if (this.won) return; if (k === 'ArrowLeft') this.cur.x = Math.max(0, this.cur.x - 1); if (k === 'ArrowRight') this.cur.x = Math.min(2, this.cur.x + 1); if (k === 'ArrowUp') this.cur.y = Math.max(0, this.cur.y - 1); if (k === 'ArrowDown') this.cur.y = Math.min(2, this.cur.y + 1); if (k === ' ') this.toggle(this.cur.x, this.cur.y); }
  onPointer(e) { if (this.won) return; const p = this.canvasPos(e); const s = 44, ox = 160 - 66, oy = 90 - 66; const x = Math.floor((p.x - ox) / s), y = Math.floor((p.y - oy) / s); if (x >= 0 && x < 3 && y >= 0 && y < 3) { this.cur = { x, y }; this.toggle(x, y); } }
  update() { }
  draw() {
    this.bg('#121a33'); const s = 44, ox = 160 - 66, oy = 90 - 66;
    for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) {
      const on = this.grid[y][x]; this.rect(ox + x * s + 2, oy + y * s + 2, s - 4, s - 4, on ? '#ffd23f' : '#1d2850');
      if (on) this.rect(ox + x * s + 8, oy + y * s + 8, 10, 10, '#fff2a8');
      if (this.cur.x === x && this.cur.y === y) { this.g.strokeStyle = '#3ee6ff'; this.g.lineWidth = 3; this.g.strokeRect(ox + x * s + 3, oy + y * s + 3, s - 6, s - 6); }
    }
    this.text('ENCENDÉ TODAS', 8, 14, '#98a6cf', 7); this.text(`mov: ${this.moves}`, 250, 14, '#98a6cf', 7);
  }
}

/* ---------- 5. Juego con bug intencional (Bloque 08) ---------- */
class BugGame extends MiniGame {
  constructor(host) { super(host, { w: 320, h: 180, title: 'Juego con un bug', hint: 'Clic · flechas · juntá monedas y mirá el puntaje…', dpadAction: false }); this.fixed = false; }
  reset() {
    this.won = false; this.t = 0; this.p = { x: 20, y: 80, w: 12, h: 12 }; this.score = 0;
    this.coins = [[70, 30], [150, 140], [220, 40], [280, 120], [160, 80], [40, 150]].map(([x, y]) => ({ x, y, w: 8, h: 8, got: false }));
    this.hudUpdate();
  }
  hudUpdate() { this.setHud(`PUNTAJE <b>${this.score}</b><br>MONEDAS JUNTADAS <b>${this.coins ? this.coins.filter(c => c.got).length : 0}</b><br>ESTADO: ${this.fixed ? '<b style="color:var(--acc4)">CORREGIDO</b>' : '<b style="color:var(--danger)">CON BUG</b>'}`); }
  update(dt) {
    if (this.won) return; this.t += dt; const k = this.keys, p = this.p, s = 90 * dt;
    if (k.ArrowLeft) p.x -= s; if (k.ArrowRight) p.x += s; if (k.ArrowUp) p.y -= s; if (k.ArrowDown) p.y += s;
    p.x = Math.max(0, Math.min(this.opts.w - p.w, p.x)); p.y = Math.max(0, Math.min(this.opts.h - p.h, p.y));
    this.coins.forEach(c => {
      if (!c.got && this.hit(p, c)) {
        c.got = true;
        if (this.fixed) { this.score += 10; } else { this.score = 10; } /* ← EL BUG: "=" en vez de "+=" */
        this.hudUpdate();
      }
    });
    if (this.coins.every(c => c.got)) this.win(this.fixed ? `Puntaje final: ${this.score} ✔` : `Puntaje final: ${this.score}… ¿seguro?`);
  }
  draw() {
    this.bg('#0b0f1e'); for (let x = 0; x < 320; x += 16) for (let y = 0; y < 180; y += 16) this.spr('floor', x, y, 2);

    this.text(`SCORE ${this.score}`, 8, 14, this.fixed ? '#7cff6b' : '#ffd23f', 8);
  }
}

    px(W / 2 - 20, H / 2 - 12, 40, 24, '#1d2850'); px(W / 2 - 6, H / 2 - 4, 12, 8, '#ff5fb4');

/* ---------- Juego de mesa: carrera de dados ---------- */
class BoardGame extends MiniGame {
  constructor(host) { super(host, { w: 320, h: 180, title: 'Juego de mesa', hint: 'Clic · Espacio para tirar el dado · llegá primero a la meta', dpadAction: true }); }
  reset() { this.won = false; this.t = 0; this.pos = [0, 0]; this.turn = 0; this.die = 0; this.msg = 'Tu turno: tirá el dado'; this.anim = 0; this.busy = false; this.N = 20; this.special = { 4: 3, 9: -3, 13: 2, 16: -4 }; this.hudUpdate(); }
  hudUpdate() { this.setHud(`VOS: casilla <b>${this.pos[0]}</b><br>CPU: casilla <b>${this.pos[1]}</b><br>DADO: <b>${this.die || '-'}</b><br>${this.turn === 0 ? 'TU TURNO' : 'TURNO CPU'}`); }
  cellXY(i) { const perRow = 10, r = Math.floor(i / perRow), c = i % perRow; const cx = r % 2 ? perRow - 1 - c : c; return { x: 16 + cx * 29, y: 40 + r * 44 }; }
  onKey(k) { if (k === ' ' && this.turn === 0 && !this.busy && !this.won) this.roll(); }
  onPointer() { if (this.turn === 0 && !this.busy && !this.won) this.roll(); }
  roll() { this.busy = true; this.die = 1 + Math.floor(Math.random() * 6); const who = this.turn; let steps = this.die; const step = () => { if (steps > 0 && this.pos[who] < this.N) { this.pos[who]++; steps--; this.hudUpdate(); setTimeout(step, 180); return; } const sp = this.special[this.pos[who]]; if (sp) { this.pos[who] = Math.max(0, Math.min(this.N, this.pos[who] + sp)); this.msg = (who ? 'CPU' : 'Vos') + (sp > 0 ? ' avanza ' : ' retrocede ') + Math.abs(sp); } else this.msg = (who ? 'CPU sacó ' : 'Sacaste ') + this.die; this.hudUpdate(); if (this.pos[who] >= this.N) { if (who === 0) this.win('¡Llegaste primero!'); else this.lose('Ganó la CPU'); this.busy = false; return; } this.turn = 1 - who; this.busy = false; this.hudUpdate(); if (this.turn === 1) setTimeout(() => this.roll(), 700); }; setTimeout(step, 250); }
  update(dt) { this.t += dt; }
  draw() { this.bg('#121a33'); for (let i = 0; i <= this.N; i++) { const { x, y } = this.cellXY(i); const sp = this.special[i]; this.rect(x, y, 26, 26, i === 0 ? '#2f9e44' : i === this.N ? '#c99a00' : sp > 0 ? '#1c7ea1' : sp < 0 ? '#a3306f' : (i % 2 ? '#1d2850' : '#2b3a6b')); this.text(i === this.N ? 'META' : i === 0 ? 'GO' : String(i), x + 3, y + 17, '#e9eefc', 6); if (sp) this.text((sp > 0 ? '+' : '') + sp, x + 6, y + 25, '#fff', 5); } const a = this.cellXY(this.pos[0]), b = this.cellXY(this.pos[1]); this.spr('player', a.x + 1, a.y - 6, 1); this.spr('enemy', b.x + 14, b.y + 10, 1); this.spr('die', 280, 150, 2); if (this.die) this.text(String(this.die), 286, 167, '#000', 10); this.text(this.msg, 8, 14, '#ffd23f', 6); this.text('ESPACIO/CLIC = tirar', 8, 26, '#5f6d99', 5); }
}

/* ---------- Isométrico ---------- */
class IsoGame extends MiniGame {
  constructor(host) { super(host, { w: 320, h: 180, title: 'Isométrico', hint: 'Clic · flechas (en diagonal) · juntá las 3 gemas · evitá al enemigo', dpadAction: false }); }
  reset() { this.won = false; this.t = 0; this.N = 8; this.map = ['........', '.##.....', '.#...#..', '....##..', '.#......', '.#..#.#.', '.....#..', '........']; this.p = { x: 0, y: 0 }; this.gems = [{ x: 7, y: 0 }, { x: 3, y: 4 }, { x: 7, y: 7 }].map(g => Object.assign(g, { got: false })); this.e = { x: 6, y: 3, dir: 1, acc: 0 }; this.cd = 0; this.score = 0; this.hudUpdate(); }
  hudUpdate() { this.setHud(`GEMAS <b>${this.score}/3</b><br>POSICIÓN <b>${this.p.x},${this.p.y}</b><br>CÁMARA: diagonal<br>45° desde arriba`); }
  free(x, y) { return x >= 0 && y >= 0 && x < this.N && y < this.N && this.map[y][x] === '.'; }
  update(dt) { if (this.won) return; this.t += dt; this.cd -= dt; const k = this.keys; let dx = 0, dy = 0; if (k.ArrowUp) { dx = 0; dy = -1; } else if (k.ArrowDown) { dx = 0; dy = 1; } else if (k.ArrowLeft) { dx = -1; dy = 0; } else if (k.ArrowRight) { dx = 1; dy = 0; } if ((dx || dy) && this.cd <= 0) { this.cd = .16; if (this.free(this.p.x + dx, this.p.y + dy)) { this.p.x += dx; this.p.y += dy; this.hudUpdate(); } } this.e.acc += dt; if (this.e.acc > .5) { this.e.acc = 0; if (!this.free(this.e.x + this.e.dir, this.e.y)) this.e.dir *= -1; else this.e.x += this.e.dir; } this.gems.forEach(g => { if (!g.got && g.x === this.p.x && g.y === this.p.y) { g.got = true; this.score++; this.hudUpdate(); } }); if (this.e.x === this.p.x && this.e.y === this.p.y) this.lose('Te atrapó'); if (this.score === 3) this.win('¡Todas las gemas!'); }

  draw() { this.bg('#0b0f1e'); for (let y = 0; y < this.N; y++) for (let x = 0; x < this.N; x++) { const { sx, sy } = this.iso(x, y); this.tile(sx, sy, (x + y) % 2 ? '#2f9e44' : '#3bb152', '#1e6b2e', '#27863a', 0); } for (let y = 0; y < this.N; y++) for (let x = 0; x < this.N; x++) { const { sx, sy } = this.iso(x, y); if (this.map[y][x] === '#') this.tile(sx, sy, '#9aa3b8', '#4a5368', '#6b7488', 14); this.gems.forEach(gm => { if (!gm.got && gm.x === x && gm.y === y) this.spr('gem', sx - 4, sy - 2 + Math.sin(this.t * 4) * 1.5, 1); }); if (this.e.x === x && this.e.y === y) this.spr('enemy', sx - 5, sy - 4, 1); if (this.p.x === x && this.p.y === y) this.g.drawImage(sprite('player', 1), 0, 0, 12, 12, sx - 6, sy - 8, 12, 12); } this.text('↑ ↓ ← → se mueven en diagonal', 8, 174, '#5f6d99', 5); }
}

function renderGlossary(filterCat, query, highlight) {
  const body = $('#gloBody');
  const q = (query || '').trim().toLowerCase();
  const list = GLOSSARY.filter(t => (!filterCat || t.c === filterCat) && (!q || t.en.toLowerCase().includes(q) || t.es.toLowerCase().includes(q) || t.ej.toLowerCase().includes(q)));
  body.innerHTML = `
    <div class="glo-tools">
      <input id="gloQ" type="search" placeholder="Buscar término… (ej: sprite, bug, loop)" value="${esc(query || '')}">
      <span class="chip">${list.length} términos</span>
    </div>
    <div class="glo-cat">
      <button data-c="" class="${!filterCat ? 'on' : ''}">Todos</button>
      ${Object.entries(GLO_CATS).map(([k, v]) => `<button data-c="${k}" class="${filterCat === k ? 'on' : ''}">${v}</button>`).join('')}
    </div>
    ${list.map(t => `<div class="term ${highlight && t.en.toLowerCase() === highlight.toLowerCase() ? 'hl' : ''}" id="term-${t.en.replace(/\W+/g, '-')}">
        <span class="cat">${GLO_CATS[t.c]}</span><div class="en">${esc(t.en)}</div>
        <div class="es">${esc(t.es)}</div>
        <div class="ej"><b>Ejemplo:</b> ${esc(t.ej)}</div>
        ${t.ill && t.ill !== 'loop' ? `<div class="ill"><canvas data-spr="${t.ill}" width="16" height="16"></canvas></div>` : ''}
        ${t.ill === 'loop' ? `<div class="ill small muted">JUGADOR → ACCIÓN → DESAFÍO → RESULTADO → ↺</div>` : ''}
      </div>`).join('') || '<p class="muted">Sin resultados.</p>'}`;
  $$('canvas[data-spr]', body).forEach(cv => { const s = sprite(cv.dataset.spr, 1); cv.width = s.width; cv.height = s.height; cv.getContext('2d').drawImage(s, 0, 0); });
  const inp = $('#gloQ'); inp.oninput = () => { renderGlossary(filterCat, inp.value); $('#gloQ').focus(); const v = $('#gloQ'); v.setSelectionRange(v.value.length, v.value.length); };
  $$('.glo-cat button', body).forEach(b => b.onclick = () => renderGlossary(b.dataset.c || null, $('#gloQ').value));
  if (highlight) { const el = $('.term.hl', body); if (el) setTimeout(() => el.scrollIntoView({ block: 'center' }), 30); }
}

function gddText() {
  const g = STATE.gdd || {};
  return `FICHA DE DISEÑO (GDD) — v1\n${'='.repeat(32)}\n` + GDD_FIELDS.map(f => `${f.l}: ${(g[f.k] || '').trim() || '(sin completar)'}`).join('\n') + `\n\nAlcance: primera versión jugable con gráficos provisionales (figuras geométricas).\nTecnología: HTML + JavaScript + Phaser, desarrollado con Google Antigravity.`;
}
function gddComplete() { return GDD_FIELDS.filter(f => (STATE.gdd[f.k] || '').trim()).length; }
function promptText(p) {
  if (p.gdd && gddComplete() > 0) return p.text.replace('[PEGAR FICHA]', gddText());
  return p.text;
}
function promptBox(id, opts) {
  const p = PROMPTS.find(x => x.id === id); opts = opts || {};
  const filled = p.gdd && gddComplete() > 0;
  let body = esc(p.text).replace(/\[([^\]]+)\]/g, (m, v) => filled && v === 'PEGAR FICHA' ? `<span class="filled">${esc(gddText())}</span>` : `<span class="ph-var">[${esc(v)}]</span>`);
  return `<div class="prompt-box" data-prompt="${id}">
    <div class="ph"><span class="t">${esc(p.title)}</span>
      <span style="display:flex;gap:6px;flex-wrap:wrap">
        ${p.gdd ? `<span class="chip small">${filled ? `✔ incluye tu GDD (${gddComplete()}/8 campos)` : 'completá el GDD en la Sección 04 y se insertará solo'}</span>` : ''}
        <button class="btn sm primary" data-copy-prompt="${id}">⧉ Copiar</button>
      </span></div>
    <pre>${body}</pre></div>`;
}

MOUNTS.tileEditor = el => {

  $$('canvas[data-spr]', el).forEach(cv => cv.getContext('2d').drawImage(sprite(cv.dataset.spr, 2), 0, 0));
  const cv = $('#tileCv'), g = cv.getContext('2d');
  const draw = () => { map.forEach((row, y) => { for (let x = 0; x < W; x++) { g.drawImage(sprite('floor', 2), x * 16, y * 16); if (row[x] !== '.') g.drawImage(sprite(TILES[row[x]] || 'floor', row[x] === 'c' ? 1 : 2), x * 16 + (row[x] === 'c' ? 4 : 0), y * 16 + (row[x] === 'c' ? 4 : 0)); } }); $('#tileTxt').textContent = map.join('\n'); STATE.e2.map = map; saveState(); };
  const paint = e => { const r = cv.getBoundingClientRect(); const x = Math.floor((e.clientX - r.left) / r.width * W), y = Math.floor((e.clientY - r.top) / r.height * H); if (x < 0 || y < 0 || x >= W || y >= H) return; map[y] = map[y].substring(0, x) + cur + map[y].substring(x + 1); draw(); };

};
