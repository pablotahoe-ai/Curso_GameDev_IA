  const steps = [['INPUT', 'Leer teclas, mouse o touch. ¿Qué está apretando el jugador AHORA?', '#3ee6ff'], ['UPDATE', 'Aplicar reglas: mover, gravedad, colisiones, puntaje, enemigos. Todo lo que cambia el estado.', '#ffd23f'], ['DRAW', 'Dibujar el estado actual en pantalla. Sólo mirar, no tocar.', '#7cff6b'], ['WAIT', 'Esperar al siguiente cuadro (1/60 s). Y volver a empezar.', '#98a6cf']];
  let i = -1, auto = null, frame = 0;
  el.innerHTML = `<div class="two"><div><div class="loop" style="justify-content:flex-start">${steps.map((s, k) => `<div class="node" data-i="${k}" style="min-width:90px">${s[0]}</div>${k < 3 ? '<span class="arrow">→</span>' : ''}`).join('')}<div class="back">↺ 60 veces por segundo</div></div><div class="card" id="glInfo"><p class="muted">Apretá "Un paso" para avanzar por el ciclo, o "Automático".</p></div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn sm primary" id="glStep">▶ Un paso</button><button class="btn sm" id="glAuto">⟳ Automático</button><span class="chip">frame <b id="glFrame">0</b></span></div></div>
    <canvas id="glCv" width="160" height="90" style="width:100%;max-width:400px;image-rendering:pixelated;background:#000;border:1px solid var(--line)"></canvas></div>`;
  const g = $('#glCv').getContext('2d'); let px = 20, vx = 1, coin = { x: 120, got: false }, drawn = { px: 20, coin: false };

    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><button class="btn sm primary" id="sfxPlay">▶ Reproducir</button><button class="btn sm" id="sfxDl">⬇ Descargar .wav</button></div>
    <p class="small muted" style="margin-top:8px">Sonidos sintetizados al estilo 8-bit, hechos con código en tu navegador. Descargalos a <code>assets/audio/</code> y ya tenés SFX sin buscar nada. Alternativas: jsfxr / sfxr (web, gratis), freesound.org, o generadores de audio con IA.</p></div>
    <div><h4>Música: loop de 8 notas</h4><canvas id="seqCv" width="256" height="96" style="width:100%;max-width:400px;image-rendering:pixelated;background:#000;border:1px solid var(--line);cursor:pointer"></canvas><div style="display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap"><button class="btn sm" id="seqPlay">▶ Loop</button><span class="chip">BPM <input id="seqBpm" type="range" min="80" max="200" value="140" style="width:80px"></span></div><p class="small muted">Clic en la grilla para encender notas. Un loop corto que se repite es exactamente cómo funciona la música de un juego: no molesta y da ritmo. Para música real: Suno/Udio (IA), OpenGameArt, o un músico amigo.</p></div></div>`;
  const play = () => playSfx(audio(), SFX[cur], audio().currentTime, pitch);
  $$('[data-sfx]', el).forEach(p => p.onclick = () => { cur = p.dataset.sfx; $$('[data-sfx]', el).forEach(x => x.classList.toggle('on', x === p)); play(); });
  $('#sfxPitch').oninput = e => { pitch = +e.target.value / 100; $('#sfxPitchV').textContent = pitch.toFixed(1) + '×'; };
  $('#sfxPlay').onclick = play;
  $('#sfxDl').onclick = () => sfxToWav(SFX[cur], pitch).then(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = cur + '.wav'; a.click(); toast('Descargando ' + cur + '.wav'); });
  /* secuenciador */
  const NOTES = [523, 440, 392, 330, 262, 220], grid = Array.from({ length: 6 }, (_, r) => Array.from({ length: 8 }, (_, c) => (r === 4 && c % 2 === 0) || (r === 1 && c === 3) || (r === 0 && c === 7) ? 1 : 0)); let step = 0, timer = null;
  const sg = $('#seqCv').getContext('2d'); const drawSeq = () => { sg.fillStyle = '#0b0f1e'; sg.fillRect(0, 0, 256, 96); grid.forEach((row, r) => row.forEach((v, c) => { sg.fillStyle = v ? (c === step && timer ? '#fff2a8' : '#ffd23f') : (c === step && timer ? '#1d2850' : '#121a33'); sg.fillRect(c * 32 + 2, r * 16 + 2, 28, 12); })); };
  $('#seqCv').onclick = e => { const r = e.target.getBoundingClientRect(); const c = Math.floor((e.clientX - r.left) / r.width * 8), row = Math.floor((e.clientY - r.top) / r.height * 6); grid[row][c] ^= 1; drawSeq(); };
  const tick = () => { const ctx = audio(); grid.forEach((row, r) => { if (row[step]) { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'square'; o.frequency.value = NOTES[r]; g.gain.setValueAtTime(.12, ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .2); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + .22); } }); drawSeq(); step = (step + 1) % 8; };
  const start = () => { clearInterval(timer); timer = setInterval(tick, 60000 / +$('#seqBpm').value / 2); };
  $('#seqPlay').onclick = () => { if (timer) { clearInterval(timer); timer = null; $('#seqPlay').textContent = '▶ Loop'; drawSeq(); } else { start(); $('#seqPlay').textContent = '⏸ Parar'; } };
  $('#seqBpm').oninput = () => { if (timer) start(); };
  ACTIVE_GAMES.add({ destroy: () => clearInterval(timer) }); drawSeq();
};

/* ---------- B5: caza de bugs ---------- */
class BugHunt extends MiniGame {
  constructor(host) { super(host, { w: 320, h: 180, title: 'Caza de bugs: hay 3', hint: 'Clic · flechas · juntá las 5 monedas y observá TODO', dpadAction: false }); this.fix = { a: false, b: false, c: false }; }
  reset() { this.won = false; this.t = 0; this.p = { x: 20, y: 80, w: 12, h: 12 }; this.score = 0; this.coins = [[70, 30], [150, 140], [220, 40], [280, 120], [160, 80]].map(([x, y]) => ({ x, y, w: 8, h: 8, got: false })); this.hudUpdate(); }
  hudUpdate() { this.setHud(`PUNTAJE <b>${this.score}</b><br>MONEDAS <b>${this.coins.filter(c => c.got).length}/5</b><br>x: <b>${Math.round(this.p.x)}</b>`); }
  update(dt) { if (this.won) return; this.t += dt; const k = this.keys, p = this.p, s = 90 * dt; if (k.ArrowLeft) p.x -= s; if (k.ArrowRight) p.x += s; if (k.ArrowUp) p.y -= s; if (k.ArrowDown) p.y += s;
    p.y = Math.max(0, Math.min(168, p.y)); if (this.fix.b) p.x = Math.max(0, Math.min(308, p.x)); else p.x = Math.max(0, p.x); /* bug B: sin límite derecho */
    this.coins.forEach(c => { if (!c.got && this.hit(p, c)) { c.got = true; this.score += this.fix.a ? 10 : 20; /* bug A: suma 20 en vez de 10 */ this.hudUpdate(); } });
    if (Math.floor(this.t * 5) % 3 === 0) this.hudUpdate();
    const got = this.coins.filter(c => c.got).length; if (got >= (this.fix.c ? 5 : 4)) this.win(`Puntaje ${this.score}`); /* bug C: gana con 4 */ }
  draw() { this.bg('#0b0f1e'); for (let x = 0; x < 320; x += 16) for (let y = 0; y < 180; y += 16) this.spr('floor', x, y, 2); this.coins.forEach(c => { if (!c.got) this.spr('coin', c.x, c.y + Math.sin(this.t * 4 + c.x) * 1.5, 1); }); this.spr('player', this.p.x, this.p.y, 1); this.text(`SCORE ${this.score}`, 8, 14, '#ffd23f', 8); }
}

MOUNTS.timer = el => {
  const defMin = +el.dataset.min || STATE.timerMin || 10; let total = defMin * 60, left = total, iv = null;
  el.innerHTML = `<div class="digits" id="tDigits"></div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center">
      <button class="btn primary" id="tStart">▶ Iniciar</button><button class="btn" id="tPause">⏸ Pausar</button><button class="btn" id="tReset">↺ Reiniciar</button>
      <span class="chip">Minutos: <input id="tMin" type="number" min="1" max="60" value="${defMin}" style="width:56px;background:var(--bg2);border:1px solid var(--line);padding:2px 6px;border-radius:var(--radius)"></span>
    </div><div class="bar striped" style="max-width:520px;margin:18px auto 0"><i id="tBar" style="width:100%"></i></div>`;
  const dig = $('#tDigits'), bar = $('#tBar');
  const show = () => { dig.textContent = `${pad(Math.floor(left / 60))}:${pad(left % 60)}`; bar.style.width = (left / total * 100) + '%'; dig.classList.toggle('alarm', left === 0); };
  const stop = () => { clearInterval(iv); iv = null; };
  $('#tStart').onclick = () => { if (iv || left === 0) return; iv = setInterval(() => { left = Math.max(0, left - 1); show(); if (left === 0) { stop(); toast('⏰ Fin de la pausa'); } }, 1000); };
  $('#tPause').onclick = stop;
  $('#tReset').onclick = () => { stop(); total = (parseInt($('#tMin').value) || 10) * 60; left = total; show(); };
  $('#tMin').onchange = () => { if (!el.dataset.min) { STATE.timerMin = Math.max(1, Math.min(60, parseInt($('#tMin').value) || 10)); saveState(); } $('#tReset').onclick(); };
  ACTIVE_GAMES.add({ destroy: stop });
  show();
};

  const render = () => {
    el.innerHTML = `<h4 style="margin:14px 0 6px">Lista de verificación</h4>` + items.map((t, i) => `<div class="check ${STATE.env[i] ? 'done' : ''}" data-i="${i}"><div class="box">${STATE.env[i] ? '✔' : ''}</div><span class="t">${esc(t)}</span></div>`).join('') + `<div class="bar" style="margin-top:8px"><i style="width:${Object.values(STATE.env).filter(Boolean).length / items.length * 100}%"></i></div>`;
    $$('.check', el).forEach(c => c.onclick = () => { STATE.env[c.dataset.i] = !STATE.env[c.dataset.i]; saveState(); render(); });
  };
  render();
};

/* Bloque 07 — registro de cambios */
MOUNTS.changeLog = el => {
  const render = () => {
    el.innerHTML = `<div class="grid c3" style="margin-top:12px">${[0, 1, 2].map(i => `<div class="field"><label><span>${pad(i + 1)}</span>Cambio ${i + 1}</label><textarea data-c="${i}" placeholder="Qué cambio pedí / cómo lo verifiqué">${esc(STATE.changes[i] || '')}</textarea><button class="btn sm" data-p3="${i}" style="margin-top:6px">⧉ Copiar Prompt 3 con este cambio</button></div>`).join('')}</div>`;
    $$('[data-c]', el).forEach(t => t.oninput = () => { STATE.changes[t.dataset.c] = t.value; saveState(); });
    $$('[data-p3]', el).forEach(b => b.onclick = () => { const v = (STATE.changes[b.dataset.p3] || '').trim(); const p = PROMPTS.find(x => x.id === 'p3'); copyText(p.text.replace('[DESCRIBIR CAMBIO]', v || '[DESCRIBIR CAMBIO]'), v ? 'Prompt 3 copiado con tu cambio' : 'Prompt 3 copiado (sin cambio descrito)'); });
  };
  render();
  $$('.pill[data-change]').forEach(p => p.onclick = () => { const slot = [0, 1, 2].find(i => !(STATE.changes[i] || '').trim()); if (slot === undefined) { toast('Los 3 cambios están completos'); return; } STATE.changes[slot] = p.dataset.change; saveState(); render(); toast(`Cambio ${slot + 1} cargado`); });
};

/* Bloque 08 — juego con bug */
MOUNTS.bugGame = el => {
  const game = new BugGame(el);
  const rv = $('#bugReveal'), fx = $('#bugFix');
  if (rv) rv.onclick = () => { $('#bugExplain').classList.toggle('hidden'); };
  if (fx) fx.onclick = () => { game.fixed = !game.fixed; game.reset(); fx.textContent = game.fixed ? '↩ Volver a la versión con bug' : '🩹 Aplicar corrección'; toast(game.fixed ? 'Corrección aplicada: score += 10' : 'Bug restaurado: score = 10'); game.cv.focus(); };
};

/* Bloque 09 — checklist final */
MOUNTS.checklist = el => {
  const render = () => {
    const done = CHECKS.filter((_, i) => STATE.check[i]).length;
    el.innerHTML = CHECKS.map((t, i) => `<div class="check ${STATE.check[i] ? 'done' : ''}" data-i="${i}"><div class="box">${STATE.check[i] ? '✔' : ''}</div><span class="t">${esc(t)}</span></div>`).join('') +
      `<div style="margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div class="bar striped" style="flex:1;min-width:200px"><i style="width:${done / CHECKS.length * 100}%"></i></div><b class="px">${done}/${CHECKS.length}</b></div>
       ${done === CHECKS.length ? '<div class="callout fade" style="border-color:var(--acc4)"><b style="color:var(--acc4)">★ ENCUENTRO 01 COMPLETADO.</b> Tenés un videojuego que abre, se controla y se gana. Guardá la carpeta. Nos vemos en el Encuentro 02.</div>' : ''}
       <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="exportAll">⬇ Exportar todo mi progreso (.txt)</button></div>`;
    const c = $('#checkCount'); if (c) c.textContent = `${done}/${CHECKS.length} completadas`;
    $$('.check', el).forEach(x => x.onclick = () => { STATE.check[x.dataset.i] = !STATE.check[x.dataset.i]; saveState(); render(); });
    $('#exportAll').onclick = () => downloadText('progreso-encuentro-01.txt', exportAll());
  };
  render();
};
function exportAll() {
  return gddText() + `\n\nCORE LOOP: ${STATE.loopLine || '(sin completar)'}\n\nCAMBIOS REALIZADOS:\n${[0, 1, 2].map(i => `${i + 1}. ${STATE.changes[i] || '-'}`).join('\n')}\n\nCHECKLIST:\n${CHECKS.map((t, i) => `[${STATE.check[i] ? 'x' : ' '}] ${t}`).join('\n')}\n\nExportado: ${new Date().toLocaleString('es-AR')}`;
}

/* =========================================================
   ROUTER / RENDER
   ========================================================= */
const view = $('#view'), idx = $('#index'), prog = $('#progress');

function go(route) { STATE.route = route; saveState(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function enc(n) { return COURSE.encuentros.find(e => e.n === n); }

function renderNav() {
  $('#encnav').innerHTML = COURSE.encuentros.map(e => `<button class="tab ${STATE.route.view === 'enc' && STATE.route.e === e.n ? 'on' : ''} ${e.ready ? '' : 'locked'}" style="--c:${e.color}" data-e="${e.n}"><span class="dot"></span>E0${e.n}${e.ready ? '' : ' ◌'}</button>`).join('');
  $$('#encnav .tab').forEach(t => t.onclick = () => go({ view: 'enc', e: +t.dataset.e, b: STATE.route.e === +t.dataset.e ? STATE.route.b : 0 }));
  $$('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === STATE.mode));
  $$('#themeSeg button').forEach(b => b.classList.toggle('on', b.dataset.t === STATE.theme));
}

function render() {
  destroyGames();
  const r = STATE.route;
  document.documentElement.style.setProperty('--cur', r.view === 'enc' ? enc(r.e).color : 'var(--e1)');
  renderNav();
  $('#body').classList.toggle('home', r.view === 'home');
  $('#body').classList.toggle('home', r.view === 'home');
  if (r.view === 'home') renderHome(); else renderEnc(enc(r.e), r.b);
  view.classList.remove('fade'); void view.offsetWidth; view.classList.add('fade');
}

function renderHome() {
  prog.classList.remove('show'); idx.innerHTML = '';
  const m = COURSE.meta;
  view.innerHTML = `
    <div class="hero">
      <canvas id="heroCv" width="320" height="140"></canvas>
      <h1>${esc(COURSE.title)}</h1>
      <p class="lead">Curso presencial de 16 horas en 4 encuentros. Aprender haciendo: cada participante diseña, desarrolla y publica <b>su propio videojuego</b> con Google Antigravity, HTML, JavaScript y Phaser. Sin programación previa.</p>
      <div class="stat-row">
        <span class="chip"><b>${m.horas} h</b> totales</span><span class="chip"><b>${m.encuentros}</b> encuentros · 1 por semana</span><span class="chip"><b>${m.porEncuentro} h</b> por encuentro</span><span class="chip">${esc(m.publico)}</span><span class="chip">${esc(m.herramienta)}</span><span class="chip">${esc(m.tech)}</span>
      </div>
    </div>
    <div class="grid c2" style="margin-top:10px">
      ${COURSE.encuentros.map(e => `<div class="enc-card" style="--c:${e.color}" data-e="${e.n}">
        <span class="status ${e.ready ? 'ok' : ''}">${e.ready ? '● DISPONIBLE' : '◌ PRÓXIMAMENTE'}</span>
        <div class="num">ENCUENTRO 0${e.n} · 240 MIN</div><h3>${esc(e.title)}</h3>
        <p class="small muted">${esc(e.objective)}</p>
        <p class="small"><b>Entregable:</b> ${esc(e.deliverable)}</p>
      </div>`).join('')}
    </div>
    <div class="panel" style="margin-top:24px">
      <h3>Metodología del proyecto espejo</h3>
      <p class="small muted">El docente desarrolla su videojuego en vivo, en paralelo con los estudiantes. Cada ejercicio tiene tres momentos:</p>
      ${ocem('El docente explica un concepto y muestra un ejemplo.', 'El docente implementa una funcionalidad en vivo mediante Antigravity.', 'Los estudiantes replican el procedimiento y la personalizan en sus propios videojuegos.')}
    </div>
    <div class="grid c3">
      <div class="card"><h3>👁 Modo presentación</h3><p class="small muted">Textos grandes, sin índice lateral. Para proyectar.</p></div>
      <div class="card"><h3>📝 Modo alumno</h3><p class="small muted">Índice, actividades, copiar prompts, completar la ficha.</p></div>
      <div class="card"><h3>💾 Tu progreso</h3><p class="small muted">Ficha GDD, checklists y respuestas se guardan en <b>este navegador y dispositivo</b>. Exportá el .txt para llevarlo a otro lado.</p></div>
    </div>`;
  startHero($('#heroCv'));
  $$('.enc-card').forEach(c => c.onclick = () => go({ view: 'enc', e: +c.dataset.e, b: 0 }));
  $('#navMid').textContent = 'Inicio · elegí un encuentro';
  $('#btnPrev').disabled = true; $('#btnNext').disabled = false; $('#btnNext').textContent = 'Encuentro 01 ▶';
}

function renderEnc(e, b) {
  if (!e.ready || !e.blocks.length) return renderEncSoon(e);
  b = Math.max(0, Math.min(e.blocks.length - 1, b || 0));
  const blk = e.blocks[b];
  STATE.visited[e.n + ':' + blk.id] = true; saveState();
  /* índice */
  idx.innerHTML = `<h4>Encuentro 0${e.n}</h4><div class="small muted" style="margin-bottom:12px">${esc(e.title)}</div>` + e.blocks.map((x, i) => `<div class="idx-item ${i === b ? 'on' : ''}" data-b="${i}"><span class="n">${x.num}</span><span><span style="${STATE.visited[e.n + ':' + x.id] && i !== b ? 'opacity:.75' : ''}">${esc(x.title)}</span><span class="time">min ${x.start}–${x.end} · ${x.end - x.start} min</span></span></div>`).join('')
    + `<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px" class="small muted"><b>Objetivo:</b> ${esc(e.objective)}<br><br><b>Entregable:</b> ${esc(e.deliverable)}</div>`;
  $$('.idx-item', idx).forEach(i => i.onclick = () => go({ view: 'enc', e: e.n, b: +i.dataset.b }));
  /* progreso */
  prog.classList.add('show');
  const total = e.blocks[e.blocks.length - 1].end;
  prog.innerHTML = `<div class="progress-meta"><span><b style="color:var(--cur)">E0${e.n}</b> · Bloque ${b + 1}/${e.blocks.length} · <b>${esc(blk.title)}</b></span><span>min ${blk.start}–${blk.end} · ${blk.end - blk.start} min · ${Math.round(blk.end / total * 100)}% del encuentro al terminar</span></div>
    <div class="timeline">${e.blocks.map((x, i) => `<div class="seg-b ${i < b ? 'done' : ''} ${i === b ? 'cur' : ''}" style="--w:${x.end - x.start}" data-b="${i}" data-tip="${x.num} ${esc(x.title)} · ${x.start}–${x.end}"></div>`).join('')}</div>`;
  $$('.seg-b', prog).forEach(s => s.onclick = () => go({ view: 'enc', e: e.n, b: +s.dataset.b }));
  /* contenido */
  view.innerHTML = `<div class="block-head"><div><div class="kicker">ENCUENTRO 0${e.n} · BLOQUE ${blk.num}</div><h1>${esc(blk.title)}</h1></div>
    <div class="chips"><span class="chip acc">⏱ <b>${blk.end - blk.start} min</b></span><span class="chip">min ${blk.start} → ${blk.end}</span>${blk.pause ? '' : `<span class="chip">👁 🔧 🎮 proyecto espejo</span>`}</div></div>` + blk.html();
  mountAll(view);
  $$('canvas[data-persp]', view).forEach(cv => drawPerspective(cv, cv.dataset.persp));
  /* nav */
  $('#btnPrev').disabled = false; $('#btnNext').disabled = false;
  $('#btnPrev').textContent = b === 0 ? '◀ Inicio' : `◀ ${e.blocks[b - 1].num} ${e.blocks[b - 1].title}`;
  const nextE = enc(e.n + 1);
  $('#btnNext').textContent = b < e.blocks.length - 1 ? `${e.blocks[b + 1].num} ${e.blocks[b + 1].title} ▶` : nextE ? `Encuentro 0${nextE.n} ▶` : 'Inicio ▶';
  $('#navMid').textContent = `${blk.start}–${blk.end} min · bloque ${b + 1} de ${e.blocks.length}`;
}

function renderEncSoon(e) {
  prog.classList.remove('show');
  const total = e.program.reduce((a, p) => a + p[1], 0);
  idx.innerHTML = `<h4>Encuentro 0${e.n}</h4><div class="small muted">${esc(e.title)}</div><div class="soon" style="margin-top:12px">◌ Material interactivo próximamente</div>`;
  view.innerHTML = `<div class="block-head"><div><div class="kicker">ENCUENTRO 0${e.n}</div><h1>${esc(e.title)}</h1></div><div class="chips"><span class="chip acc">⏱ <b>${total} min</b></span><span class="chip">${e.program.length} contenidos</span></div></div>
    <div class="two"><div class="card"><h4>Objetivo</h4><p>${esc(e.objective)}</p></div><div class="card"><h4>Entregable</h4><p>${esc(e.deliverable)}</p></div></div>
    <div class="panel"><h3>Programa</h3><div class="program">${e.program.map((p, i) => `<div class="row"><span class="n">${pad(i + 1)}</span><span>${esc(p[0])}</span><span class="t">${p[1]} min</span></div>`).join('')}</div></div>
    <div class="soon">◌ &nbsp;El material interactivo de este encuentro se incorporará próximamente. La estructura ya está lista: se agregan los bloques en <code>COURSE.encuentros[${e.n - 1}].blocks</code> y <code>ready: true</code>.</div>`;
  const prevE = enc(e.n - 1), nextE = enc(e.n + 1);
  $('#btnPrev').disabled = false; $('#btnNext').disabled = false;
  $('#btnPrev').textContent = prevE ? `◀ Encuentro 0${prevE.n}` : '◀ Inicio';
  $('#btnNext').textContent = nextE ? `Encuentro 0${nextE.n} ▶` : 'Inicio ▶';
  $('#navMid').textContent = `Encuentro 0${e.n} · ${total} min · programa general`;
}

/* anterior / siguiente */
$('#btnNext').onclick = () => {
  const r = STATE.route;
  if (r.view === 'home') return go({ view: 'enc', e: 1, b: 0 });
  const e = enc(r.e);
  if (e.ready && r.b < e.blocks.length - 1) return go({ view: 'enc', e: e.n, b: r.b + 1 });
  const n = enc(e.n + 1); go(n ? { view: 'enc', e: n.n, b: 0 } : { view: 'home' });
};
$('#btnPrev').onclick = () => {
  const r = STATE.route; if (r.view === 'home') return;
  const e = enc(r.e);
  if (e.ready && r.b > 0) return go({ view: 'enc', e: e.n, b: r.b - 1 });
  const p = enc(e.n - 1);
  if (!p) return go({ view: 'home' });
  go({ view: 'enc', e: p.n, b: p.ready ? p.blocks.length - 1 : 0 });
};
/* teclas de navegación de página: sólo cuando ningún juego/campo tiene el foco */
document.addEventListener('keydown', e => {
  const a = document.activeElement; if (a && (a.tagName === 'CANVAS' || a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;
  if ($$('.ovl.show').length) return;
  if (e.key === 'PageDown' || (e.key === 'ArrowRight' && e.altKey)) $('#btnNext').click();
  if (e.key === 'PageUp' || (e.key === 'ArrowLeft' && e.altKey)) $('#btnPrev').click();
});

/* modo / tema / overlays */
$$('#modeSeg button').forEach(b => b.onclick = () => { STATE.mode = b.dataset.m; document.documentElement.dataset.mode = STATE.mode; saveState(); renderNav(); });
$$('#themeSeg button').forEach(b => b.onclick = () => { STATE.theme = b.dataset.t; document.documentElement.dataset.theme = STATE.theme; saveState(); renderNav(); });
$('#logo').onclick = () => go({ view: 'home' });
$('#btnGlossary').onclick = () => openGlossary();
$('#btnPrompts').onclick = () => {
  const groups = {}; PROMPTS.forEach(p => { const k = p.enc || 1; (groups[k] = groups[k] || []).push(p); });
  $('#promptsBody').innerHTML = `<p class="small muted">Todos los prompts del curso. El Prompt 1 incluye automáticamente tu ficha GDD si la completaste. Los textos entre <span class="ph-var">[corchetes]</span> se reemplazan por tu caso.</p>` + Object.keys(groups).map(k => `<h3 style="margin:18px 0 6px;color:${enc(+k).color}">Encuentro 0${k} · ${esc(enc(+k).title)}</h3>` + groups[k].map(p => promptBox(p.id)).join('')).join('') + `<div class="callout small"><b>Consejo:</b> pegá un prompt por vez. Esperá a que el agente termine y pruebe antes de mandar el siguiente.</div>`;
  openOvl('ovlPrompts');
};

/* init */
document.documentElement.dataset.theme = STATE.theme; document.documentElement.dataset.mode = STATE.mode;
if (STATE.route && STATE.route.view === 'enc' && !enc(STATE.route.e)) STATE.route = { view: 'home' };
render();
</script></body></html>
