MOUNTS.gameLoopViz = el => {
  const steps = [['INPUT', 'Leer teclas, mouse o touch. ¿Qué está apretando el jugador AHORA?', '#3ee6ff'], ['UPDATE', 'Aplicar reglas: mover, gravedad, colisiones, puntaje, enemigos. Todo lo que cambia el estado.', '#ffd23f'], ['DRAW', 'Dibujar el estado actual en pantalla. Sólo mirar, no tocar.', '#7cff6b'], ['WAIT', 'Esperar al siguiente cuadro (1/60 s). Y volver a empezar.', '#98a6cf']];
  let i = -1, auto = null, frame = 0;
  el.innerHTML = `<div class="two"><div><div class="loop" style="justify-content:flex-start">${steps.map((s, k) => `<div class="node" data-i="${k}" style="min-width:90px">${s[0]}</div>${k < 3 ? '<span class="arrow">→</span>' : ''}`).join('')}<div class="back">↺ 60 veces por segundo</div></div><div class="card" id="glInfo"><p class="muted">Apretá "Un paso" para avanzar por el ciclo, o "Automático".</p></div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn sm primary" id="glStep">▶ Un paso</button><button class="btn sm" id="glAuto">⟳ Automático</button><span class="chip">frame <b id="glFrame">0</b></span></div></div>
    <canvas id="glCv" width="160" height="90" style="width:100%;max-width:400px;image-rendering:pixelated;background:#000;border:1px solid var(--line)"></canvas></div>`;
  const g = $('#glCv').getContext('2d'); let px = 20, vx = 1, coin = { x: 120, got: false }, drawn = { px: 20, coin: false };
  const draw = () => { g.fillStyle = '#0e1630'; g.fillRect(0, 0, 160, 90); for (let x = 0; x < 160; x += 8) g.drawImage(sprite('grass', 1), x, 74); if (!drawn.coin) g.drawImage(sprite('coin', 1), coin.x, 60); g.drawImage(sprite('player', 1), drawn.px, 62); g.fillStyle = '#98a6cf'; g.font = '6px "Press Start 2P"'; g.fillText(steps[i] ? steps[i][0] : 'ESPERANDO', 4, 10); };
  const step = () => { i = (i + 1) % 4; if (i === 0) frame++; const s = steps[i]; $$('.node', el).forEach(n => n.classList.toggle('on', +n.dataset.i === i));
    let extra = ''; if (i === 0) extra = `<p class="small">Tecla detectada: <b>${vx > 0 ? '→ derecha' : '← izquierda'}</b></p>`; if (i === 1) { px += vx * 6; if (px > 136 || px < 8) vx *= -1; if (!coin.got && Math.abs(px - coin.x) < 8) coin.got = true; extra = `<p class="small">x del jugador = <b>${px}</b> · moneda: <b>${coin.got ? 'recogida (+10)' : 'no'}</b></p><p class="small muted">El estado cambió, pero la pantalla todavía muestra lo viejo.</p>`; } if (i === 2) { drawn = { px, coin: coin.got }; extra = `<p class="small">Ahora sí: la pantalla refleja el estado.</p>`; } if (i === 3) extra = `<p class="small">1/60 s después, otra vez INPUT.</p>`;
    $('#glInfo').innerHTML = `<h3 style="color:${s[2]}">${s[0]}</h3><p>${s[1]}</p>${extra}`; $('#glFrame').textContent = frame; draw(); };
  $('#glStep').onclick = step; $('#glAuto').onclick = () => { if (auto) { clearInterval(auto); auto = null; $('#glAuto').textContent = '⟳ Automático'; } else { auto = setInterval(step, 350); $('#glAuto').textContent = '⏸ Detener'; } };

/* ---------- B2: IA de enemigos ---------- */
class AIGame extends MiniGame {
  constructor(host) { super(host, { w: 320, h: 180, title: 'IA de enemigos', hint: 'Clic · flechas · sobreviví 20 segundos', dpadAction: false }); }
  reset() { this.won = false; this.t = 0; this.mode = this.mode || 'patrol'; this.p = { x: 40, y: 90, w: 10, h: 10 }; this.e = { x: 240, y: 90, w: 10, h: 8, vx: 50, vy: 0 }; this.bullets = []; this.shotT = 0; this.hudUpdate(); }
  hudUpdate() { this.setHud(`TIEMPO <b>${Math.max(0, 20 - Math.floor(this.t))}</b>s<br>MODO: <b>${({ patrol: 'PATRULLA', chase: 'PERSIGUE', turret: 'DISPARA' })[this.mode]}</b>`); }
  update(dt) {
    if (this.won) return; this.t += dt; if (Math.floor(this.t * 10) % 5 === 0) this.hudUpdate();
    const k = this.keys, p = this.p, s = 90 * dt; if (k.ArrowLeft) p.x -= s; if (k.ArrowRight) p.x += s; if (k.ArrowUp) p.y -= s; if (k.ArrowDown) p.y += s; p.x = Math.max(0, Math.min(310, p.x)); p.y = Math.max(0, Math.min(170, p.y));
    const e = this.e;
    if (this.mode === 'patrol') { e.x += e.vx * dt; if (e.x < 150 || e.x > 300) e.vx *= -1; }
    if (this.mode === 'chase') { const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy); if (d < 120) { e.x += dx / d * 55 * dt; e.y += dy / d * 55 * dt; } }
    if (this.mode === 'turret') { this.shotT += dt; if (this.shotT > 1) { this.shotT = 0; const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy); this.bullets.push({ x: e.x + 4, y: e.y + 4, w: 4, h: 4, vx: dx / d * 110, vy: dy / d * 110 }); } }
    this.bullets.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; }); this.bullets = this.bullets.filter(b => b.x > -10 && b.x < 330 && b.y > -10 && b.y < 190);

    if (this.t >= 20) this.win('¡Sobreviviste!');
  }
  draw() { this.bg('#0b0f1e'); for (let x = 0; x < 320; x += 16) for (let y = 0; y < 180; y += 16) this.spr('floor', x, y, 2); if (this.mode === 'chase') { this.g.strokeStyle = 'rgba(255,95,180,.35)'; this.g.beginPath(); this.g.arc(this.e.x + 5, this.e.y + 4, 120, 0, 7); this.g.stroke(); } if (this.mode === 'patrol') { this.rect(150, 100, 160, 1, '#2b3a6b'); } this.bullets.forEach(b => this.rect(b.x, b.y, 4, 4, '#ff5a5a')); this.spr('enemy', this.e.x, this.e.y, 1); this.spr('player', this.p.x, this.p.y, 1); }
}

  $('#sfxDl').onclick = () => sfxToWav(SFX[cur], pitch).then(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = cur + '.wav'; a.click(); toast('Descargando ' + cur + '.wav'); });
  /* secuenciador */
  const NOTES = [523, 440, 392, 330, 262, 220], grid = Array.from({ length: 6 }, (_, r) => Array.from({ length: 8 }, (_, c) => (r === 4 && c % 2 === 0) || (r === 1 && c === 3) || (r === 0 && c === 7) ? 1 : 0)); let step = 0, timer = null;
  const sg = $('#seqCv').getContext('2d'); const drawSeq = () => { sg.fillStyle = '#0b0f1e'; sg.fillRect(0, 0, 256, 96); grid.forEach((row, r) => row.forEach((v, c) => { sg.fillStyle = v ? (c === step && timer ? '#fff2a8' : '#ffd23f') : (c === step && timer ? '#1d2850' : '#121a33'); sg.fillRect(c * 32 + 2, r * 16 + 2, 28, 12); })); };
  $('#seqCv').onclick = e => { const r = e.target.getBoundingClientRect(); const c = Math.floor((e.clientX - r.left) / r.width * 8), row = Math.floor((e.clientY - r.top) / r.height * 6); grid[row][c] ^= 1; drawSeq(); };
  const tick = () => { const ctx = audio(); grid.forEach((row, r) => { if (row[step]) { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'square'; o.frequency.value = NOTES[r]; g.gain.setValueAtTime(.12, ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .2); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + .22); } }); drawSeq(); step = (step + 1) % 8; };
  const start = () => { clearInterval(timer); timer = setInterval(tick, 60000 / +$('#seqBpm').value / 2); };
  $('#seqPlay').onclick = () => { if (timer) { clearInterval(timer); timer = null; $('#seqPlay').textContent = '▶ Loop'; drawSeq(); } else { start(); $('#seqPlay').textContent = '⏸ Parar'; } };
  $('#seqBpm').oninput = () => { if (timer) start(); };
  ACTIVE_GAMES.add({ destroy: () => clearInterval(timer) }); drawSeq();
};

/* ---------- B5: caza de bugs ---------- */
class BugHunt extends MiniGame {
  constructor(host) { super(host, { w: 320, h: 180, title: 'Caza de bugs: hay 3', hint: 'Clic · flechas · juntá las 5 monedas y observá TODO', dpadAction: false }); this.fix = { a: false, b: false, c: false }; }
  reset() { this.won = false; this.t = 0; this.p = { x: 20, y: 80, w: 12, h: 12 }; this.score = 0; this.coins = [[70, 30], [150, 140], [220, 40], [280, 120], [160, 80]].map(([x, y]) => ({ x, y, w: 8, h: 8, got: false })); this.hudUpdate(); }
  hudUpdate() { this.setHud(`PUNTAJE <b>${this.score}</b><br>MONEDAS <b>${this.coins.filter(c => c.got).length}/5</b><br>x: <b>${Math.round(this.p.x)}</b>`); }
  update(dt) { if (this.won) return; this.t += dt; const k = this.keys, p = this.p, s = 90 * dt; if (k.ArrowLeft) p.x -= s; if (k.ArrowRight) p.x += s; if (k.ArrowUp) p.y -= s; if (k.ArrowDown) p.y += s;
    p.y = Math.max(0, Math.min(168, p.y)); if (this.fix.b) p.x = Math.max(0, Math.min(308, p.x)); else p.x = Math.max(0, p.x); /* bug B: sin límite derecho */
    this.coins.forEach(c => { if (!c.got && this.hit(p, c)) { c.got = true; this.score += this.fix.a ? 10 : 20; /* bug A: suma 20 en vez de 10 */ this.hudUpdate(); } });
    if (Math.floor(this.t * 5) % 3 === 0) this.hudUpdate();
    const got = this.coins.filter(c => c.got).length; if (got >= (this.fix.c ? 5 : 4)) this.win(`Puntaje ${this.score}`); /* bug C: gana con 4 */ }
  draw() { this.bg('#0b0f1e'); for (let x = 0; x < 320; x += 16) for (let y = 0; y < 180; y += 16) this.spr('floor', x, y, 2); this.coins.forEach(c => { if (!c.got) this.spr('coin', c.x, c.y + Math.sin(this.t * 4 + c.x) * 1.5, 1); }); this.spr('player', this.p.x, this.p.y, 1); this.text(`SCORE ${this.score}`, 8, 14, '#ffd23f', 8); }
}

/* ---------- B1: demo de "juice" ---------- */
class JuiceGame extends DemoGame {
  constructor(host) { super(host, true); this.J = { shake: true, part: true, flash: true, sfx: true }; this.ps = []; this.shake = 0; this.flash = 0; this.opts.title = 'Con y sin "juice"'; }
  update(dt) { const before = this.score; super.update(dt); if (this.score > before) { if (this.J.part) for (let i = 0; i < 25; i++) { const a = Math.random() * 6.28, s = 40 + Math.random() * 80; this.ps.push({ x: this.p.x + 6, y: this.p.y + 6, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: .5 }); } if (this.J.shake) this.shake = .15; if (this.J.flash) this.flash = .1; if (this.J.sfx) { try { playSfx(audio(), SFX.coin, audio().currentTime, 1); } catch (e) { } } } this.ps.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.l -= dt; }); this.ps = this.ps.filter(p => p.l > 0); this.shake = Math.max(0, this.shake - dt); this.flash = Math.max(0, this.flash - dt); }
  draw() { if (!this.ps) { this.ps = []; this.shake = 0; this.flash = 0; } const g = this.g; g.save(); if (this.shake > 0) g.translate((Math.random() - .5) * 6, (Math.random() - .5) * 6); super.draw(); this.ps.forEach(p => { g.globalAlpha = p.l * 2; g.fillStyle = '#ffd23f'; g.fillRect(p.x, p.y, 3, 3); }); g.globalAlpha = 1; if (this.flash > 0) { g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(-10, -10, 340, 200); } g.restore(); }
}

  const cv = $('#fpsCv'), g = cv.getContext('2d'); g.imageSmoothingEnabled = false; let items = [], raf, last = performance.now(), frames = 0, acc = 0;
  const sync = () => { const n = +$('#fpsN').value; $('#fpsNV').textContent = n; while (items.length < n) items.push({ x: Math.random() * 320, y: Math.random() * 180, vx: (Math.random() - .5) * 60, vy: (Math.random() - .5) * 60, s: ['coin', 'enemy', 'player', 'key'][items.length % 4] }); items.length = n; };

};

  const body = blk.sections || [{ title: blk.title, html: blk.html, single: true }];
  const cover = { title: 'Portada', cover: true, html: () => `<div class="block-head"><div class="kicker">ENCUENTRO 0${e.n} · PARTE ${partIdx} · BLOQUE ${blk.num}</div><h1>${esc(blk.title)}</h1>${blk.intro ? `<p class="intro">${blk.intro}</p>` : ''}<div class="chips"><span class="chip acc">⏱ <b>${blk.end - blk.start} min</b></span><span class="chip">min ${blk.start} → ${blk.end}</span><span class="chip">${body.length + 1} secciones</span>${blk.pause ? '' : `<span class="chip">👁 🔧 🎮 proyecto espejo</span>`}</div></div>
    <div class="agenda ${body.length > 6 ? 'two' : ''}">${body.map((sc, k) => `<div class="ag" data-goto="${k + 1}"><span class="n">${pad(k + 2)}</span><span>${esc(sc.single ? 'Contenido' : sc.title)}</span></div>`).join('')}</div>` };
  const secs = blk.pause ? [{ title: blk.title, html: blk.html }] : [cover].concat(body);
  prog.innerHTML = `<div class="ptop"><div class="progress-meta"><span><b style="color:var(--cur)">E0${e.n}</b> · Parte ${partIdx} · Bloque ${b + 1}/${e.blocks.length} · <b>${esc(blk.title)}</b></span><span class="sub">· min ${blk.start}–${blk.end}${secs.length > 1 ? ` · ${secs.length} secciones` : ''}</span></div><div class="secTimer" id="secTimer"></div></div>
    <div class="timeline">${e.blocks.map((x, i) => `<div class="seg-b ${i < b ? 'done' : ''} ${i === b ? 'cur' : ''}" style="--w:${x.end - x.start}" data-b="${i}" data-tip="${x.num} ${esc(x.title)} · ${x.start}–${x.end}"></div>`).join('')}</div>`;
  $$('.seg-b', prog).forEach(s => s.onclick = () => go({ view: 'enc', e: e.n, b: +s.dataset.b, s: 0 }));
  /* contenido */
  const secHtml = (sc, k) => `<section class="section ${sc.single ? 'single' : ''} ${sc.cover ? 'cover' : ''}" data-s="${k}">${!sc.cover && !sc.single && secs.length > 1 ? `<div class="sec-tag"><b>Sección ${k + 1}/${secs.length}</b> · ${esc(sc.title)}</div>` : ''}<div class="sec-body">${sc.html()}</div></section>`;
  view.innerHTML = secs.map((sc, k) => secHtml(sc, k)).join('');
  $$('.agenda .ag', view).forEach(a => a.onclick = () => { const t = $(`.section[data-s="${a.dataset.goto}"]`); if (t) window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--chrome-top')) || 60), behavior: 'smooth' }); });
  mountAll(view); measureChrome();
  $$('canvas[data-persp]', view).forEach(cv => drawPerspective(cv, cv.dataset.persp));
  /* nav */
  $('#btnPrev').disabled = false; $('#btnNext').disabled = false;
  const nextE = enc(e.n + 1);
  $('#btnPrev').textContent = b === 0 ? '◀ Inicio' : `◀ ${e.blocks[b - 1].num} ${e.blocks[b - 1].title}`;
  $('#btnNext').textContent = b < e.blocks.length - 1 ? `${e.blocks[b + 1].num} ${e.blocks[b + 1].title} ▶` : nextE ? `Encuentro 0${nextE.n} ▶` : 'Inicio ▶';
  $('#navMid').textContent = `${blk.start}–${blk.end} min · bloque ${b + 1} de ${e.blocks.length}${secs.length > 1 ? ` · ${secs.length} secciones` : ''}`;
  mountSectionTimer(e, b, blk);
  measureChrome(); fitSections(); setTimeout(() => { measureChrome(); fitSections(); }, 150); setTimeout(() => { measureChrome(); fitSections(); }, 700);
}

/* =========================================================
   AJUSTE POR SECCIÓN — cada sección entra completa, siempre.
   Sólo actúa si el contenido supera el alto disponible: reduce
   ese contenido (zoom) hasta que entre. No afecta al resto.
   ========================================================= */
function fitSections() {
  const cs = getComputedStyle(document.documentElement);
  const top = parseFloat(cs.getPropertyValue('--chrome-top')) || 60, bottom = parseFloat(cs.getPropertyValue('--chrome-bottom')) || 60;
  const availAll = window.innerHeight - top - bottom - 40; const rs = document.documentElement.style;
  rs.setProperty('--game-h', Math.max(160, Math.round(availAll * .62)) + 'px'); rs.setProperty('--vis-h', Math.max(60, Math.round(availAll * .19)) + 'px'); rs.setProperty('--hero-h', Math.max(160, Math.round(availAll * .64)) + 'px');
  $$('.section:not(.single), .home-s').forEach(sec => {
    const body = $('.sec-body', sec); if (!body) return;
    body.style.zoom = '';
    const tag = $('.sec-tag', sec); const avail = window.innerHeight - top - bottom - 36 - (tag ? tag.offsetHeight + 10 : 0);
    if (avail < 120) return;
    let r = 1;
    for (let i = 0; i < 6; i++) { const need = body.getBoundingClientRect().height; if (need <= avail) break; r = Math.max(.45, r * (avail / need) * .97); body.style.zoom = r; }
  });
}
window.addEventListener('resize', () => { measureChrome(); fitSections(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitSections());

/* =========================================================
   CRONÓMETRO DE SECCIÓN — arranca solo al entrar; pausa / stop / reinicio
   ========================================================= */
let secIv = null;
function mountSectionTimer(e, b, blk) {
  const key = e.n + ':' + blk.id, dur = (blk.end - blk.start) * 60;
  let T = STATE.secTimer;
  if (!T || T.key !== key) { T = STATE.secTimer = { key, left: dur, running: true, ts: Date.now(), dur, alarmed: false }; saveState(); }
  else if (T.running) { T.left = Math.max(0, T.left - Math.round((Date.now() - T.ts) / 1000)); T.ts = Date.now(); }
  const box = $('#secTimer'); if (!box) return;
  box.innerHTML = `<div class="tlab">BLOQUE<br>${blk.end - blk.start} min</div><div class="dg" id="stDg">00:00</div>
    <button class="tb" id="stPlay" title="Pausar / seguir">⏸</button><button class="tb" id="stStop" title="Stop (vuelve al inicio, detenido)">■</button><button class="tb" id="stReset" title="Reiniciar y arrancar">↺</button>
    <div class="tlab">CLASE<br><b id="stMin">min ${blk.start}</b>/${e.blocks[e.blocks.length - 1].end}</div>`;
  const dg = $('#stDg');
  const show = () => { const T = STATE.secTimer; dg.textContent = `${pad(Math.floor(T.left / 60))}:${pad(T.left % 60)}`; dg.classList.toggle('alarm', T.left === 0); dg.classList.toggle('paused', !T.running && T.left > 0); $('#stPlay').textContent = T.running ? '⏸' : '▶'; const elapsed = Math.min(T.dur, T.dur - T.left); $('#stMin').textContent = 'min ' + (blk.start + Math.floor(elapsed / 60)); };
  clearInterval(secIv);
  secIv = setInterval(() => { const T = STATE.secTimer; if (!T || T.key !== key) { clearInterval(secIv); return; } if (T.running && T.left > 0) { T.left--; T.ts = Date.now(); if (T.left % 5 === 0) saveState(); if (T.left === 0 && !T.alarmed) { T.alarmed = true; T.running = false; saveState(); try { playSfx(audio(), SFX.win, audio().currentTime, 1); } catch (x) { } toast('⏰ Fin de la sección: ' + blk.title); } } if (document.body.contains(dg)) show(); }, 1000);
  $('#stPlay').onclick = () => { const T = STATE.secTimer; T.running = !T.running; T.ts = Date.now(); saveState(); show(); };
  $('#stStop').onclick = () => { const T = STATE.secTimer; T.left = dur; T.running = false; T.alarmed = false; saveState(); show(); };
  $('#stReset').onclick = () => { const T = STATE.secTimer; T.left = dur; T.running = true; T.alarmed = false; T.ts = Date.now(); saveState(); show(); };
  show();
}

function renderEncSoon(e) {
  prog.classList.remove('show');
  const total = e.program.reduce((a, p) => a + p[1], 0);
  idx.innerHTML = `<h4>Encuentro 0${e.n}</h4><div class="small muted">${esc(e.title)}</div><div class="soon" style="margin-top:12px">◌ Material interactivo próximamente</div>`;
  view.innerHTML = `<div class="block-head"><div><div class="kicker">ENCUENTRO 0${e.n}</div><h1>${esc(e.title)}</h1></div><div class="chips"><span class="chip acc">⏱ <b>${total} min</b></span><span class="chip">${e.program.length} contenidos</span></div></div>
    <div class="two"><div class="card"><h4>Objetivo</h4><p>${esc(e.objective)}</p></div><div class="card"><h4>Entregable</h4><p>${esc(e.deliverable)}</p></div></div>
    <div class="panel"><h3>Programa</h3><div class="program">${e.program.map((p, i) => `<div class="row"><span class="n">${pad(i + 1)}</span><span>${esc(p[0])}</span><span class="t">${p[1]} min</span></div>`).join('')}</div></div>
    <div class="soon">◌ &nbsp;El material interactivo de este encuentro se incorporará próximamente. La estructura ya está lista: se agregan los bloques en <code>COURSE.encuentros[${e.n - 1}].blocks</code> y <code>ready: true</code>.</div>`;
  const prevE = enc(e.n - 1), nextE = enc(e.n + 1);
  $('#btnPrev').disabled = false; $('#btnNext').disabled = false;
  $('#btnPrev').textContent = prevE ? `◀ Encuentro 0${prevE.n}` : '◀ Inicio';
  $('#btnNext').textContent = nextE ? `Encuentro 0${nextE.n} ▶` : 'Inicio ▶';
  $('#navMid').textContent = `Encuentro 0${e.n} · ${total} min · programa general`;
}

/* medir header / barra / footer para que las secciones ocupen exactamente la pantalla */
function measureChrome() {
  const top = $('#top').offsetHeight + ($('#progress').classList.contains('show') ? $('#progress').offsetHeight : 0);
  const bottom = $('#navbar').offsetHeight; const head = $('.block-head');
  const r = document.documentElement.style; r.setProperty('--toph', $('#top').offsetHeight + 'px'); r.setProperty('--chrome-top', top + 'px'); r.setProperty('--chrome-bottom', bottom + 'px'); r.setProperty('--headh', (head ? head.offsetHeight + 12 : 0) + 'px');
}
window.addEventListener('resize', measureChrome);

/* anterior / siguiente */
function secCount(e, b) { const blk = e.blocks[b]; return blk && blk.sections ? blk.sections.length : 1; }
$('#btnNext').onclick = () => {
  const r = STATE.route;
  if (r.view === 'home') return go({ view: 'enc', e: 1, b: 0, s: 0 });
  const e = enc(r.e);
  if (e.ready && r.b < e.blocks.length - 1) return go({ view: 'enc', e: e.n, b: r.b + 1, s: 0 });
  const n = enc(e.n + 1); go(n && isOpen(n) ? { view: 'enc', e: n.n, b: 0, s: 0 } : { view: 'home' });
};
$('#btnPrev').onclick = () => {
  const r = STATE.route; if (r.view === 'home') return;
  const e = enc(r.e);
  if (e.ready && r.b > 0) return go({ view: 'enc', e: e.n, b: r.b - 1, s: 0 });
  const p = enc(e.n - 1);
  if (!p || !isOpen(p)) return go({ view: 'home' });
  go({ view: 'enc', e: p.n, b: p.ready ? p.blocks.length - 1 : 0, s: 0 });
};
/* teclas de navegación de página: sólo cuando ningún juego/campo tiene el foco */
document.addEventListener('keydown', e => {
  const a = document.activeElement; if (a && (a.tagName === 'CANVAS' || a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;
  if ($$('.ovl.show').length) return;
  if (STATE.route.view !== 'enc') { if (STATE.route.view === 'home' && (e.key === 'PageDown' || e.key === 'PageUp')) { const t = $$('.home-s'); const top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--chrome-top')) || 64; const y = window.scrollY + top + 2; const tops = t.map(x => x.getBoundingClientRect().top + window.scrollY); const target = e.key === 'PageDown' ? tops.find(v => v > y + 4) : tops.slice().reverse().find(v => v < y - 4); if (target != null) { e.preventDefault(); window.scrollTo({ top: target - top, behavior: 'smooth' }); } } return; }
  if (e.key === 'ArrowRight') { e.preventDefault(); $('#btnNext').click(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); $('#btnPrev').click(); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'PageDown' || e.key === 'PageUp') { const secs = $$('.section'); if (!secs.length) return; e.preventDefault(); const top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--chrome-top')) || 120; const y = window.scrollY + top + 2; const dir = (e.key === 'ArrowDown' || e.key === 'PageDown') ? 1 : -1; const tops = secs.map(x => x.getBoundingClientRect().top + window.scrollY); let target; if (dir > 0) target = tops.find(t => t > y + 4); else target = tops.slice().reverse().find(t => t < y - 4); if (target != null) window.scrollTo({ top: target - top, behavior: 'smooth' }); }
});

/* modo / tema / overlays */
function applyTheme() { const h = document.documentElement; h.dataset.theme = STATE.theme; h.dataset.mode = STATE.mode; if (STATE.light) h.dataset.light = '1'; else delete h.dataset.light; const g = STATE.glass == null ? 50 : STATE.glass; h.style.setProperty('--gb', (g * .3) + 'px'); h.style.setProperty('--ga', (0.04 + g / 100 * .14).toFixed(3)); $('#glassCtl').style.display = STATE.theme === 'glass' ? '' : 'none'; $('#glassRange').value = g; $('#btnLight').textContent = STATE.light ? '☀️ Día' : '🌙 Noche'; }
$('#glassRange').oninput = e => { STATE.glass = +e.target.value; saveState(); applyTheme(); };
$('#btnLight').onclick = () => { STATE.light = !STATE.light; saveState(); applyTheme(); };
$('#btnFull').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => toast('Tu navegador bloqueó la pantalla completa')); };
document.addEventListener('fullscreenchange', () => { $('#btnFull').textContent = document.fullscreenElement ? '⤢' : '⛶'; });
$$('#themeSeg button').forEach(b => b.onclick = () => { STATE.theme = b.dataset.t; saveState(); applyTheme(); renderNav(); });
$('#logo').onclick = () => go({ view: 'home' });
$('#btnSettings').onclick = e => { e.stopPropagation(); $('#settings').classList.toggle('hidden'); };
document.addEventListener('click', e => { if (!e.target.closest('#settings') && !e.target.closest('#btnSettings')) $('#settings').classList.add('hidden'); });
$('#btnGlossary').onclick = () => openGlossary();
$('#btnPrompts').onclick = () => {
  const groups = {}; PROMPTS.forEach(p => { const k = p.enc || 1; (groups[k] = groups[k] || []).push(p); });
  $('#promptsBody').innerHTML = `<p class="small muted">Todos los prompts del curso. El Prompt 1 incluye automáticamente tu ficha GDD si la completaste. Los textos entre <span class="ph-var">[corchetes]</span> se reemplazan por tu caso.</p>` + Object.keys(groups).map(k => `<h3 style="margin:18px 0 6px;color:${enc(+k).color}">Encuentro 0${k} · ${esc(enc(+k).title)}</h3>` + groups[k].map(p => promptBox(p.id)).join('')).join('') + `<div class="callout small"><b>Consejo:</b> pegá un prompt por vez. Esperá a que el agente termine y pruebe antes de mandar el siguiente.</div>`;
  openOvl('ovlPrompts');
};

/* init */
STATE.mode = 'present';
if (!['pixel', 'minimal', 'neo', 'glass'].includes(STATE.theme)) STATE.theme = 'pixel';
applyTheme();
if (STATE.route && STATE.route.view === 'enc' && (!enc(STATE.route.e) || !isOpen(enc(STATE.route.e)))) STATE.route = { view: 'home' };
render();
/* habilitación automática por fecha: si cambia el estado de algún encuentro, se refresca sin recargar */
let OPEN_KEY = openKey();
setInterval(() => { const k = openKey(); if (k === OPEN_KEY) return; OPEN_KEY = k; if (STATE.route.view === 'home') render(); else renderNav(); toast('Se habilitó un nuevo encuentro'); }, 30000);
</script></body></html>
