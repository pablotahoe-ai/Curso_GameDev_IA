<!DOCTYPE html>
<html lang="es" data-theme="pixel" data-mode="student">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAME DEV + IA — Curso interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS — dos temas: pixel (default) y minimal
   ========================================================= */
:root{
  --bg:#0b0f1e; --bg2:#121a33; --panel:#161f3d; --panel2:#1d2850;
  --line:#2b3a6b; --text:#e9eefc; --muted:#98a6cf; --dim:#5f6d99;
  --acc:#3ee6ff; --acc2:#ff5fb4; --acc3:#ffd23f; --acc4:#7cff6b; --danger:#ff5a5a;
  --e1:#3ee6ff; --e2:#ff5fb4; --e3:#ffd23f; --e4:#7cff6b;
  --cur:var(--e1);
  --font-ui:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --font-px:'Press Start 2P','Courier New',monospace;
  --font-head:var(--font-px);
  --radius:0px; --bw:3px; --shadow:4px 4px 0 #000;
  --fs:16px;
}
html[data-theme="minimal"]{
  --bg:#0f1117; --bg2:#151821; --panel:#1a1e2a; --panel2:#222736;
  --line:#2c3344; --text:#f1f3f8; --muted:#9aa3b8; --dim:#5d667a;
  --font-head:var(--font-ui);
  --radius:12px; --bw:1px; --shadow:0 6px 24px rgba(0,0,0,.35);
}
html[data-mode="present"]{ --fs:21px; }
@media (min-width:1600px){ html[data-mode="present"]{ --fs:24px; } }

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-ui); font-size:var(--fs); line-height:1.55;
  background:var(--bg); color:var(--text);
  background-image:
    linear-gradient(var(--bg2) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg2) 1px, transparent 1px);
  background-size:32px 32px;
}
html[data-theme="minimal"] body{background-image:none}
/* scanlines sutiles sólo en pixel */
html[data-theme="pixel"] body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:9000;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.09) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply;
}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea{font-family:inherit;font-size:1em;color:var(--text)}
a{color:var(--acc)}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.3}
html[data-theme="pixel"] h1{font-size:1.5em;letter-spacing:0}
html[data-theme="pixel"] h2{font-size:1.1em}
html[data-theme="pixel"] h3{font-size:.8em}
html[data-theme="pixel"] h4{font-size:.65em;color:var(--muted)}
html[data-theme="minimal"] h1{font-size:2.2em;font-weight:700;letter-spacing:-.02em}
html[data-theme="minimal"] h2{font-size:1.5em;font-weight:700}
html[data-theme="minimal"] h3{font-size:1.1em;font-weight:600}
html[data-theme="minimal"] h4{font-size:.85em;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
p{margin:.4em 0 .9em}
ul.clean{list-style:none}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:.85em}
.px{font-family:var(--font-px);font-size:.7em;letter-spacing:0}
html[data-theme="minimal"] .px{font-family:var(--font-ui);font-weight:700;font-size:.8em;text-transform:uppercase;letter-spacing:.1em}
.acc{color:var(--cur)}

/* =========================================================
   LAYOUT
   ========================================================= */
#app{display:grid;grid-template-rows:auto auto 1fr auto;min-height:100vh}
header#top{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 16px;background:var(--panel);border-bottom:var(--bw) solid var(--line);
  position:sticky;top:0;z-index:50;
}
#logo{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
#logo canvas{image-rendering:pixelated;width:40px;height:40px}
#logo .t{font-family:var(--font-px);font-size:.75em;line-height:1.4}
html[data-theme="minimal"] #logo .t{font-family:var(--font-ui);font-weight:800;font-size:1em}
#logo .t small{display:block;color:var(--muted);font-size:.7em}
nav#encnav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tab{
  border:var(--bw) solid var(--line);background:var(--bg2);padding:8px 12px;
  font-family:var(--font-px);font-size:.6em;border-radius:var(--radius);
  display:flex;align-items:center;gap:8px;color:var(--muted);
}
html[data-theme="minimal"] .tab{font-family:var(--font-ui);font-weight:600;font-size:.85em}
.tab .dot{width:10px;height:10px;background:var(--c);display:inline-block;border-radius:var(--radius)}
.tab.on{color:var(--text);border-color:var(--c);box-shadow:inset 0 -4px 0 var(--c)}
.tab.locked{opacity:.75}
.tab:hover{color:var(--text)}
#tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{
  border:var(--bw) solid var(--line);background:var(--panel2);padding:8px 12px;
  border-radius:var(--radius);font-weight:600;font-size:.85em;
  display:inline-flex;align-items:center;gap:8px;transition:transform .05s;
}
.btn:hover{border-color:var(--cur)}
.btn:active{transform:translate(2px,2px)}
.btn.primary{background:var(--cur);color:#000;border-color:var(--cur)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:.78em}
.btn.px{font-family:var(--font-px);font-size:.6em}
html[data-theme="pixel"] .btn{box-shadow:3px 3px 0 #000}
html[data-theme="pixel"] .btn:active{box-shadow:1px 1px 0 #000}
.btn[disabled]{opacity:.4;pointer-events:none}
.seg{display:inline-flex;border:var(--bw) solid var(--line);border-radius:var(--radius);overflow:hidden}
.seg button{border:0;background:var(--bg2);padding:7px 11px;font-size:.78em;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--cur);color:#000}

/* barra de progreso del encuentro */
#progress{background:var(--bg2);border-bottom:var(--bw) solid var(--line);padding:8px 16px;display:none}
#progress.show{display:block}
.timeline{display:flex;gap:3px;height:14px;margin-top:6px}
.timeline .seg-b{background:var(--panel2);border:1px solid var(--line);flex:var(--w);cursor:pointer;position:relative}
.timeline .seg-b.done{background:var(--line)}
.timeline .seg-b.cur{background:var(--cur);border-color:var(--cur)}
.timeline .seg-b:hover::after{
  content:attr(data-tip);position:absolute;top:18px;left:0;background:#000;color:#fff;
  padding:4px 8px;font-size:.75em;white-space:nowrap;z-index:5;border:1px solid var(--line)
}
.progress-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.8em;color:var(--muted)}

#body{display:grid;grid-template-columns:280px 1fr;min-height:0}
html[data-mode="present"] #body,#body.home{grid-template-columns:1fr}
#body.home aside#index{display:none}
html[data-mode="present"] aside#index{display:none}
@media (max-width:900px){#body{grid-template-columns:1fr} aside#index{display:none}}
aside#index{
  border-right:var(--bw) solid var(--line);background:var(--panel);padding:16px;
  position:sticky;top:64px;align-self:start;max-height:calc(100vh - 64px);overflow:auto
}
aside#index h4{margin-bottom:10px}
.idx-item{
  display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:var(--radius);cursor:pointer;
  border-left:4px solid transparent;font-size:.85em;color:var(--muted)
}
.idx-item:hover{background:var(--panel2);color:var(--text)}
.idx-item.on{border-left-color:var(--cur);color:var(--text);background:var(--panel2)}
.idx-item .n{font-family:var(--font-px);font-size:.7em;min-width:28px;padding-top:3px;color:var(--cur)}
html[data-theme="minimal"] .idx-item .n{font-family:var(--font-ui);font-weight:700;font-size:.8em}
.idx-item .time{display:block;font-size:.8em;color:var(--dim)}

main#view{padding:24px clamp(16px,4vw,56px) 48px;max-width:1280px;width:100%;margin:0 auto}
html[data-mode="present"] main#view{max-width:1500px}

footer#navbar{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 16px;background:var(--panel);border-top:var(--bw) solid var(--line);
  position:sticky;bottom:0;z-index:40
}
footer#navbar .mid{font-size:.8em;color:var(--muted);text-align:center;flex:1}

/* =========================================================
   COMPONENTES DE CONTENIDO
   ========================================================= */
.block-head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:22px;padding-bottom:16px;border-bottom:var(--bw) solid var(--line)}
.block-head .kicker{font-family:var(--font-px);font-size:.65em;color:var(--cur);margin-bottom:10px}
html[data-theme="minimal"] .block-head .kicker{font-family:var(--font-ui);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.8em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:var(--bw) solid var(--line);padding:4px 10px;font-size:.78em;border-radius:var(--radius);background:var(--bg2);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip b{color:var(--text)}
.chip.acc{border-color:var(--cur);color:var(--cur)}

.panel{background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--radius);padding:20px;margin:16px 0;box-shadow:var(--shadow)}
.panel.tight{padding:14px}
.panel h3{margin-bottom:10px}
.panel-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}

.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid.c4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{background:var(--bg2);border:var(--bw) solid var(--line);border-radius:var(--radius);padding:16px}
.card h3{margin-bottom:6px}
.card .ico{font-size:1.6em;margin-bottom:6px;display:block;font-family:var(--font-px)}
.card.clickable{cursor:pointer;transition:transform .08s}
.card.clickable:hover{border-color:var(--cur);transform:translateY(-2px)}
.card.open{border-color:var(--cur)}
.card .more{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.92em}
.card.open .more{display:block}

/* OBSERVAMOS / CONSTRUIMOS / EXPERIMENTAMOS */
.ocem{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:16px 0}
.ocem .step{border:var(--bw) solid var(--line);background:var(--bg2);padding:14px;border-radius:var(--radius);border-top:6px solid var(--c)}
.ocem .step .lab{font-family:var(--font-px);font-size:.62em;color:var(--c);margin-bottom:8px;display:flex;align-items:center;gap:8px}
html[data-theme="minimal"] .ocem .step .lab{font-family:var(--font-ui);font-weight:800;letter-spacing:.1em;font-size:.75em}
.ocem .step p{font-size:.92em;margin:0}
.ocem .step .who{font-size:.75em;color:var(--dim);margin-top:8px}

.activity{border:var(--bw) dashed var(--cur);padding:16px 18px;border-radius:var(--radius);margin:18px 0;background:rgba(255,255,255,.02)}
.activity .lab{font-family:var(--font-px);font-size:.62em;color:var(--cur);margin-bottom:8px}
html[data-theme="minimal"] .activity .lab{font-family:var(--font-ui);font-weight:800;letter-spacing:.1em;font-size:.75em}
.activity ul{margin:6px 0 0 18px}
.activity li{margin:3px 0}

.deflist{display:grid;gap:10px}
.def{display:grid;grid-template-columns:minmax(120px,180px) 1fr;gap:12px;padding:10px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius)}
.def b{color:var(--cur)}
@media (max-width:600px){.def{grid-template-columns:1fr}}

dfn{font-style:normal;border-bottom:2px dotted var(--cur);cursor:help;color:var(--text)}
dfn:hover{color:var(--cur)}

/* code / prompt */
.prompt-box{background:#070a14;border:var(--bw) solid var(--line);border-radius:var(--radius);margin:12px 0;overflow:hidden}
.prompt-box .ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.prompt-box .ph .t{font-family:var(--font-px);font-size:.62em;color:var(--cur)}
html[data-theme="minimal"] .prompt-box .ph .t{font-family:var(--font-ui);font-weight:700;letter-spacing:.08em;font-size:.78em}
.prompt-box pre{padding:14px 16px;white-space:pre-wrap;font-family:'Courier New',ui-monospace,monospace;font-size:.9em;line-height:1.5;color:#dfe6ff;max-height:420px;overflow:auto}
.prompt-box pre .ph-var{background:rgba(255,210,63,.15);color:var(--acc3);padding:0 4px;border:1px dashed var(--acc3)}
.prompt-box pre .filled{color:var(--acc4)}
.code{font-family:'Courier New',ui-monospace,monospace;background:#070a14;border:1px solid var(--line);padding:12px;font-size:.88em;white-space:pre;overflow:auto;border-radius:var(--radius);line-height:1.5}
.code .bad{background:rgba(255,90,90,.18);color:#ffb3b3}
.code .good{background:rgba(124,255,107,.15);color:#c6ffbf}
.code .cm{color:var(--dim)}
.tree{font-family:'Courier New',ui-monospace,monospace;font-size:.95em;line-height:1.7}
.tree .f{color:var(--acc3)} .tree .d{color:var(--acc)}
.tree span[data-tip]{cursor:help;border-bottom:1px dotted var(--dim)}

/* juegos */
.game-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,300px);gap:16px;align-items:start;margin:14px 0}
@media (max-width:820px){.game-wrap{grid-template-columns:1fr}}
.game-stage{position:relative;background:#000;border:var(--bw) solid var(--line);border-radius:var(--radius);overflow:hidden}
.game-stage canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;outline:none}
.game-stage canvas:focus{box-shadow:inset 0 0 0 3px var(--cur)}
.game-stage .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(5,8,20,.72);text-align:center;padding:20px;cursor:pointer}
.game-stage .overlay .px{font-size:.9em}
.game-stage .overlay.hidden{display:none}
.game-side .hud{font-family:var(--font-px);font-size:.62em;line-height:2;color:var(--muted)}
html[data-theme="minimal"] .game-side .hud{font-family:var(--font-ui);font-size:.9em;font-weight:600}
.game-side .hud b{color:var(--cur)}
.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:4px;margin-top:12px;user-select:none;touch-action:none}
.dpad button{border:var(--bw) solid var(--line);background:var(--panel2);font-size:1.1em;border-radius:var(--radius)}
.dpad button:active,.dpad button.down{background:var(--cur);color:#000}
.dpad .act{grid-column:1/4;height:40px}
.dpad.hide-act .act{display:none}
.keys{font-size:.78em;color:var(--muted);margin-top:8px}
kbd{font-family:'Courier New',monospace;background:var(--panel2);border:1px solid var(--line);border-bottom-width:3px;padding:1px 6px;border-radius:4px;font-size:.9em}

/* core loop */
.loop{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:16px 0}
.loop .node{border:var(--bw) solid var(--line);background:var(--bg2);padding:14px 16px;border-radius:var(--radius);cursor:pointer;font-family:var(--font-px);font-size:.62em;text-align:center;min-width:120px;transition:transform .08s}
html[data-theme="minimal"] .loop .node{font-family:var(--font-ui);font-weight:700;font-size:.9em}
.loop .node:hover{transform:translateY(-3px);border-color:var(--cur)}
.loop .node.on{background:var(--cur);color:#000;border-color:var(--cur)}
.loop .arrow{color:var(--dim);font-size:1.4em}
.loop .back{width:100%;text-align:center;color:var(--dim);font-size:.8em}
.loop-detail{min-height:90px}

/* GDD */
.gdd-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.field label{display:block;font-size:.8em;color:var(--muted);margin-bottom:4px;font-weight:600}
.field label span{color:var(--cur);font-family:var(--font-px);font-size:.75em;margin-right:6px}
html[data-theme="minimal"] .field label span{font-family:var(--font-ui);font-weight:800}
.field input,.field textarea{width:100%;background:var(--bg2);border:var(--bw) solid var(--line);padding:10px 12px;border-radius:var(--radius);resize:vertical;min-height:44px}
.field textarea{min-height:72px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--cur)}
.field .hint{font-size:.75em;color:var(--dim);margin-top:3px}

/* checklist */
.check{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--bg2);border:var(--bw) solid var(--line);border-radius:var(--radius);cursor:pointer;margin:8px 0;user-select:none}
.check:hover{border-color:var(--cur)}
.check .box{width:26px;height:26px;border:var(--bw) solid var(--line);background:var(--panel);display:grid;place-items:center;font-weight:900;flex:none;border-radius:var(--radius)}
.check.done .box{background:var(--cur);color:#000;border-color:var(--cur)}
.check.done span.t{color:var(--muted);text-decoration:line-through}
.bar{height:18px;background:var(--bg2);border:var(--bw) solid var(--line);border-radius:var(--radius);overflow:hidden;position:relative}
.bar > i{display:block;height:100%;background:var(--cur);transition:width .3s}
.bar.striped > i{background-image:repeating-linear-gradient(90deg,transparent 0 8px,rgba(0,0,0,.18) 8px 12px)}

/* timer */
.timer{text-align:center;padding:28px 10px}
.timer .digits{font-family:var(--font-px);font-size:clamp(2.2em,8vw,5em);color:var(--cur);letter-spacing:2px;margin:10px 0 18px}
html[data-theme="minimal"] .timer .digits{font-family:var(--font-ui);font-weight:800;font-variant-numeric:tabular-nums}
.timer .digits.alarm{color:var(--danger);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}

/* home */
.hero{padding:40px 0 20px;text-align:center}
.hero h1{margin:14px 0 10px}
.hero p.lead{max-width:760px;margin:0 auto 20px;color:var(--muted);font-size:1.05em}
.hero canvas{image-rendering:pixelated;width:min(100%,640px);height:auto;border:var(--bw) solid var(--line);border-radius:var(--radius);display:block;margin:0 auto;background:#000}
.enc-card{border:var(--bw) solid var(--line);border-top:8px solid var(--c);background:var(--panel);padding:18px;border-radius:var(--radius);cursor:pointer;transition:transform .08s;position:relative;box-shadow:var(--shadow)}
.enc-card:hover{transform:translateY(-3px);border-color:var(--c)}
.enc-card .num{font-family:var(--font-px);color:var(--c);font-size:.7em;margin-bottom:8px}
html[data-theme="minimal"] .enc-card .num{font-family:var(--font-ui);font-weight:800;letter-spacing:.1em}
.enc-card h3{margin-bottom:8px}
.enc-card .status{display:inline-block;margin-bottom:10px;font-size:.7em;padding:3px 8px;border:1px solid var(--line);color:var(--muted);border-radius:var(--radius)}
.enc-card .status.ok{border-color:var(--c);color:var(--c)}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0}

/* programa (encuentros futuros) */
.program{counter-reset:p}
.program .row{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.program .row:last-child{border-bottom:0}
.program .row .n{font-family:var(--font-px);color:var(--cur);font-size:.8em}
html[data-theme="minimal"] .program .row .n{font-family:var(--font-ui);font-weight:800}
.program .row .t{font-size:.8em;color:var(--muted);white-space:nowrap}
.soon{border:var(--bw) dashed var(--line);padding:14px 16px;color:var(--muted);font-size:.9em;border-radius:var(--radius);display:flex;gap:10px;align-items:center}

/* overlays */
.ovl{position:fixed;inset:0;background:rgba(3,5,14,.82);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.ovl.show{display:flex}
.modal{background:var(--panel);border:var(--bw) solid var(--cur);border-radius:var(--radius);width:min(960px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal.sm{width:min(520px,100%)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:var(--bw) solid var(--line)}
.modal .mb{padding:18px;overflow:auto}
.modal .mf{padding:12px 18px;border-top:var(--bw) solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{border:var(--bw) solid var(--line);background:var(--bg2);width:38px;height:38px;font-weight:900;border-radius:var(--radius)}
.x:hover{border-color:var(--danger);color:var(--danger)}

/* glosario */
.glo-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;position:sticky;top:0;background:var(--panel);padding-bottom:8px;z-index:2}
.glo-tools input{flex:1;min-width:200px;background:var(--bg2);border:var(--bw) solid var(--line);padding:10px 12px;border-radius:var(--radius)}
.glo-tools input:focus{outline:none;border-color:var(--cur)}
.glo-cat{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.glo-cat button{border:var(--bw) solid var(--line);background:var(--bg2);padding:5px 10px;font-size:.78em;border-radius:var(--radius);color:var(--muted)}
.glo-cat button.on{background:var(--cur);color:#000;border-color:var(--cur)}
.term{background:var(--bg2);border:var(--bw) solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.term.hl{border-color:var(--cur);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.term .en{font-family:var(--font-px);font-size:.75em;color:var(--cur)}
html[data-theme="minimal"] .term .en{font-family:var(--font-ui);font-weight:800;font-size:1em}
.term .cat{font-size:.7em;color:var(--dim);float:right}
.term .es{margin:8px 0 6px}
.term .ej{font-size:.88em;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.term .ej b{color:var(--text)}
.term .ill{margin-top:10px}
.term .ill canvas{image-rendering:pixelated;width:160px;height:auto;border:1px solid var(--line);background:#000}

/* toast */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--cur);color:#000;padding:10px 18px;font-weight:700;border-radius:var(--radius);opacity:0;pointer-events:none;transition:all .2s;z-index:2000;border:var(--bw) solid #000;font-size:.9em}
#toast.show{opacity:1;transform:translateX(-50%)}

/* varios */
.callout{border-left:6px solid var(--cur);background:var(--bg2);padding:12px 16px;margin:14px 0;border-radius:var(--radius)}
.callout b{color:var(--cur)}
.pill-list{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:var(--bw) solid var(--line);padding:6px 12px;border-radius:var(--radius);background:var(--bg2);font-size:.88em;cursor:pointer}
.pill.on{background:var(--cur);color:#000;border-color:var(--cur)}
.steps{counter-reset:s;list-style:none}
.steps li{position:relative;padding:10px 12px 10px 54px;margin:8px 0;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius)}
.steps li::before{counter-increment:s;content:counter(s,decimal-leading-zero);position:absolute;left:12px;top:10px;font-family:var(--font-px);color:var(--cur);font-size:.8em}
html[data-theme="minimal"] .steps li::before{font-family:var(--font-ui);font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.persp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.persp .card canvas{width:100%;height:auto;image-rendering:pixelated;background:#000;border:1px solid var(--line);margin-bottom:8px}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tag-time{font-family:var(--font-px);font-size:.6em;color:var(--muted)}
html[data-theme="minimal"] .tag-time{font-family:var(--font-ui);font-weight:600;font-size:.8em}
.hidden{display:none!important}
.sr{position:absolute;left:-9999px}
</style>

<script>
/* =========================================================
   CORE — estado, utilidades, sprites, modales
   ========================================================= */
'use strict';

const LS_KEY = 'gamedev-ia-curso-v1';
const STATE = Object.assign({
  theme: 'pixel', mode: 'student',
  route: { view: 'home', e: 1, b: 0 },
  gdd: {}, check: {}, visited: {}, loopSeen: {}, timerMin: 10
}, loadState());

function loadState() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch (e) { return {}; }
}
function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(STATE)); } catch (e) { /* almacenamiento no disponible */ }
}

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function pad(n) { return String(n).padStart(2, '0'); }

/* ---------- toast / modal (sin diálogos nativos) ---------- */
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800);
}
function openOvl(id) { $('#' + id).classList.add('show'); }
function closeOvl(id) { $('#' + id).classList.remove('show'); }
function modal(title, html, buttons) {
  $('#mTitle').textContent = title;
  $('#mBody').innerHTML = html;
  const f = $('#mFoot'); f.innerHTML = '';
  (buttons || [{ label: 'Cerrar' }]).forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.primary ? ' primary' : '');
    el.textContent = b.label;
    el.onclick = () => { if (b.onClick) b.onClick(); closeOvl('ovlModal'); };
    f.appendChild(el);
  });
  openOvl('ovlModal');
}
document.addEventListener('click', e => {
  const c = e.target.closest('[data-close]');
  if (c) closeOvl(c.dataset.close);
  if (e.target.classList.contains('ovl')) e.target.classList.remove('show');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $$('.ovl.show').forEach(o => o.classList.remove('show'));
});

/* ---------- portapapeles / descarga ---------- */
function copyText(text, msg) {
  const done = () => toast(msg || '¡Copiado al portapapeles!');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('No se pudo copiar'); }
  document.body.removeChild(ta);
}
function downloadText(filename, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('Descargando ' + filename);
}

/* =========================================================
   SPRITES PIXEL ART (dibujados por código, sin imágenes)
   Cada sprite: filas de caracteres → paleta
   ========================================================= */
const PAL = {
  '.': null, 'k': '#0b0f1e', 'w': '#ffffff', 'r': '#ff5a5a', 'R': '#b3263a', 'o': '#ff9f43',
  'y': '#ffd23f', 'Y': '#c99a00', 'g': '#7cff6b', 'G': '#2f9e44', 'c': '#3ee6ff', 'C': '#1c7ea1',
  'b': '#4466ff', 'B': '#1f2f8a', 'p': '#ff5fb4', 'P': '#a3306f', 's': '#f1c27d', 'S': '#c48a4f',
  'n': '#8d6e63', 'N': '#4e342e', 'l': '#9aa3b8', 'L': '#4a5368', 'e': '#2a2f45'
};
const SPR = {
  player: [
    '...cccc.....',
    '..cccccc....',
    '..csssss....',
    '..skskss....',
    '..ssssss....',
    '...ssss.....',

  ],
  enemy: [

  ],

  ],

  ],

  ],

  ],
  heart: [

  ],

  ],
  brick: [

  ],
  floor: [
    'eeeeeeee', 'eLeeeeee', 'eeeeeeee', 'eeeeeLee',
    'eeeeeeee', 'eeLeeeee', 'eeeeeeee', 'eeeeeeLe'
  ]
};
const spriteCache = {};
function sprite(name, scale) {
  scale = scale || 1;
  const key = name + '@' + scale;
  if (spriteCache[key]) return spriteCache[key];
  const rows = SPR[name]; const w = rows[0].length, h = rows.length;
  const cv = document.createElement('canvas'); cv.width = w * scale; cv.height = h * scale;
  const g = cv.getContext('2d');
  rows.forEach((row, y) => { for (let x = 0; x < row.length; x++) { const c = PAL[row[x]]; if (c) { g.fillStyle = c; g.fillRect(x * scale, y * scale, scale, scale); } } });
  spriteCache[key] = cv; return cv;
}

/* logo del header */
(function drawLogo() {
  const cv = $('#logoCv'); const g = cv.getContext('2d');
  const rows = ['....cccccccc....', '..cc........cc..', '.c....yyyy....c.', '.c...yyyyyy...c.', 'c...yy.yy.yy...c', 'c...yyyyyyyy...c', 'c...yy....yy...c', 'c....yyyyyy....c', '.c....yyyy....c.', '.c............c.', '..cc.gg..gg.cc..', '....cccccccc....', '......c..c......', '.....cc..cc.....', '....c......c....', '................'];
  rows.forEach((r, y) => { for (let x = 0; x < 16; x++) { const c = PAL[r[x]]; if (c) { g.fillStyle = c; g.fillRect(x, y, 1, 1); } } });
})();

/* =========================================================
   MOTOR MINI — base común para los minijuegos (Canvas 2D)
   - teclado sólo cuando el canvas tiene foco (no interfiere con la página)
   - d-pad táctil opcional
   - rAF controlado; destroy() al navegar
   ========================================================= */
const ACTIVE_GAMES = new Set();
function destroyGames() { ACTIVE_GAMES.forEach(g => g.destroy()); ACTIVE_GAMES.clear(); }

class MiniGame {
  constructor(host, opts) {
    this.opts = Object.assign({ w: 320, h: 180, title: 'Jugar', hint: 'Hacé clic en el juego y usá las flechas', dpadAction: true }, opts);
    this.host = host;
    this.keys = {};
    this.running = false; this.focused = false; this.started = false;
    this.build();
    ACTIVE_GAMES.add(this);
  }
  build() {
    const o = this.opts;
    this.host.innerHTML = `
      <div class="game-wrap">
        <div class="game-stage">
          <canvas tabindex="0" width="${o.w}" height="${o.h}" aria-label="${esc(o.title)}"></canvas>
          <div class="overlay"><div class="px">▶ ${esc(o.title)}</div><div class="small muted">${esc(o.hint)}</div></div>
        </div>
        <div class="game-side">
          <div class="hud"></div>
          <div class="dpad ${o.dpadAction ? '' : 'hide-act'}">
            <span></span><button data-k="ArrowUp">▲</button><span></span>
            <button data-k="ArrowLeft">◀</button><span></span><button data-k="ArrowRight">▶</button>
            <span></span><button data-k="ArrowDown">▼</button><span></span>
            <button class="act" data-k=" ">ACCIÓN / SALTO</button>
          </div>
          <div class="keys">Teclado: <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd>${o.dpadAction ? ' <kbd>Espacio</kbd>' : ''} · <kbd>R</kbd> reiniciar</div>
          <button class="btn sm" data-reset>↺ Reiniciar</button>
        </div>
      </div>`;
    this.cv = $('canvas', this.host); this.g = this.cv.getContext('2d');
    this.g.imageSmoothingEnabled = false;
    this.hud = $('.hud', this.host);
    this.ovl = $('.overlay', this.host);
    this.ovl.onclick = () => { this.cv.focus(); };
    this.cv.addEventListener('focus', () => { this.focused = true; this.ovl.classList.add('hidden'); this.start(); });
    this.cv.addEventListener('blur', () => { this.focused = false; this.keys = {}; this.ovl.classList.remove('hidden'); this.ovl.innerHTML = `<div class="px">⏸ Pausa</div><div class="small muted">Clic para seguir</div>`; });
    this._kd = e => { if (!this.focused) return; if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault(); this.keys[e.key] = true; if (e.key === 'r' || e.key === 'R') this.reset(); this.onKey && this.onKey(e.key); };
    this._ku = e => { this.keys[e.key] = false; };
    window.addEventListener('keydown', this._kd); window.addEventListener('keyup', this._ku);
    $$('.dpad button', this.host).forEach(b => {
      const k = b.dataset.k;
      const down = ev => { ev.preventDefault(); this.cv.focus(); this.keys[k] = true; b.classList.add('down'); this.onKey && this.onKey(k); };
      const up = ev => { ev.preventDefault(); this.keys[k] = false; b.classList.remove('down'); };
      b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
    });
    $('[data-reset]', this.host).onclick = () => { this.reset(); this.cv.focus(); };
    this.cv.addEventListener('pointerdown', e => { this.cv.focus(); this.onPointer && this.onPointer(e); });
    this.reset();
    this.draw();
  }
  canvasPos(e) {
    const r = this.cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * this.cv.width / r.width, y: (e.clientY - r.top) * this.cv.height / r.height };
  }
  start() { if (this.running) return; this.running = true; this.last = performance.now(); const loop = t => { if (!this.running) return; const dt = Math.min(0.05, (t - this.last) / 1000); this.last = t; if (this.focused) this.update(dt); this.draw(); this._raf = requestAnimationFrame(loop); }; this._raf = requestAnimationFrame(loop); }
  stop() { this.running = false; cancelAnimationFrame(this._raf); }
  destroy() { this.stop(); window.removeEventListener('keydown', this._kd); window.removeEventListener('keyup', this._ku); }
  setHud(html) { this.hud.innerHTML = html; }
  win(msg) { this.won = true; this.ovl.classList.remove('hidden'); this.ovl.innerHTML = `<div class="px" style="color:var(--acc4)">★ ${esc(msg || '¡GANASTE!')}</div><div class="small muted">R o clic para jugar de nuevo</div>`; this.ovl.onclick = () => { this.reset(); this.cv.focus(); this.ovl.onclick = () => this.cv.focus(); }; }
  lose(msg) { this.won = true; this.ovl.classList.remove('hidden'); this.ovl.innerHTML = `<div class="px" style="color:var(--danger)">✖ ${esc(msg || 'GAME OVER')}</div><div class="small muted">R o clic para reintentar</div>`; this.ovl.onclick = () => { this.reset(); this.cv.focus(); this.ovl.onclick = () => this.cv.focus(); }; }
  /* a implementar */
  reset() { } update() { } draw() { }
  /* helpers de dibujo */
  bg(color) { this.g.fillStyle = color; this.g.fillRect(0, 0, this.cv.width, this.cv.height); }
  rect(x, y, w, h, c) { this.g.fillStyle = c; this.g.fillRect(Math.round(x), Math.round(y), w, h); }
  spr(name, x, y, scale) { this.g.drawImage(sprite(name, scale || 1), Math.round(x), Math.round(y)); }
  text(s, x, y, c, size) { this.g.fillStyle = c || '#fff'; this.g.font = (size || 8) + 'px "Press Start 2P", monospace'; this.g.fillText(s, x, y); }
  hit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
}

/* registro de componentes montables: <div data-mount="nombre"> */
const MOUNTS = {};
function mountAll(root) { $$('[data-mount]', root).forEach(el => { const fn = MOUNTS[el.dataset.mount]; if (fn) fn(el); }); }
/* =========================================================
   MINIJUEGOS
   ========================================================= */

/* ---------- 1. Juego demo (Bloque 01): formas vs sprites ---------- */
class DemoGame extends MiniGame {
  constructor(host, styled) { super(host, { w: 320, h: 180, title: styled ? 'Demo con sprites' : 'Demo con formas', hint: 'Clic en el juego · flechas para moverte · juntá las 5 monedas · evitá al enemigo' , dpadAction: false }); this.styled = styled; }
  reset() {
    this.won = false; this.t = 0;
    this.p = { x: 20, y: 80, w: 12, h: 12, sp: 90 };
    this.coins = [[70, 30], [150, 140], [220, 40], [280, 120], [160, 80]].map(([x, y]) => ({ x, y, w: 8, h: 8, got: false }));
    this.en = [{ x: 100, y: 100, w: 10, h: 8, vx: 60 }, { x: 240, y: 60, w: 10, h: 8, vx: -45 }];
    this.score = 0;
    this.ovl && (this.ovl.innerHTML = `<div class="px">▶ ${esc(this.opts.title)}</div><div class="small muted">${esc(this.opts.hint)}</div>`);
    this.hudUpdate();
  }
  hudUpdate() { this.setHud(`MONEDAS <b>${this.score}/5</b><br>OBJETIVO: juntar todas<br>OBSTÁCULO: enemigos<br>${this.styled ? 'GRÁFICOS: sprites' : 'GRÁFICOS: formas'}`); }
  update(dt) {
    if (this.won) return; this.t += dt;
    const k = this.keys, p = this.p, s = p.sp * dt;
    if (k.ArrowLeft) p.x -= s; if (k.ArrowRight) p.x += s; if (k.ArrowUp) p.y -= s; if (k.ArrowDown) p.y += s;
    p.x = Math.max(0, Math.min(this.cv.width - p.w, p.x)); p.y = Math.max(0, Math.min(this.cv.height - p.h, p.y));
    this.en.forEach(e => { e.x += e.vx * dt; if (e.x < 0 || e.x + e.w > this.cv.width) e.vx *= -1; if (this.hit(p, e)) this.lose('¡Te atrapó el enemigo!'); });
    this.coins.forEach(c => { if (!c.got && this.hit(p, c)) { c.got = true; this.score++; this.hudUpdate(); } });
    if (this.score === 5) this.win('¡Objetivo cumplido!');
  }
  draw() {
    const g = this.g, W = this.cv.width, H = this.cv.height;
    if (this.styled) {
      this.bg('#0b0f1e');
      for (let x = 0; x < W; x += 16) for (let y = 0; y < H; y += 16) this.spr('floor', x, y, 2);
      this.coins.forEach(c => { if (!c.got) this.spr('coin', c.x, c.y + Math.sin(this.t * 4 + c.x) * 1.5, 1); });
      this.en.forEach(e => this.spr('enemy', e.x, e.y, 1));
      this.spr('player', this.p.x, this.p.y, 1);
    } else {
      this.bg('#15181f');
      this.coins.forEach(c => { if (!c.got) this.rect(c.x, c.y, c.w, c.h, '#ffd23f'); });
      this.en.forEach(e => this.rect(e.x, e.y, e.w, e.h, '#ff5a5a'));
      this.rect(this.p.x, this.p.y, this.p.w, this.p.h, '#3ee6ff');
      this.text('JUGADOR=cuadrado', 4, H - 6, '#5f6d99', 6);
    }
    this.text(`x${this.score}`, W - 40, 12, '#ffd23f', 8);
  }
}

/* ---------- 2. Plataformas 2D ---------- */
class PlatformerGame extends MiniGame {
  constructor(host) { super(host, { w: 320, h: 180, title: 'Plataformas 2D', hint: 'Clic · ← → mover · Espacio o ↑ saltar · llegá a la bandera' }); }
  reset() {
    this.won = false;
    this.p = { x: 16, y: 120, w: 10, h: 14, vx: 0, vy: 0, ground: false };
    this.plats = [{ x: 0, y: 164, w: 120, h: 16 }, { x: 150, y: 164, w: 170, h: 16 }, { x: 60, y: 124, w: 48, h: 8 }, { x: 140, y: 100, w: 48, h: 8 }, { x: 220, y: 76, w: 56, h: 8 }, { x: 290, y: 120, w: 30, h: 8 }];
    this.spikes = [{ x: 128, y: 172, w: 16, h: 8 }, { x: 190, y: 156, w: 8, h: 8 }];
    this.coins = [{ x: 78, y: 106 }, { x: 160, y: 84 }, { x: 244, y: 60 }].map(c => Object.assign(c, { w: 8, h: 8, got: false }));
    this.flag = { x: 300, y: 104, w: 8, h: 16 }; this.score = 0; this.deaths = 0; this.t = 0;
    this.P = this.P || { speed: 80, jump: 190, grav: 420 }; this.showHit = this.showHit || false;
    this.hudUpdate();
  }
  hudUpdate() { this.setHud(`MONEDAS <b>${this.score}/3</b><br>CAÍDAS <b>${this.deaths}</b><br>PERSPECTIVA: lateral<br>FÍSICA: gravedad + salto`); }
  update(dt) {
    if (this.won) return; this.t += dt;
    const k = this.keys, p = this.p;
    p.vx = (k.ArrowRight ? 1 : 0) - (k.ArrowLeft ? 1 : 0); p.vx *= this.P.speed;
    if ((k[' '] || k.ArrowUp) && p.ground) { p.vy = -this.P.jump; p.ground = false; }
    p.vy += this.P.grav * dt; if (p.vy > 240) p.vy = 240;
    p.x += p.vx * dt; p.x = Math.max(0, Math.min(this.cv.width - p.w, p.x));
    p.y += p.vy * dt; p.ground = false;
    this.plats.forEach(s => { if (this.hit(p, s)) { if (p.vy > 0 && p.y + p.h - p.vy * dt <= s.y + 1) { p.y = s.y - p.h; p.vy = 0; p.ground = true; } else if (p.vy < 0 && p.y - p.vy * dt >= s.y + s.h - 1) { p.y = s.y + s.h; p.vy = 0; } } });
    if (p.y > this.cv.height || this.spikes.some(s => this.hit(p, s))) { this.deaths++; p.x = 16; p.y = 120; p.vy = 0; this.hudUpdate(); }
    this.coins.forEach(c => { if (!c.got && this.hit(p, c)) { c.got = true; this.score++; this.hudUpdate(); } });
    if (this.hit(p, this.flag)) this.win('¡Nivel completado!');
  }
  draw() {
    const W = this.cv.width, H = this.cv.height; this.bg('#0e1630');
    for (let i = 0; i < 24; i++) this.rect((i * 53) % W, (i * 37) % 120, 1, 1, '#2b3a6b');
    this.plats.forEach(s => { for (let x = s.x; x < s.x + s.w; x += 8) { this.spr(s.h > 8 ? 'grass' : 'brick', x, s.y, 1); } });
    this.spikes.forEach(s => { for (let x = s.x; x < s.x + s.w; x += 8) this.spr('spike', x, s.y, 1); });
    this.coins.forEach(c => { if (!c.got) this.spr('coin', c.x, c.y + Math.sin(this.t * 4 + c.x) * 1.5, 1); });
    this.spr('flag', this.flag.x, this.flag.y, 1);
    this.g.drawImage(sprite('player', 1), 0, 0, 12, 12, Math.round(this.p.x - 1), Math.round(this.p.y), 12, 14);
    if (this.showHit) { const g = this.g; g.lineWidth = 1; g.strokeStyle = '#7cff6b'; g.strokeRect(this.p.x + .5, this.p.y + .5, this.p.w, this.p.h); g.strokeStyle = '#ff5a5a'; this.spikes.forEach(s => g.strokeRect(s.x + .5, s.y + .5, s.w, s.h)); g.strokeStyle = '#ffd23f'; this.coins.forEach(c => { if (!c.got) g.strokeRect(c.x + .5, c.y + .5, c.w, c.h); }); g.strokeStyle = '#3ee6ff'; this.plats.forEach(s => g.strokeRect(s.x + .5, s.y + .5, s.w, s.h)); g.strokeRect(this.flag.x + .5, this.flag.y + .5, this.flag.w, this.flag.h); }
    this.text(`x${this.score}`, W - 36, 12, '#ffd23f', 8);
  }
}

/* ---------- 3. Top-down 2D ---------- */
class TopDownGame extends MiniGame {
  constructor(host) { super(host, { w: 320, h: 180, title: 'Top-down 2D', hint: 'Clic · flechas en 4 direcciones · buscá la llave y abrí la puerta', dpadAction: false }); }
  reset() {
    this.won = false; this.t = 0;
    this.map = [
      '####################',
      '#..........#.......#',
      '#..##..###.#..###..#',
      '#..#.....#....#....#',
      '#..#.###.#.##.#.##.#',
      '#....#.......#...#.#',
      '####.#.####..#.#.#.#',
      '#......#..#....#...#',
      '#.####.#..######.###',
      '#......#.........D.#',
      '####################'
    ];
    this.T = 16; this.p = { x: 24, y: 24, w: 10, h: 10 };
    this.key = { x: 230, y: 56, w: 8, h: 8, got: false };
    this.door = { x: 17 * 16, y: 9 * 16, w: 16, h: 16 };
    this.coins = [{ x: 40, y: 120 }, { x: 180, y: 40 }, { x: 120, y: 130 }].map(c => Object.assign(c, { w: 8, h: 8, got: false }));
    this.score = 0; this.hudUpdate();
  }
  hudUpdate() { this.setHud(`LLAVE <b>${this.key.got ? 'SÍ' : 'NO'}</b><br>MONEDAS <b>${this.score}/3</b><br>PERSPECTIVA: cenital<br>SIN GRAVEDAD`); }
  solid(x, y) { const c = this.map[Math.floor(y / this.T)]; return !c || c[Math.floor(x / this.T)] === '#'; }
  free(r) { return !(this.solid(r.x, r.y) || this.solid(r.x + r.w - 1, r.y) || this.solid(r.x, r.y + r.h - 1) || this.solid(r.x + r.w - 1, r.y + r.h - 1)); }
  update(dt) {
    if (this.won) return; this.t += dt;
    const k = this.keys, p = this.p, s = 85 * dt;
    const nx = { x: p.x + ((k.ArrowRight ? 1 : 0) - (k.ArrowLeft ? 1 : 0)) * s, y: p.y, w: p.w, h: p.h }; if (this.free(nx)) p.x = nx.x;
    const ny = { x: p.x, y: p.y + ((k.ArrowDown ? 1 : 0) - (k.ArrowUp ? 1 : 0)) * s, w: p.w, h: p.h }; if (this.free(ny)) p.y = ny.y;
    if (!this.key.got && this.hit(p, this.key)) { this.key.got = true; this.hudUpdate(); }
    this.coins.forEach(c => { if (!c.got && this.hit(p, c)) { c.got = true; this.score++; this.hudUpdate(); } });
    if (this.hit(p, this.door)) { if (this.key.got) this.win('¡Puerta abierta!'); else { p.x -= 6; } }
  }
  draw() {
    this.bg('#0b0f1e');
    this.map.forEach((row, j) => { for (let i = 0; i < row.length; i++) { const x = i * this.T, y = j * this.T; if (row[i] === '#') this.spr('brick', x, y, 2); else this.spr('floor', x, y, 2); } });
    this.spr(this.key.got ? 'floor' : 'door', this.door.x, this.door.y, 2);
    if (this.key.got) this.rect(this.door.x + 4, this.door.y, 8, 16, '#7cff6b');
    if (!this.key.got) this.spr('key', this.key.x, this.key.y + Math.sin(this.t * 4) * 1.5, 1);
    this.coins.forEach(c => { if (!c.got) this.spr('coin', c.x, c.y, 1); });
    this.g.drawImage(sprite('player', 1), 0, 0, 12, 12, Math.round(this.p.x - 1), Math.round(this.p.y - 2), 12, 12);
    if (!this.key.got) this.text('necesitás la llave', 160, 176, '#5f6d99', 6);
  }
}

/* ---------- 4. Puzzle: Lights Out 3x3 ---------- */
class PuzzleGame extends MiniGame {
  constructor(host) { super(host, { w: 320, h: 180, title: 'Puzzle 2D', hint: 'Clic en una casilla (o flechas + Espacio). Cada casilla invierte a sus vecinas. Encendé todo.' }); }
  reset() {
    this.won = false; this.moves = 0; this.cur = { x: 1, y: 1 };
    this.grid = [[1, 1, 1], [1, 1, 1], [1, 1, 1]];
    for (let i = 0; i < 7; i++) this.toggle(Math.floor(Math.random() * 3), Math.floor(Math.random() * 3), true);
    if (this.solved()) this.toggle(1, 1, true);
    this.hudUpdate();
  }
  hudUpdate() { this.setHud(`MOVIMIENTOS <b>${this.moves}</b><br>REGLA: una casilla<br>cambia sus vecinas<br>OBJETIVO: todo encendido`); }
  toggle(x, y, silent) { [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => { const i = x + dx, j = y + dy; if (i >= 0 && i < 3 && j >= 0 && j < 3) this.grid[j][i] ^= 1; }); if (!silent) { this.moves++; this.hudUpdate(); if (this.solved()) this.win(`¡Resuelto en ${this.moves} movimientos!`); } }
  solved() { return this.grid.every(r => r.every(v => v === 1)); }
  onKey(k) { if (this.won) return; if (k === 'ArrowLeft') this.cur.x = Math.max(0, this.cur.x - 1); if (k === 'ArrowRight') this.cur.x = Math.min(2, this.cur.x + 1); if (k === 'ArrowUp') this.cur.y = Math.max(0, this.cur.y - 1); if (k === 'ArrowDown') this.cur.y = Math.min(2, this.cur.y + 1); if (k === ' ') this.toggle(this.cur.x, this.cur.y); }
  onPointer(e) { if (this.won) return; const p = this.canvasPos(e); const s = 44, ox = 160 - 66, oy = 90 - 66; const x = Math.floor((p.x - ox) / s), y = Math.floor((p.y - oy) / s); if (x >= 0 && x < 3 && y >= 0 && y < 3) { this.cur = { x, y }; this.toggle(x, y); } }
  update() { }
  draw() {
    this.bg('#121a33'); const s = 44, ox = 160 - 66, oy = 90 - 66;
    for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) {
      const on = this.grid[y][x]; this.rect(ox + x * s + 2, oy + y * s + 2, s - 4, s - 4, on ? '#ffd23f' : '#1d2850');
      if (on) this.rect(ox + x * s + 8, oy + y * s + 8, 10, 10, '#fff2a8');
      if (this.cur.x === x && this.cur.y === y) { this.g.strokeStyle = '#3ee6ff'; this.g.lineWidth = 3; this.g.strokeRect(ox + x * s + 3, oy + y * s + 3, s - 6, s - 6); }
    }
    this.text('ENCENDÉ TODAS', 8, 14, '#98a6cf', 7); this.text(`mov: ${this.moves}`, 250, 14, '#98a6cf', 7);
  }
}

/* ---------- 5. Juego con bug intencional (Bloque 08) ---------- */
class BugGame extends MiniGame {
  constructor(host) { super(host, { w: 320, h: 180, title: 'Juego con un bug', hint: 'Clic · flechas · juntá monedas y mirá el puntaje…', dpadAction: false }); this.fixed = false; }
  reset() {
    this.won = false; this.t = 0; this.p = { x: 20, y: 80, w: 12, h: 12 }; this.score = 0;
    this.coins = [[70, 30], [150, 140], [220, 40], [280, 120], [160, 80], [40, 150]].map(([x, y]) => ({ x, y, w: 8, h: 8, got: false }));
    this.hudUpdate();
  }
  hudUpdate() { this.setHud(`PUNTAJE <b>${this.score}</b><br>MONEDAS JUNTADAS <b>${this.coins ? this.coins.filter(c => c.got).length : 0}</b><br>ESTADO: ${this.fixed ? '<b style="color:var(--acc4)">CORREGIDO</b>' : '<b style="color:var(--danger)">CON BUG</b>'}`); }
  update(dt) {
    if (this.won) return; this.t += dt; const k = this.keys, p = this.p, s = 90 * dt;
    if (k.ArrowLeft) p.x -= s; if (k.ArrowRight) p.x += s; if (k.ArrowUp) p.y -= s; if (k.ArrowDown) p.y += s;
    p.x = Math.max(0, Math.min(this.cv.width - p.w, p.x)); p.y = Math.max(0, Math.min(this.cv.height - p.h, p.y));
    this.coins.forEach(c => {
      if (!c.got && this.hit(p, c)) {
        c.got = true;
        if (this.fixed) { this.score += 10; } else { this.score = 10; } /* ← EL BUG: "=" en vez de "+=" */
        this.hudUpdate();
      }
    });
    if (this.coins.every(c => c.got)) this.win(this.fixed ? `Puntaje final: ${this.score} ✔` : `Puntaje final: ${this.score}… ¿seguro?`);
  }
  draw() {
    this.bg('#0b0f1e'); for (let x = 0; x < 320; x += 16) for (let y = 0; y < 180; y += 16) this.spr('floor', x, y, 2);
    this.coins.forEach(c => { if (!c.got) this.spr('coin', c.x, c.y + Math.sin(this.t * 4 + c.x) * 1.5, 1); });

    this.text(`SCORE ${this.score}`, 8, 14, this.fixed ? '#7cff6b' : '#ffd23f', 8);

/* ---------- Ilustraciones estáticas de perspectivas (Bloque 03) ---------- */
function drawPerspective(cv, kind) {
  const g = cv.getContext('2d'); const W = cv.width, H = cv.height; g.imageSmoothingEnabled = false;
  g.fillStyle = '#0b0f1e'; g.fillRect(0, 0, W, H);
  const px = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
  if (kind === 'iso') {
    const iso = (i, j, c1, c2, c3, h) => { const x = W / 2 + (i - j) * 14, y = 24 + (i + j) * 7 - (h || 0); g.fillStyle = c1; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 14, y + 7); g.lineTo(x, y + 14); g.lineTo(x - 14, y + 7); g.fill(); if (h) { g.fillStyle = c2; g.beginPath(); g.moveTo(x - 14, y + 7); g.lineTo(x, y + 14); g.lineTo(x, y + 14 + h); g.lineTo(x - 14, y + 7 + h); g.fill(); g.fillStyle = c3; g.beginPath(); g.moveTo(x, y + 14); g.lineTo(x + 14, y + 7); g.lineTo(x + 14, y + 7 + h); g.lineTo(x, y + 14 + h); g.fill(); } };
    for (let j = 0; j < 5; j++) for (let i = 0; i < 5; i++) iso(i, j, (i + j) % 2 ? '#2f9e44' : '#3bb152');
    iso(1, 1, '#9aa3b8', '#4a5368', '#6b7488', 14); iso(3, 2, '#ffd23f', '#c99a00', '#e0b020', 10); iso(2, 3, '#3ee6ff', '#1c7ea1', '#2bb5d6', 18);
    g.fillStyle = '#98a6cf'; g.font = '6px "Press Start 2P"'; g.fillText('ISOMETRICO: 3 caras visibles', 6, H - 6);
  } else if (kind === '3d') {
    g.strokeStyle = '#2b3a6b'; g.lineWidth = 1; for (let i = 0; i <= 8; i++) { g.beginPath(); g.moveTo(W / 2, 40); g.lineTo(i * W / 8, H); g.stroke(); } for (let k = 0; k < 6; k++) { const y = 40 + Math.pow(k / 6, 2) * (H - 40) + 8; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    px(W / 2 - 4, 36, 8, 8, '#ffd23f'); px(W / 2 - 30, 70, 20, 30, '#ff5fb4'); px(W / 2 + 30, 90, 36, 54, '#3ee6ff'); px(20, 100, 50, 70, '#7cff6b');
    g.fillStyle = '#98a6cf'; g.font = '6px "Press Start 2P"'; g.fillText('3D: profundidad real (eje Z)', 6, 12);
  } else if (kind === 'fp') {
    g.strokeStyle = '#2b3a6b'; for (let i = 0; i <= 6; i++) { g.beginPath(); g.moveTo(W / 2, H / 2); g.lineTo(i * W / 6, H); g.stroke(); g.beginPath(); g.moveTo(W / 2, H / 2); g.lineTo(i * W / 6, 0); g.stroke(); }
    px(W / 2 - 20, H / 2 - 12, 40, 24, '#1d2850'); px(W / 2 - 6, H / 2 - 4, 12, 8, '#ff5fb4');
    px(W - 70, H - 40, 70, 40, '#4a5368'); px(W - 60, H - 34, 14, 30, '#9aa3b8');
    g.strokeStyle = '#3ee6ff'; g.beginPath(); g.moveTo(W / 2 - 8, H / 2); g.lineTo(W / 2 + 8, H / 2); g.moveTo(W / 2, H / 2 - 8); g.lineTo(W / 2, H / 2 + 8); g.stroke();
    g.fillStyle = '#98a6cf'; g.font = '6px "Press Start 2P"'; g.fillText('1RA PERSONA: la camara es el jugador', 6, 12);
  } else if (kind === 'tp') {
    g.strokeStyle = '#2b3a6b'; for (let i = 0; i <= 6; i++) { g.beginPath(); g.moveTo(W / 2, 30); g.lineTo(i * W / 6, H); g.stroke(); }
    px(W / 2 - 40, 60, 24, 30, '#7cff6b'); px(W / 2 + 30, 50, 20, 28, '#ffd23f');
    g.drawImage(sprite('player', 4), W / 2 - 24, H - 60);
    g.fillStyle = '#98a6cf'; g.font = '6px "Press Start 2P"'; g.fillText('3RA PERSONA: camara detras', 6, 12);
  } else if (kind === '25d') {
    px(0, H - 30, W, 30, '#2f9e44'); for (let i = 0; i < 6; i++) px(i * 40 + 10, 50 + (i % 2) * 20, 24, H - 80 - (i % 2) * 20, i % 2 ? '#1d2850' : '#2b3a6b');
    g.drawImage(sprite('player', 3), 60, H - 66); g.drawImage(sprite('enemy', 3), 160, H - 54);
    g.fillStyle = '#98a6cf'; g.font = '6px "Press Start 2P"'; g.fillText('2.5D: escena 3D, movimiento en 2D', 6, 12);
  }

/* ---------- Hero animado (inicio) ---------- */
function startHero(cv) {
  const g = cv.getContext('2d'); g.imageSmoothingEnabled = false; const W = cv.width, H = cv.height; let t = 0, raf;
  const stars = Array.from({ length: 40 }, (_, i) => ({ x: (i * 97) % W, y: (i * 53) % (H - 40), s: 1 + (i % 2) }));
  const coins = [50, 120, 190, 260];
  function frame() {
    if (!document.body.contains(cv)) { cancelAnimationFrame(raf); return; }
    t += 0.016; g.fillStyle = '#0b0f1e'; g.fillRect(0, 0, W, H);
    stars.forEach(s => { g.fillStyle = Math.sin(t * 3 + s.x) > 0 ? '#5f6d99' : '#2b3a6b'; g.fillRect(s.x, s.y, s.s, s.s); });
    for (let x = 0; x < W; x += 16) g.drawImage(sprite('grass', 2), x, H - 16);
    g.drawImage(sprite('brick', 2), 180, H - 48); g.drawImage(sprite('brick', 2), 196, H - 48);
    coins.forEach((cx, i) => g.drawImage(sprite('coin', 2), cx, H - 50 + Math.sin(t * 4 + i) * 3));
    const ex = 100 + Math.sin(t * 1.2) * 60; g.drawImage(sprite('enemy', 2), ex, H - 32);
    const py = H - 40 - Math.abs(Math.sin(t * 2.5)) * 30; g.drawImage(sprite('player', 2), 30, py);
    g.drawImage(sprite('flag', 2), W - 30, H - 32);
    g.fillStyle = '#ffd23f'; g.font = '8px "Press Start 2P"'; g.fillText('PRESS START', W / 2 - 44 + (Math.sin(t * 6) > 0 ? 0 : 0), 20);
    g.globalAlpha = Math.sin(t * 6) > 0 ? 1 : 0; g.fillText('_', W / 2 + 44, 20); g.globalAlpha = 1;
    raf = requestAnimationFrame(frame);
  }
  frame();
}

function renderGlossary(filterCat, query, highlight) {
  const body = $('#gloBody');
  const q = (query || '').trim().toLowerCase();
  const list = GLOSSARY.filter(t => (!filterCat || t.c === filterCat) && (!q || t.en.toLowerCase().includes(q) || t.es.toLowerCase().includes(q) || t.ej.toLowerCase().includes(q)));
  body.innerHTML = `
    <div class="glo-tools">
      <input id="gloQ" type="search" placeholder="Buscar término… (ej: sprite, bug, loop)" value="${esc(query || '')}">
      <span class="chip">${list.length} términos</span>
    </div>
    <div class="glo-cat">
      <button data-c="" class="${!filterCat ? 'on' : ''}">Todos</button>
      ${Object.entries(GLO_CATS).map(([k, v]) => `<button data-c="${k}" class="${filterCat === k ? 'on' : ''}">${v}</button>`).join('')}
    </div>
    ${list.map(t => `<div class="term ${highlight && t.en.toLowerCase() === highlight.toLowerCase() ? 'hl' : ''}" id="term-${t.en.replace(/\W+/g, '-')}">
        <span class="cat">${GLO_CATS[t.c]}</span><div class="en">${esc(t.en)}</div>
        <div class="es">${esc(t.es)}</div>
        <div class="ej"><b>Ejemplo:</b> ${esc(t.ej)}</div>
        ${t.ill && t.ill !== 'loop' ? `<div class="ill"><canvas data-spr="${t.ill}" width="16" height="16"></canvas></div>` : ''}
        ${t.ill === 'loop' ? `<div class="ill small muted">JUGADOR → ACCIÓN → DESAFÍO → RESULTADO → ↺</div>` : ''}
      </div>`).join('') || '<p class="muted">Sin resultados.</p>'}`;
  $$('canvas[data-spr]', body).forEach(cv => { const s = sprite(cv.dataset.spr, 1); cv.width = s.width; cv.height = s.height; cv.getContext('2d').drawImage(s, 0, 0); });
  const inp = $('#gloQ'); inp.oninput = () => { renderGlossary(filterCat, inp.value); $('#gloQ').focus(); const v = $('#gloQ'); v.setSelectionRange(v.value.length, v.value.length); };
  $$('.glo-cat button', body).forEach(b => b.onclick = () => renderGlossary(b.dataset.c || null, $('#gloQ').value));
  if (highlight) { const el = $('.term.hl', body); if (el) setTimeout(() => el.scrollIntoView({ block: 'center' }), 30); }
}
function openGlossary(term) { renderGlossary(null, term ? term : '', term); openOvl('ovlGlossary'); }

function gddText() {
  const g = STATE.gdd || {};
  return `FICHA DE DISEÑO (GDD) — v1\n${'='.repeat(32)}\n` + GDD_FIELDS.map(f => `${f.l}: ${(g[f.k] || '').trim() || '(sin completar)'}`).join('\n') + `\n\nAlcance: primera versión jugable con gráficos provisionales (figuras geométricas).\nTecnología: HTML + JavaScript + Phaser, desarrollado con Google Antigravity.`;
}
function gddComplete() { return GDD_FIELDS.filter(f => (STATE.gdd[f.k] || '').trim()).length; }
function promptText(p) {
  if (p.gdd && gddComplete() > 0) return p.text.replace('[PEGAR FICHA]', gddText());
  return p.text;
}
function promptBox(id, opts) {
  const p = PROMPTS.find(x => x.id === id); opts = opts || {};
  const filled = p.gdd && gddComplete() > 0;
  let body = esc(p.text).replace(/\[([^\]]+)\]/g, (m, v) => filled && v === 'PEGAR FICHA' ? `<span class="filled">${esc(gddText())}</span>` : `<span class="ph-var">[${esc(v)}]</span>`);
  return `<div class="prompt-box" data-prompt="${id}">
    <div class="ph"><span class="t">${esc(p.title)}</span>
      <span style="display:flex;gap:6px;flex-wrap:wrap">
        ${p.gdd ? `<span class="chip small">${filled ? `✔ incluye tu GDD (${gddComplete()}/8 campos)` : 'completá el GDD en el Bloque 04 y se insertará solo'}</span>` : ''}
        <button class="btn sm primary" data-copy-prompt="${id}">⧉ Copiar</button>
      </span></div>
    <pre>${body}</pre></div>`;
}

      objective: 'Comprender cómo se estructura un videojuego, diseñar una propuesta propia y desarrollar un primer prototipo funcional mediante Antigravity.',
      deliverable: 'Videojuego básico con personaje, movimiento, escenario y objetivo.',
      blocks: [
        /* ---------- BLOQUE 01 ---------- */
        {
          id: 'b1', num: '01', title: 'Presentación del curso', start: 0, end: 20, html: () => `
          <div class="grid c2">
            <div class="card"><span class="ico" style="color:var(--acc)">▣</span><h3>¿Qué es un videojuego?</h3><p>Un sistema de <b>reglas</b> + un <b>objetivo</b> + <b>decisiones</b> del jugador, con <dfn>Feedback</dfn> inmediato. Si sacás cualquiera de los cuatro, deja de ser un juego: sin reglas es un juguete, sin objetivo es un simulador, sin decisiones es una película.</p></div>
            <div class="card"><span class="ico" style="color:var(--acc3)">⚒</span><h3>¿Qué es desarrollar videojuegos?</h3><p>Convertir una idea en algo que <b>funciona</b>: diseño (qué pasa), programación (cómo pasa), arte (cómo se ve), sonido (cómo se escucha) y pruebas (si de verdad funciona). Hoy una sola persona puede cubrir todo con ayuda de la IA.</p></div>
            <div class="card"><span class="ico" style="color:var(--acc2)">✎</span><h3>¿Qué es ${dfn('Vibe Coding')}?</h3><p>Programar <b>describiendo</b> lo que querés en lenguaje natural y dejando que la IA escriba el código. Vos dirigís: definís, probás, corregís. No necesitás saber sintaxis; necesitás saber <b>qué querés</b> y <b>cómo verificarlo</b>.</p></div>
            <div class="card"><span class="ico" style="color:var(--acc4)">⚙</span><h3>¿Qué es un ${dfn('Agent', 'agente de IA')}?</h3><p>Una IA que no sólo responde texto: <b>crea archivos</b>, <b>ejecuta</b> el proyecto, <b>lee errores</b> y los corrige. Le hablás como a un colaborador técnico, no como a un buscador.</p></div>
            <div class="card"><span class="ico" style="color:var(--acc)">◆</span><h3>Cómo usaremos Google Antigravity</h3><p>Antigravity es nuestro ${dfn('IDE', 'entorno de desarrollo')} con agente integrado. Flujo: <b>carpeta de proyecto → prompt → el agente genera y ejecuta → vista previa en el navegador → pedimos cambios</b>. El docente lo hará en vivo; ustedes replican en paralelo.</p></div>
            <div class="card"><span class="ico" style="color:var(--acc3)">★</span><h3>Qué construiremos en 4 encuentros</h3><p><b>E01</b> prototipo jugable con formas · <b>E02</b> identidad visual y personaje animado · <b>E03</b> mecánicas, niveles y enemigos · <b>E04</b> pulido y publicación con link propio. Cada participante elige <b>su</b> videojuego.</p></div>
          </div>

          <div class="panel">
            <div class="panel-title"><h3>🎮 Demostración interactiva: el mismo juego, dos apariencias</h3>
              <div class="seg" id="demoToggle"><button data-v="plain" class="on">Formas geométricas</button><button data-v="styled">Con sprites</button></div></div>
            <p class="muted small">Primero se construye el <b>funcionamiento</b>; después se mejora la <b>apariencia</b>. El código de reglas, movimiento y colisiones es idéntico en ambas versiones. Sólo cambia la capa de dibujo.</p>
            <div data-mount="demoGame"></div>
          </div>

          ${ocem('Qué es un juego, qué es un agente, y que el funcionamiento va antes que la estética (demo formas vs. sprites).', 'El docente muestra Antigravity abierto con su propio proyecto vacío: la carpeta donde nacerá su juego.', 'Jugar la demo y responder las cuatro preguntas de la actividad en voz alta.')}

          ${activity('Analizá la demo', ['¿<b>Qué controla</b> el jugador?', '¿<b>Qué debe conseguir</b>?', '¿<b>Qué obstáculos</b> encuentra?', '¿<b>Cómo se gana</b>?'], `<div data-mount="demoQuiz"></div>`)}`
        },
        /* ---------- BLOQUE 02 ---------- */
        {
          id: 'b2', num: '02', title: 'Anatomía de un videojuego', start: 20, end: 45, html: () => `
          <p class="lead">Todo videojuego, de Tetris a Zelda, se arma con las mismas <b>nueve piezas</b>. Si las podés nombrar, podés diseñarlo. Y si las podés escribir, podés pedírselo a una IA. Tocá cada pieza.</p>
          <div class="grid c3" data-mount="anatomy"></div>

          <div class="panel">
            <h3>⟳ Esquema interactivo: el ${dfn('Core Loop', 'Core Gameplay Loop')}</h3>
            <p class="muted small">Es el latido del juego: lo que se repite cada pocos segundos. Hacé clic en cada nodo.</p>
            <div data-mount="coreLoop"></div>
          </div>

          ${ocem('Las nueve piezas y el ciclo JUGADOR → ACCIÓN → DESAFÍO → RESULTADO → NUEVA ACCIÓN.', 'El docente describe en voz alta el core loop de SU juego y lo anota en su ficha.', 'Cada estudiante elige un juego conocido y descompone su ciclo.')}

          ${activity('Analizá un videojuego conocido', ['Elegí un juego que conozcas bien (Mario, Candy Crush, Minecraft, FIFA, Among Us…).', 'Identificá las nueve piezas de la anatomía.', 'Escribí su core loop en una sola línea con flechas.', 'Compartilo en 30 segundos con el grupo.'], `<div data-mount="loopWriter"></div>`)}`
        },
        /* ---------- BLOQUE 03 ---------- */
        {
          id: 'b3', num: '03', title: 'Géneros, perspectivas y cámaras', start: 45, end: 70, html: () => `
          <p class="lead">Antes de elegir qué juego hacer, hay que conocer el menú. Tres dimensiones de decisión: <b>cuántas dimensiones</b> tiene el mundo, <b>desde dónde</b> lo mira la cámara, y <b>qué género</b> define la experiencia.</p>
          <h3 style="margin-top:18px">Dimensiones</h3>
          ${defs([['2D', 'Todo ocurre en un plano: ancho y alto. Más simple de construir, ideal para este curso. <i>Mario, Celeste, Stardew Valley.</i>'], ['2.5D', 'Gráficos con profundidad (3D o capas), pero el movimiento es en 2D. <i>Little Nightmares, Trine.</i>'], ['3D', 'Mundo con ancho, alto y profundidad real. La cámara puede moverse en cualquier dirección. <i>Minecraft, Zelda BotW, Fortnite.</i>']])}
          <h3 style="margin-top:22px">Perspectivas y cámaras</h3>
          <div class="persp">
            <div class="card"><canvas data-persp="25d" width="160" height="90"></canvas><h3>2.5D</h3><p class="small muted">Escena con volumen, movimiento lateral.</p></div>
            <div class="card"><canvas data-persp="iso" width="160" height="90"></canvas><h3>Isométrico</h3><p class="small muted">Vista en diagonal desde arriba. <i>Diablo, Hades, Age of Empires.</i></p></div>
            <div class="card"><canvas data-persp="3d" width="160" height="90"></canvas><h3>3D</h3><p class="small muted">Profundidad real con perspectiva.</p></div>
            <div class="card"><canvas data-persp="fp" width="160" height="90"></canvas><h3>Primera persona</h3><p class="small muted">Ves por los ojos del personaje. <i>Minecraft, Portal, Doom.</i></p></div>
            <div class="card"><canvas data-persp="tp" width="160" height="90"></canvas><h3>Tercera persona</h3><p class="small muted">La cámara sigue al personaje desde atrás. <i>GTA, Mario Odyssey.</i></p></div>
          </div>
          <p class="callout small">Las vistas <b>3D, primera y tercera persona</b> se explican aquí visualmente: durante este curso trabajaremos en <b>2D</b>, que es donde la IA genera resultados sólidos y rápidos para principiantes.</p>

          <h3 style="margin-top:22px">Géneros 2D — jugalos</h3>
          <div class="panel"><div class="panel-title"><h3>▶ Plataformas 2D</h3><span class="chip">Lateral · gravedad · salto</span></div><p class="small muted">El personaje se mueve horizontalmente y puede saltar. El desafío es el <b>espacio</b>: huecos, alturas, pinchos. <i>Mario, Sonic, Celeste.</i></p><div data-mount="platformer"></div></div>
          <div class="panel"><div class="panel-title"><h3>▶ Top-down 2D</h3><span class="chip">Cenital · 4 direcciones · sin gravedad</span></div><p class="small muted">Se ve desde arriba y se mueve en cuatro direcciones. El desafío es la <b>exploración</b>: laberintos, llaves, enemigos que patrullan. <i>Zelda clásico, Pokémon, Stardew.</i></p><div data-mount="topdown"></div></div>
          <div class="panel"><div class="panel-title"><h3>▶ Puzzle 2D</h3><span class="chip">Lógica · turnos · sin tiempo</span></div><p class="small muted">No hay reflejos: hay <b>pensar</b>. Cada acción cambia el estado y hay que encontrar la secuencia correcta. <i>Tetris, Candy Crush, Baba Is You.</i></p><div data-mount="puzzle"></div></div>
          ${defs([['Arcade', 'Partidas cortas, dificultad creciente, puntaje alto. <i>Pac-Man, Flappy Bird, Space Invaders.</i> Se puede combinar con cualquier perspectiva.'], ['Combinaciones', 'Los géneros se mezclan: un top-down puede tener puzzles; un plataformas puede ser arcade. Elegí <b>uno principal</b> para la primera versión.']])}

          ${ocem('Dimensiones, cámaras y géneros con las tres demos jugables.', 'El docente anuncia el género y perspectiva de SU juego y justifica la elección en una frase.', 'Cada estudiante elige y registra género + perspectiva (quedan guardados para la ficha GDD).')}

          ${activity('Elegí el género y la perspectiva de tu videojuego', ['Seleccioná <b>un</b> género principal y <b>una</b> perspectiva.', 'Pensá: ¿qué juego conocido se parece a lo que quiero hacer?', 'Tu elección se copia automáticamente a la ficha GDD del Bloque 04.'], `<div data-mount="genrePicker"></div>`)}`
        },
        /* ---------- BLOQUE 04 ---------- */
        {
          id: 'b4', num: '04', title: 'Game Design Document (GDD)', start: 70, end: 100, html: () => `
          <div class="two">
            <div class="card"><h3>¿Qué es un GDD?</h3><p>Un <b>Game Design Document</b> es la descripción escrita del juego: qué es, cómo se juega, qué lo hace ganar o perder. En la industria ocupa decenas de páginas. Para nosotros alcanza con <b>una ficha de 8 campos</b>.</p></div>
            <div class="card"><h3>¿Por qué antes de pedírselo a la IA?</h3><p>La IA hace exactamente lo que le pedís. Si le pedís "un juego", te inventa uno. Si le das una ficha precisa, construye <b>el tuyo</b>. Una ficha clara = menos iteraciones, menos errores, menos frustración. <b>Definir es la mitad del trabajo.</b></p></div>
          </div>
          <div class="callout"><b>Regla de oro:</b> si no podés escribirlo en una frase, todavía no lo tenés diseñado. Objetivos vagos ("que sea divertido") producen juegos vagos.</div>

          <div class="panel">
            <div class="panel-title"><h3>📝 Tu ficha de diseño</h3><span class="chip" id="gddCount"></span></div>
            <p class="small muted">Se guarda automáticamente en este navegador y dispositivo mientras escribís. Podés exportarla como .txt para no perderla. Después se copia directo a Antigravity con el Prompt 1.</p>
            <div data-mount="gdd"></div>
          </div>

          ${ocem('Qué es un GDD y por qué definir antes de generar.', 'El docente completa SU ficha en vivo, en voz alta, mostrando cómo convertir ideas vagas en frases precisas.', 'Cada estudiante completa su ficha. El docente recorre y ayuda a afinar objetivos y condiciones de victoria.')}

          ${activity('Completá tu ficha', ['Completá los 8 campos. Si dudás en uno, poné la versión más simple posible.', 'Leé la ficha de otro compañero: ¿entendés el juego sin preguntar nada? Si no, falta precisión.', 'Copiá o descargá el documento. Lo vas a pegar en el Bloque 06.'])}`
        },
        /* ---------- PAUSA ---------- */
        {
          id: 'pause', num: '☕', title: 'Pausa', start: 100, end: 110, pause: true, html: () => `
          <div class="timer panel">
            <h2>☕ PAUSA</h2>
            <p class="muted">Diez minutos. Estirá, tomá agua, guardá tu ficha.</p>
            <div data-mount="timer"></div>
          </div>`
        },
        /* ---------- BLOQUE 05 ---------- */
        {
          id: 'b5', num: '05', title: 'Introducción a Google Antigravity', start: 110, end: 140, html: () => `
          <p class="lead">Diez conceptos. No hay que memorizarlos: hay que <b>reconocerlos</b> cuando el agente los menciona.</p>
          ${defs([
            [dfn('IDE', 'Entorno de desarrollo'), 'El programa donde se escribe, ejecuta y prueba el código. Antigravity es uno, con IA adentro.'],
            [dfn('Agent', 'Agente de IA'), 'El colaborador que escribe código, crea archivos y ejecuta comandos a partir de tus instrucciones.'],
            ['Carpeta de proyecto', 'Una carpeta común de tu computadora donde vive TODO el juego. Nada fuera de ella forma parte del juego.'],
            ['HTML', 'El esqueleto de la página: qué elementos existen. El archivo <code>index.html</code> es la puerta de entrada.'],
            ['CSS', 'La apariencia de la página: colores, tamaños, posiciones. En un juego Phaser casi todo lo visual lo dibuja el juego, no el CSS.'],
            ['JavaScript', 'El comportamiento: qué pasa cuando apretás una tecla, cuando chocás, cuando ganás. Es donde vive la lógica del juego.'],
            [dfn('Phaser'), 'Framework de JavaScript para juegos 2D. Ya trae físicas, sprites, animaciones, cámaras y sonido.'],
            [dfn('Preview', 'Vista previa'), 'La pestaña del navegador donde ves el proyecto funcionando mientras lo construís.'],
            [dfn('Terminal'), 'Una ventana de texto donde se dan órdenes a la computadora. El agente la usa; vos sólo necesitás leer lo que dice.'],
            ['Ejecutar un proyecto', 'Encender el servidor local y abrir la vista previa. Si cambia el código, la vista se actualiza.']
          ])}

          <div class="panel">
            <h3>📁 Cómo se organiza un proyecto sencillo</h3>
            <p class="small muted">Pasá el mouse por cada elemento. Si el framework pide otra estructura, se respeta la del framework: esto es una referencia, no una regla.</p>
            <div class="tree">
<span class="d">proyecto-videojuego/</span>
├── <span class="f" title="Puerta de entrada. El navegador abre este archivo primero.">index.html</span>          <span class="cm">← el navegador empieza acá</span>
├── <span class="d" title="Código fuente: la lógica del juego en JavaScript.">src/</span>                 <span class="cm">← la lógica (JavaScript)</span>
│   ├── <span class="f">main.js</span>          <span class="cm">← configuración de Phaser</span>
│   └── <span class="f">scenes/</span>          <span class="cm">← menú, nivel, game over</span>
├── <span class="d" title="Recursos: imágenes, sonidos, fuentes.">assets/</span>              <span class="cm">← imágenes y sonidos</span>
│   ├── <span class="f">sprites/</span>
│   └── <span class="f">audio/</span>
└── <span class="f" title="Lista de dependencias y comandos. Lo crea el agente cuando hace falta.">package.json</span>         <span class="cm">← sólo cuando corresponda</span></div>
          </div>

          ${ocem('Los diez conceptos y la estructura de carpetas.', 'El docente abre Antigravity, crea la carpeta de SU juego, pide al agente una página de prueba y la ejecuta. Muestra la terminal y la vista previa.', 'Cada estudiante repite los 6 pasos y marca la lista de verificación.')}

          ${activity('Preparación del entorno — paso a paso', [], `
          <ol class="steps">
            <li><b>Abrir Antigravity.</b> Esperá a que cargue por completo. Iniciá sesión si lo pide.</li>
            <li><b>Crear una carpeta de proyecto.</b> Nombre sin espacios ni tildes: <code>mi-videojuego</code>. Abrila desde Antigravity (<i>Open folder</i>).</li>
            <li><b>Abrir el asistente de IA</b> (el panel del agente). Vas a escribir ahí todos los prompts.</li>
            <li><b>Crear la estructura inicial.</b> Pedile: <i>"Creá un proyecto web mínimo con index.html que muestre el título 'Mi videojuego' centrado en pantalla negra. Ejecutalo y decime cómo verlo."</i></li>
            <li><b>Ejecutar.</b> El agente levanta el servidor y te da una dirección (ej: <code>http://localhost:5173</code>). Abrila.</li>
            <li><b>Comprobar en el navegador.</b> ¿Ves el título? Listo. Si no, copiá el error de la terminal y pegalo al agente: <i>"Apareció este error: …"</i></li>
          </ol>
          <div data-mount="envChecklist"></div>`)}`
        },
        /* ---------- BLOQUE 06 ---------- */
        {
          id: 'b6', num: '06', title: 'Primer prompt y prototipo', start: 140, end: 175, html: () => `
          <p class="lead"><b>Objetivo:</b> transformar la ficha GDD en una primera versión jugable. Dos prompts, en orden. El primero <b>planifica</b> (la IA no programa todavía); el segundo <b>construye</b>. Separar pensar de hacer evita juegos inflados y rotos.</p>
          <div class="callout"><b>¿Por qué "no programes todavía"?</b> Si pedís el juego directo, la IA decide por vos y agrega sistemas que no pediste. Primero leé su plan: si algo sobra, decile que lo saque. Recién después das la orden de construir.</div>
          ${promptBox('p1')}
          <p class="small muted">Leé la respuesta del agente. Si propone más de lo que pediste (menús, niveles, sonido), respondé: <i>"Dejá sólo lo indispensable para la primera versión"</i>. Cuando el plan sea el correcto, mandá el Prompt 2.</p>
          ${promptBox('p2')}

          ${ocem('Los dos prompts, línea por línea: qué pide cada frase y por qué está ahí.', 'El docente pega SU ficha en el Prompt 1, revisa el plan, ajusta, y lanza el Prompt 2. Muestra el primer prototipo con rectángulos.', 'Cada estudiante genera, ejecuta y prueba su primer videojuego. El docente recorre los puestos.')}

          ${activity('Generar, ejecutar y probar el primer videojuego', ['Copiá el Prompt 1 (ya incluye tu ficha) y pegalo en Antigravity.', 'Leé el plan. Pedí que simplifique si hace falta.', 'Pegá el Prompt 2. Esperá a que termine y ejecute.', 'Abrí el juego en el navegador. Movete. ¿Se puede ganar?', 'Si aparece un error, no lo arregles vos: copiá el mensaje y pedí la corrección (Bloque 08).'])}`
        },
        /* ---------- BLOQUE 07 ---------- */
        {
          id: 'b7', num: '07', title: 'Iteración y mejoras', start: 175, end: 205, html: () => `
          <div class="grid c2">
            <div class="card"><h3>¿Qué significa ${dfn('Iteration', 'iterar')}?</h3><p>Hacer un cambio <b>pequeño</b>, probarlo, y recién después hacer el siguiente. Un juego no se escribe: se <b>ajusta</b> cien veces.</p></div>
            <div class="card"><h3>¿Por qué no pedir muchos cambios a la vez?</h3><p>Si pedís cinco cosas y algo se rompe, no sabés cuál fue. Si pedís una, lo sabés al instante. <b>Un cambio = una prueba = una certeza.</b></p></div>
            <div class="card"><h3>Cómo describir una modificación</h3><p>Decí <b>qué</b> (el elemento), <b>cómo</b> está ahora y <b>cómo</b> debería quedar. Ej: <i>"El personaje salta muy poco: ahora pasa apenas un bloque, quiero que pase dos"</i>.</p></div>
            <div class="card"><h3>Cómo conservar lo que ya funciona</h3><p>Decilo explícitamente: <i>"conservá los controles y la condición de victoria"</i>. La IA tiende a reescribir de más si no la limitás.</p></div>
            <div class="card"><h3>Cómo comprobar los cambios</h3><p>Antes de pedir, anotá <b>cómo vas a verificar</b>. Después del cambio, probá exactamente eso, y también lo que ya funcionaba (que no se haya roto).</p></div>
          </div>
          ${promptBox('p3')}

          ${ocem('Iterar de a un cambio, describir con precisión, conservar lo existente, verificar.', 'El docente aplica un cambio a SU juego con el Prompt 3 (ej: cambiar la velocidad), verifica, y luego otro.', 'Cada estudiante realiza tres modificaciones controladas y anota qué verificó en cada una.')}

          ${activity('Tres modificaciones controladas', ['Elegí 3 cambios de la lista (o inventá los tuyos). Uno a la vez.', 'Para cada uno: completá <b>[DESCRIBIR CAMBIO]</b>, pedí, probá, anotá.'], `
          <div class="pill-list" style="margin-top:10px">
            <span class="pill" data-change="Cambiar la velocidad del personaje: ahora se mueve lento, quiero que sea un 50% más rápido.">Velocidad del personaje</span>
            <span class="pill" data-change="Modificar el tamaño del escenario: hacerlo el doble de ancho, manteniendo la cámara siguiendo al personaje.">Tamaño del escenario</span>
            <span class="pill" data-change="Incorporar un obstáculo nuevo (un bloque fijo) en el medio del recorrido que el jugador deba esquivar o saltar.">Nuevo obstáculo</span>
            <span class="pill" data-change="Cambiar la dificultad: los enemigos se mueven más rápido y hay uno más.">Dificultad</span>
            <span class="pill" data-change="Modificar los controles: usar las teclas W A S D además de las flechas.">Controles</span>
          </div>
          <div data-mount="changeLog"></div>`)}`
        },
        /* ---------- BLOQUE 08 ---------- */
        {
          id: 'b8', num: '08', title: 'Debugging y pruebas', start: 205, end: 225, html: () => `
          <div class="grid c3">
            <div class="card"><h3>¿Qué es un ${dfn('Bug')}?</h3><p>Una diferencia entre lo que el juego <b>debería</b> hacer y lo que <b>hace</b>. No es un misterio: es una regla mal escrita.</p></div>
            <div class="card"><h3>¿Qué es ${dfn('Debugging')}?</h3><p>El proceso de <b>encontrar la causa</b> y corregirla. Primero entender, después tocar.</p></div>
            <div class="card"><h3>Cómo identificar un error</h3><p>Tres fuentes: lo que <b>ves</b> en el juego, lo que dice la <b>consola</b> del navegador (F12) y lo que dice la <b>terminal</b>.</p></div>
            <div class="card"><h3>Describir lo que debería ocurrir</h3><p><i>"Cada moneda debería sumar 10 puntos al puntaje."</i> Concreto, medible.</p></div>
            <div class="card"><h3>Explicar lo que realmente ocurre</h3><p><i>"El puntaje marca 10 después de la primera moneda y no cambia más."</i> Describí, no interpretes.</p></div>
            <div class="card"><h3>Pedir una corrección precisa</h3><p>Esperado + real + pasos para reproducirlo + <b>"la corrección más pequeña"</b>. Nunca "arreglá todo".</p></div>
          </div>

          <div class="panel">
            <div class="panel-title"><h3>🐞 Demostración: un juego con un bug intencional</h3>
              <span style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" id="bugReveal">🔍 Revelar causa</button><button class="btn sm primary" id="bugFix">🩹 Aplicar corrección</button></span></div>
            <p class="small muted">Jugá y juntá varias monedas. Mirá el puntaje. ¿Hace lo que debería?</p>
            <div data-mount="bugGame"></div>

  $$('canvas[data-spr]', el).forEach(cv => cv.getContext('2d').drawImage(sprite(cv.dataset.spr, 2), 0, 0));
  const cv = $('#tileCv'), g = cv.getContext('2d');
